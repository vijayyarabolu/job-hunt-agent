# How each ATS handles a resume (GOAL4 §3 addition): vendor-documented behavior ONLY, one line per fact, each with
# the vendor page it comes from (https). An empty list means "not publicly documented" and the app says exactly that.
# Researched 2026-10-05; every source was opened and its wording checked (notes: docs/decisions/009-ats-profiles.md).
# Sections, shown in this order in "Copy JD + keywords":
#   parsing     what the parser needs / what breaks it
#   file_types  accepted files, size limits, PDF vs DOCX
#   ranking     auto-rank / AI matching vs recruiter keyword search
#   questions   knockout / screening questions
#   keywords    exact wording advice
#   acronyms    acronym vs spelled-out forms
#   placement   skills section vs bullets
# questions_api: whether the public posting API exposes the application questions (true / false / undocumented).
# GOAL5 §3 (decision 010): every fact has an id; `model:` scores a job's resumes the way the vendor documents matching:
#   channels: [{name, cite: [fact ids], skills: literal|taxonomy, related|required_weight|preferred_zero|title|years|grade:
#             [fact ids]}]  (a feature is off unless it cites a fact; numbers we choose are listed in vendor_model.OURS)
#   parse_checks: {tables|text_boxes|header_footer_text|columns|images|file_type|max_mb: {cite, effect: degrade|block|tip,
#                  value}}
#   detect_hosts: apply/posting hosts that identify the vendor behind another board or a company domain
# No model or no channel: the generic keyword % under "matching not publicly documented".
workday:
  label: Workday
  parsing:
  - id: wd-parsing-1
    text: Workday autofills your application from your resume but never autofills Skills or Languages, so type those in
      yourself.
    source: https://doc.workday.com/admin-guide/en-us/human-capital-management/recruiting/candidates/set-up-prospects-and-candidates/hdc1552497830785.html
  - id: wd-parsing-2
    text: Workday says parsing varies with format and word order and works best on resumes without images or image-based
      styles.
    source: https://doc.workday.com/admin-guide/en-us/human-capital-management/recruiting/candidates/set-up-prospects-and-candidates/hdc1552497830785.html
  - id: wd-parsing-3
    text: Workday's resume parse fills personal and contact information, work experience, education and languages.
    quote: 'The parsed data includes: Personal and contact information Work experience Education Languages'
    source: https://doc.workday.com/workday-education/en-us/course-manuals/recruiting-for-administrators/prospects-and-candidates.html
  - id: wd-parsing-4
    text: HiredScore's parsed 'smart resume' (which its grading uses) supports only DOC, DOCX, PDF, RTF and TXT, a narrower
      list than Workday's own parser (which also takes HTM/HTML).
    quote: 'HiredScore supports these file types for resume attachments: DOC, DOCX, PDF, RTF, and TXT.'
    source: https://doc.workday.com/hiredscore/en-us/workday-hiredscore/recruiter-productivity-/concept--candidate-profiles.html
  - id: wd-parsing-5
    text: Workday keeps the exact skill wording a candidate enters, even when Skills Cloud maps it to a synonym or canonical
      skill.
    quote: Workday always retains the skill string that a candidate enters, even if that skill gets added as a synonym or
      canonical skill to the Skills Cloud.
    source: https://doc.workday.com/admin-guide/en-us/human-capital-management/recruiting/recruiting-setup/qqz1592342635105.html
  - id: wd-parsing-6
    text: A signed-in Candidate Home user applying again chooses between reusing the last application and uploading a new
      resume.
    quote: When signed in to Candidate Home and applying to another job, Workday prompts the applicant to choose between
      "Use my last application" or "Upload a new Resume or CV."
    source: https://doc.workday.com/workday-education/en-us/course-manuals/recruiting-for-administrators/prospects-and-candidates.html
  file_types:
  - id: wd-files-1
    text: Workday processes resumes in DOC, DOCX, HTM, HTML, PDF, RTF and TXT.
    source: https://doc.workday.com/admin-guide/en-us/human-capital-management/recruiting/candidates/candidate-skills-match/bmj1604095304483.html
  - id: wd-files-2
    text: Workday's documented ceiling for any attachment is 30 MB; an employer's site may set a lower limit.
    source: https://doc.workday.com/admin-guide/en-us/manage-workday/tenant-configuration/it-administrator-resources/limitations-and-availability/dan1370796659943.html
  ranking:
  - id: wd-ranking-1
    text: HiredScore grades your resume A to D against the posting's basic and preferred qualifications.
    source: https://doc.workday.com/hiredscore/en-us/workday-hiredscore/recruiter-productivity-/reference--candidate-grades.html
  - id: wd-ranking-2
    text: HiredScore gives no grade if you skip the resume or upload an unsupported format.
    source: https://doc.workday.com/hiredscore/en-us/workday-hiredscore/recruiter-productivity-/concept--spotlight.html
  - id: wd-ranking-3
    text: Fit & Gap uses an LLM to check each qualification one by one against your parsed resume.
    source: https://doc.workday.com/hiredscore/en-us/workday-hiredscore/recruiter-productivity-/concept--fit---gap.html
  - id: wd-ranking-4
    text: Skills Match compares skills from your application and resume with the requisition and weights required skills
      more; Workday plans to retire this feature.
    source: https://doc.workday.com/admin-guide/en-us/human-capital-management/recruiting/candidates/candidate-skills-match/bmj1604095304483.html
  - id: wd-ranking-5
    text: In Workday HiredScore a recruiter can run a keyword search inside a candidate's original (uploaded) resume; Workday
      does not document whether that search is exact-match, stemmed or synonym-aware.
    quote: Search for keywords in a candidate’s original resume.
    source: https://doc.workday.com/hiredscore/en-us/workday-hiredscore/recruiter-productivity-/concept--candidate-profiles.html
  - id: wd-ranking-6
    text: HiredScore Global Talent Search (searching past applicants) filters by name, location, years of experience, skills,
      education level and language.
    quote: Using Global Talent Search, you can filter for candidates by name, location, years of experience, skills, education
      level, and language.
    source: https://doc.workday.com/hiredscore/en-us/workday-hiredscore/recruiter-productivity-/concept--global-talent-search.html
  - id: wd-ranking-7
    text: Workday's Find Candidates report filters candidates by Skills Cloud skills and the employer's own maintained skills,
      i.e. by structured skills on the profile rather than free text.
    quote: Filter candidates by Skills Cloud skills and maintained skills.
    source: https://doc.workday.com/admin-guide/en-us/human-capital-management/recruiting/recruiting-setup/qqz1592342635105.html
  - id: wd-ranking-8
    text: Global Talent Search is described as a candidate pool search using text fields and filters.
    quote: Candidate pool search using text fields and filters.
    source: https://doc.workday.com/admin-guide/en-us/workday-feature-descriptions/workday-hiredscore/hiredscore-ai-for-recruiting.html
  - id: wd-ranking-9
    text: Workday's Skills Cloud is a skills ontology that uses graph technology to map how closely skills are related to
      each other, and includes skill suggestion and inference.
    quote: the skills cloud foundation leverages machine learning and uses graph technology to maintain this growing list
      of skills and map how closely skills are related to each other.
    source: https://blog.workday.com/en-us/how-workday-delivering-next-generation-skills-technology-scale.html
  - id: wd-ranking-10
    text: Workday says Skills Cloud consolidates the many synonyms a common skill can have.
    quote: Workday found that common skills can have up to 20-plus synonyms, which the skills cloud consolidates to reveal
      the relationship between skills
    source: https://newsroom.workday.com/2018-10-02-Workday-Delivers-Machine-Learning-Powered-Skills-Cloud-to-Unlock-Untapped-Workforce-Potential
  - id: wd-ranking-11
    text: In 2018 Workday said Skills Cloud would 'soon' let a hiring manager searching for one skill also see candidates
      with related skills; that is a forward-looking statement, and whether recruiter search does this today is not documented.
    quote: Soon, the skills cloud will have the ability to provide more comprehensive talent matching and recommendations.
      For example, a hiring manager searching for a candidate with a competency in “web design” would also be provided a
      candidate with “graphic design,” “web development,” and/or “Flash design” skills.
    source: https://newsroom.workday.com/2018-10-02-Workday-Delivers-Machine-Learning-Powered-Skills-Cloud-to-Unlock-Untapped-Workforce-Potential
  - id: wd-ranking-12
    text: Skills Cloud runs automated background clean-up that merges duplicate and synonymous skills.
    quote: Workday Skills Cloud performs regular automated background processes to clean up duplicate and synonymous skills
      in your tenant.
    source: https://doc.workday.com/admin-guide/en-us/human-capital-management/recruiting/recruiting-setup/qqz1592342635105.html
  - id: wd-ranking-13
    text: When a candidate applies, Workday reads the application and resume, pre-fills suggested skills, and the candidate
      can keep or remove them.
    quote: Once a candidate applies to a job, Workday assesses the content of the application and resume, and from that
      content, Workday suggests skills. Candidates can decide to keep or remove these prepopulated skills.
    source: https://doc.workday.com/workday-education/en-us/course-manuals/recruiting-for-administrators/prospects-and-candidates.html
  - id: wd-ranking-14
    text: Workday's machine-learning skill suggestions read the entire uploaded resume, not only its Skills section.
    quote: Machine learning uses logic to consider matches from the entire uploaded resume, not just the Skills section
    source: https://doc.workday.com/admin-guide/en-us/human-capital-management/recruiting/recruiting-setup/qqz1592342635105.html
  - id: wd-ranking-15
    text: Recruiters mark each requisition skill as required or optional.
    quote: Recruiters can select required or optional skills for job requisitions.
    source: https://doc.workday.com/admin-guide/en-us/human-capital-management/recruiting/recruiting-setup/qqz1592342635105.html
  - id: wd-ranking-16
    text: Candidate Skills Match does not consider how recently or how long a skill was used, or total years of experience.
    quote: 'Skills match score calculation doesn’t consider: How recently a candidate has acquired relevant skills. How
      long a candidate used relevant skills. Years of total work experience.'
    source: https://doc.workday.com/admin-guide/en-us/human-capital-management/recruiting/candidates/candidate-skills-match/bmj1604095304483.html
  - id: wd-ranking-17
    text: Candidate Skills Match shows Low or Unable to Score when the application or requisition is not in English, or
      has too little skills data.
    quote: 'Workday can’t calculate a skills match score and displays Low or Unable to Score when: Either or both the job
      application or job requisition are in another language than English. Either or both the job application or job requisition
      don’t have enough skills data.'
    source: https://doc.workday.com/admin-guide/en-us/human-capital-management/recruiting/candidates/candidate-skills-match/bmj1604095304483.html
  - id: wd-ranking-18
    text: HiredScore computes employment gaps and time in position from the parsed resume.
    quote: HiredScore calculates employment gaps and time in position.
    source: https://doc.workday.com/hiredscore/en-us/workday-hiredscore/recruiter-productivity-/concept--candidate-profiles.html
  - id: wd-ranking-19
    text: HiredScore does not grade candidates on campus or graduate requisitions, or when the requisition has no job description.
    quote: There’s no job description for the requisition. You’re reviewing candidates on a campus or graduate requisition.
    source: https://doc.workday.com/hiredscore/en-us/workday-hiredscore/recruiter-productivity-/concept--spotlight.html
  - id: wd-ranking-20
    text: 'Workday''s own grading example treats degree level and years of experience as qualifications: a candidate with
      a bachelor''s and 8 years, against a master''s-plus-10-years requisition, received a C.'
    quote: 'Example: You post a requisition for an engineer with a master’s degree and 10 years of experience. After reviewing
      grade A and B candidates, you screen a grade C candidate with a bachelor’s degree and 8 years of more relevant experience
      who you believe is a better fit for the role.'
    source: https://doc.workday.com/hiredscore/en-us/workday-hiredscore/recruiter-productivity-/concept--spotlight.html
  - id: wd-ranking-21
    text: Fit & Gap's LLM handles non-numeric requirements, and its per-qualification results feed the Spotlight grade.
    quote: These qualification-level results contribute to the overall Spotlight grade assigned to the application.
    source: https://doc.workday.com/hiredscore/en-us/workday-hiredscore/recruiter-productivity-/concept--fit---gap.html
  - id: wd-ranking-22
    text: Workday's guidance for HiredScore's job-reading AI recommends objective requirements (e.g. '2 years of experience
      in machine learning', a named degree or certification) over subjective ones (e.g. 'related degree', 'relevant knowledge
      of Python'), split by priority.
    quote: We recommend that you use objective rather than subjective requirements on job requisitions.
    source: https://doc.workday.com/hiredscore/en-us/workday-hiredscore/recruiter-productivity-/concept--job-descriptions.html
  - id: wd-ranking-23
    text: HiredScore Smart Candidate Profiles also produce AI insights from answers to application questions and cross-system
      data.
    quote: Provides AI-driven insights on candidates based on their responses to application questions and cross-system
      data.
    source: https://doc.workday.com/admin-guide/en-us/workday-feature-descriptions/workday-hiredscore/hiredscore-ai-for-recruiting.html
  - id: wd-ranking-24
    text: A 2021 HiredScore patent application (Google Patents lists it as abandoned; current assignee Workday) describes
      matching candidate experience to a job by training a model on similar and non-similar job-title/job-description pairs,
      using BERT-style vectors. A patent does not show what the shipping product does.
    quote: the model may use the representation vectors output from a language model such as Bidirectional Encoder Representations
      from Transformers (BERT).
    source: https://patents.google.com/patent/US20230088128A1/en
  questions:
  - id: wd-questions-1
    text: Workday questionnaires can score multiple-choice answers and automatically eliminate low scorers, so answer eligibility
      questions carefully.
    source: https://doc.workday.com/admin-guide/en-us/human-capital-management/recruiting/questionnaires/wjl1557399495805.html
  - id: wd-questions-2
    text: HiredScore has a Candidate Fast Lane automation that can automatically advance top-rated applicants to hiring-manager
      review.
    quote: Provides the ability to automatically advance top-rated applicants through the hiring process to the Hiring Manager
      review phase.
    source: https://doc.workday.com/admin-guide/en-us/workday-feature-descriptions/workday-hiredscore/hiredscore-ai-for-recruiting.html
  - id: wd-questions-3
    text: HiredScore shows recruiters candidates' prescreening-questionnaire answers, and an employer can request a filter
      on a particular prescreening question.
    quote: To request a new filter based on a particular prescreening question, contact your customer success manager or
      HiredScore Support.
    source: https://doc.workday.com/hiredscore/en-us/workday-hiredscore/recruiter-productivity-/concept--candidate-profiles.html
  keywords:
  - id: wd-keywords-1
    text: Workday recommends simple headings (Experience, Education, Skills), industry-standard job titles, standard fonts
      and few graphics.
    source: https://www.workday.com/en-us/topics/hr/applicant-tracking-system.html
  acronyms: []
  placement: []
  questions_api:
    exposed: false
    how: Public CXS job JSON (undocumented) has only an opaque questionnaireId; questions appear after sign-in.
    source: https://doc.workday.com/admin-guide/en-us/human-capital-management/recruiting/questionnaires/wjl1557399495805.html
  model:
    detect_hosts:
    - .myworkdayjobs.com
    - .myworkdaysite.com
    channels:
    - name: Skills Match (Skills Cloud ontology; Workday plans to retire it)
      cite:
      - wd-ranking-4
      - wd-ranking-9
      skills: taxonomy
      related:
      - wd-ranking-9
      required_weight:
      - wd-ranking-4
      - wd-ranking-15
    - name: HiredScore grade (basic and preferred qualifications)
      cite:
      - wd-ranking-1
      skills: taxonomy
      required_weight:
      - wd-ranking-1
      years:
      - wd-ranking-20
      grade:
      - wd-ranking-1
    parse_checks:
      images:
        cite:
        - wd-parsing-2
        effect: degrade
      file_type:
        value:
        - doc
        - docx
        - pdf
        - rtf
        - txt
        cite:
        - wd-parsing-4
        - wd-ranking-2
        effect: block
      max_mb:
        value: 30
        cite:
        - wd-files-2
        effect: block
greenhouse:
  label: Greenhouse
  parsing:
  - id: gh-parsing-1
    text: Greenhouse lists tables, headers, footers, text boxes, columns and graphics as causes of failed parsing.
    source: https://support.greenhouse.io/hc/en-us/articles/200989175-Unsuccessful-resume-parse
  - id: gh-parsing-2
    text: Keep your name and contact details in the body, not the header or footer.
    source: https://support.greenhouse.io/hc/en-us/articles/200989175-Unsuccessful-resume-parse
  - id: gh-parsing-3
    text: Write full job titles (Senior Account Executive, not Sr. Account Exec) and include Inc. or LLC in company names.
    source: https://support.greenhouse.io/hc/en-us/articles/200989175-Unsuccessful-resume-parse
  - id: gh-parsing-4
    text: Greenhouse says recruiters see the resume, cover letter and application answers exactly as submitted.
    quote: They’ll see your resume, cover letter, answers to questions on the application form and any supporting documents
      exactly as you sent them.
    source: https://my.greenhouse.com/blogs/what-really-happens-after-you-apply-for-a-job
  file_types:
  - id: gh-files-1
    text: Greenhouse can't parse resumes larger than 2.5 MB, so keep the file small.
    source: https://support.greenhouse.io/hc/en-us/articles/200989175-Unsuccessful-resume-parse
  - id: gh-files-2
    text: Upload .doc, .docx, .pdf, .rtf or .txt; image uploads cannot be parsed.
    source: https://support.greenhouse.io/hc/en-us/articles/360052218132-Supported-file-types-for-resumes-and-cover-letters
  ranking:
  - id: gh-ranking-1
    text: Talent Matching scores resumes against recruiter-chosen skills, titles, years of experience and industry, and
      puts candidates in Strong to Limited match tiers.
    source: https://support.greenhouse.io/hc/en-us/articles/41396009937307-Talent-Matching
  - id: gh-ranking-2
    text: Talent Matching never advances or rejects anyone automatically; a recruiter decides.
    source: https://support.greenhouse.io/hc/en-us/articles/41131616864283-Talent-Matching-Data-Processing-FAQ
  - id: gh-ranking-3
    text: Talent Matching matches skills and titles semantically, and an unprocessable resume goes to manual review.
    source: https://support.greenhouse.io/hc/en-us/articles/41131616864283-Talent-Matching-Data-Processing-FAQ
  - id: gh-ranking-4
    text: Recruiter keyword filtering only matches a term that appears exactly in your application.
    source: https://support.greenhouse.io/hc/en-us/articles/27104809835291-Talent-Filtering
  - id: gh-ranking-5
    text: Talent Filtering keyword search covers the full text of resumes and internal notes, for titles, skills, locations
      and other keywords.
    quote: Begin by searching for job titles, skills, locations, and other keywords in the full text of resumes and internal
      notes.
    source: https://support.greenhouse.io/hc/en-us/articles/27104809835291-Talent-Filtering
  - id: gh-ranking-6
    text: Talent Filtering keywords are either Preferred (any one must appear, OR) or Required (all must appear, AND).
    quote: You can customize your search by toggling keywords between “Preferred” (OR statements) and “Required” (AND statements)
      to align results with your specific hiring needs.
    source: https://www.greenhouse.com/product-features/greenhouse-talent-filtering-keyword-search
  - id: gh-ranking-7
    text: Greenhouse's AI keyword suggestions for Talent Filtering and Talent Rediscovery are generated from the job description.
    quote: Suggestions are generated based on the job description.
    source: https://support.greenhouse.io/hc/en-us/articles/41476323569563
  - id: gh-ranking-8
    text: Greenhouse's AI suggests related terms and synonyms from the job description for recruiters to add, but the search
      itself still finds exact matches of each term in applications (candidate blog, Jan 2025).
    quote: Our system uses AI to analyze job descriptions and suggest relevant keywords and synonyms of those keywords for
      recruiters to use in their search. For example, a job description mentioning “JavaScript” might suggest that recruiters
      search for related terms like “React” or “TypeScript.” When recruiters search for these terms, they’ll find exact
      matches in candidates’ applications.
    source: https://my.greenhouse.com/blogs/what-really-happens-after-you-apply-for-a-job
  - id: gh-ranking-9
    text: In Greenhouse Boolean full-text search, plurals and other word forms are matched by the recruiter adding a * wildcard
      (Java* matches Javascript).
    quote: Boolean wildcard searches enable you to search for variations on the modified text, allowing results for plurals
      or different word forms.
    source: https://support.greenhouse.io/hc/en-us/articles/202360199-Search-candidates-using-Boolean-queries
  - id: gh-ranking-10
    text: Greenhouse tells recruiters to cover synonyms themselves with OR (e.g. trainer OR instructor OR teacher).
    quote: trainer OR instructor OR teacher will return results that contain one or more of the stated words that are synonymous.
    source: https://support.greenhouse.io/hc/en-us/articles/202360199-Search-candidates-using-Boolean-queries
  - id: gh-ranking-11
    text: Unquoted multi-word Boolean searches treat each word separately with an implied AND; quotes require the exact
      phrase in order.
    quote: Not using "" around a phrase will mean that each word is treated separately, usually with an assumed AND in between
      each one.
    source: https://support.greenhouse.io/hc/en-us/articles/202360199-Search-candidates-using-Boolean-queries
  - id: gh-ranking-12
    text: Greenhouse Boolean full-text search runs over resumes, notes and scorecards.
    quote: Results will not include resumes, notes, or scorecards that have either "engineer" or "senior developer."
    source: https://support.greenhouse.io/hc/en-us/articles/202360199-Search-candidates-using-Boolean-queries
  - id: gh-ranking-13
    text: Talent Matching reads only the resume; structured application-form answers are not used in the match.
    quote: The matching algorithm is only using data coming from the resume.
    source: https://support.greenhouse.io/hc/en-us/articles/41131616864283-Talent-Matching-Data-Processing-FAQ
  - id: gh-ranking-14
    text: The Talent Matching parser extracts only skills, job titles, years of experience, employment dates and company
      names (plus a derived industry where available); education is not in that list.
    quote: it does not extract additional fields beyond skills, job titles, years of experience, start/end dates of employment,
      and company names from employment history during the resume parsing process.
    source: https://support.greenhouse.io/hc/en-us/articles/41131616864283-Talent-Matching-Data-Processing-FAQ
  - id: gh-ranking-15
    text: Talent Matching does not use names or contact information.
    quote: The system does not use names or any contact information for the matching algorithm to avoid bias.
    source: https://support.greenhouse.io/hc/en-us/articles/41131616864283-Talent-Matching-Data-Processing-FAQ
  - id: gh-ranking-16
    text: Talent Matching is built from several fine-tuned LLMs, each for one extraction task, plus third-party models such
      as OpenAI.
    quote: Greenhouse uses a series of fine-tuned LLM models, each one trained for a specific extraction task.
    source: https://support.greenhouse.io/hc/en-us/articles/41131616864283-Talent-Matching-Data-Processing-FAQ
  - id: gh-ranking-17
    text: Each calibration skill gets an importance rating that sets where the match puts emphasis.
    quote: After a skill is added, rate its importance to the role.
    source: https://support.greenhouse.io/hc/en-us/articles/41396009937307-Talent-Matching
  - id: gh-ranking-18
    text: Because the match score is spread across the calibrated skills, Greenhouse recommends 4 to 6 key skills.
    quote: Since the match score is spread across the selected skills, for clearer matches, we recommend focusing on 4–6
      key skills.
    source: https://support.greenhouse.io/hc/en-us/articles/41396009937307-Talent-Matching
  - id: gh-ranking-19
    text: A calibration can include skills with importance levels, job titles, a minimum years of experience, and the options
      Include similar roles and Prioritize current experience.
    quote: It can include skills with importance levels, job titles, minimum years of experience, and preferences such as
      Include similar roles and Prioritize current experience
    source: https://support.greenhouse.io/hc/en-us/articles/54538392333339-Talent-Matching-assistant
  - id: gh-ranking-20
    text: Talent Matching filters (location, keywords, application date and others) are hard constraints on which candidates
      appear, separate from the score.
    quote: which are hard constraints on which candidates appear in the list
    source: https://support.greenhouse.io/hc/en-us/articles/54538392333339-Talent-Matching-assistant
  - id: gh-ranking-21
    text: 'Greenhouse''s example policy for customers: give non-negotiable requirements higher weights and preferred skills
      lower weights.'
    quote: Assign higher weights to non-negotiable requirements. Use lower weights for preferred skills to avoid screening
      out otherwise qualified candidates.
    source: https://support.greenhouse.io/hc/en-us/articles/44682413339675-Operational-readiness-guide-Talent-Matching-policy
  - id: gh-ranking-22
    text: Calibration skills are screened by an LLM that flags soft skills and biased or proxy terms.
    quote: Each entered skill is assessed according to an LLM and returns a value, looking for biased terms, soft skills,
      skills used as proxies for protected traits, nonsensical answers, and system injection functionality.
    source: https://support.greenhouse.io/hc/en-us/articles/41131616864283-Talent-Matching-Data-Processing-FAQ
  - id: gh-ranking-23
    text: Recruiters see the candidate's matched and missing calibrated skills, plus other skills the parser extracted that
      were not in the calibration.
    quote: A list of other candidate skills that were extracted during the parsing step, but not included in the calibration
    source: https://support.greenhouse.io/hc/en-us/articles/41131616864283-Talent-Matching-Data-Processing-FAQ
  - id: gh-ranking-24
    text: The match summary can show how many calibrated skills matched and how many terms were found on the resume.
    quote: the match summary may also show how many calibrated skills matched and how many terms we found on the resume
    source: https://support.greenhouse.io/hc/en-us/articles/41396009937307-Talent-Matching
  - id: gh-ranking-25
    text: Talent Matching scores only candidates in the first Application Review stage.
    quote: Talent Matching is only available on candidates in the first Application Review stage in your pipeline
    source: https://support.greenhouse.io/hc/en-us/articles/41396009937307-Talent-Matching
  - id: gh-ranking-26
    text: Where an employer enables it, the candidate AI opt-out applies per job, not across all of that employer's jobs.
    quote: Candidate AI opt-out applies per job, not to a candidate across your organization.
    source: https://support.greenhouse.io/hc/en-us/articles/44682413339675-Operational-readiness-guide-Talent-Matching-policy
  questions:
  - id: gh-questions-1
    text: Greenhouse Auto-Reject rules can reject you instantly based on your answer to a custom application question.
    source: https://support.greenhouse.io/hc/en-us/articles/203105595-Application-Rules-Overview
  - id: gh-questions-2
    text: Greenhouse rules can also cap how many times someone can apply for a role, or block re-applications from previously
      rejected applicants.
    quote: Recruiters may also set rules that limit the number of times a candidate can apply for a role or prevent applicants
      who were previously rejected from applying over and over again.
    source: https://my.greenhouse.com/blogs/what-really-happens-after-you-apply-for-a-job
  - id: gh-questions-3
    text: Greenhouse rules can auto-advance applicants who meet set criteria, such as holding a certification or being willing
      to travel.
    quote: Similarly, you might be automatically advanced to a later stage if you meet certain criteria (if you hold a specific
      certification or are willing to travel, for example).
    source: https://my.greenhouse.com/blogs/what-really-happens-after-you-apply-for-a-job
  - id: gh-questions-4
    text: Recruiters commonly filter the queue on referrals, internal candidates, or answers to custom application questions.
    quote: A lot of companies filter by referrals or internal candidates first, while others filter based on the answers
      candidates provided to custom questions in the application form.
    source: https://my.greenhouse.com/blogs/what-really-happens-after-you-apply-for-a-job
  keywords:
  - id: gh-keywords-1
    text: 'Use the posting''s exact wording for skills and titles: Greenhouse keyword filters need exact matches and suggest
      keywords from the job post.'
    source: https://support.greenhouse.io/hc/en-us/articles/27104809835291-Talent-Filtering
  acronyms: []
  placement: []
  questions_api:
    exposed: true
    how: GET /v1/boards/{board}/jobs/{id}?questions=true, no auth; questions[].label/required/fields[{name,type,values}]
      plus location_questions, compliance, demographic_questions.
    source: https://docs.greenhouse.io/job-board.html
  model:
    detect_hosts:
    - boards.greenhouse.io
    - job-boards.greenhouse.io
    channels:
    - name: Talent Filtering (recruiter keyword filter)
      cite:
      - gh-ranking-4
      - gh-ranking-8
      skills: literal
    - name: Talent Matching
      cite:
      - gh-ranking-1
      - gh-ranking-3
      skills: taxonomy
      related:
      - gh-ranking-3
      title:
      - gh-ranking-19
      years:
      - gh-ranking-14
      - gh-ranking-19
      required_weight:
      - gh-ranking-17
      - gh-ranking-21
    parse_checks:
      tables:
        cite:
        - gh-parsing-1
        effect: degrade
      text_boxes:
        cite:
        - gh-parsing-1
        effect: degrade
      header_footer_text:
        cite:
        - gh-parsing-2
        effect: degrade
      columns:
        cite:
        - gh-parsing-1
        effect: degrade
      images:
        cite:
        - gh-parsing-1
        effect: degrade
      file_type:
        value:
        - doc
        - docx
        - pdf
        - rtf
        - txt
        cite:
        - gh-files-2
        effect: block
      max_mb:
        value: 2.5
        cite:
        - gh-files-1
        effect: block
lever:
  label: Lever
  parsing:
  - id: lv-parsing-1
    text: If you cannot highlight the text in your resume, Lever likely cannot parse it, so use a text-based file.
    source: https://help.lever.co/hc/en-us/articles/20087345054749
  - id: lv-parsing-2
    text: If a resume gives a regional location (e.g. 'New York Metropolitan Area') rather than a city, Lever's parser maps
      it to the closest structured location and may get it wrong.
    quote: If a resume includes a regional location rather than a legally recognized city (i.e., New York Metropolitan Area),
      the parser will attempt to match the location to the closest available location in the list of structured locations.
      This can cause locations to be incorrectly attributed.
    source: https://help.lever.co/hc/en-us/articles/20087345054749
  - id: lv-parsing-3
    text: When a job board such as Indeed Apply asks a location question, that answer replaces the parsed resume location.
    quote: If a job board uses this question, the exact response to the location question is passed to the location section
      on the candidate profile instead of parsed resume data.
    source: https://help.lever.co/hc/en-us/articles/20087345054749
  - id: lv-parsing-4
    text: For LinkedIn applicants, Lever's review screen shows the non-LinkedIn resume if one exists.
    quote: For candidates who apply via LinkedIn, their non-LinkedIn resume will be shown in the viewer if available.
    source: https://help.lever.co/hc/en-us/articles/20087416850589
  file_types:
  - id: lv-files-1
    text: Lever parses Word, PDF, RTF, WordPerfect, HTML and ODF but cannot parse image files like JPG or PNG.
    source: https://help.lever.co/hc/en-us/articles/20087345054749
  ranking:
  - id: lv-ranking-1
    text: Talent Fit uses an LLM to compare only your anonymized resume with the job description, so put your qualifications
      in the resume.
    source: https://help.lever.co/hc/en-us/articles/28081525270685
  - id: lv-ranking-2
    text: Talent Fit only weighs education, skills and experience the job description calls necessary, and gives a yes/no
      fit with reasons.
    source: https://help.lever.co/hc/en-us/articles/28081525270685
  - id: lv-ranking-3
    text: Lever recruiter search covers only parseable resume content, so unparseable resume text won't show up in searches.
    source: https://help.lever.co/hc/en-us/articles/20087317030685
  - id: lv-ranking-4
    text: Lever search covers candidate names and any parseable content on the profile (resumes, notes, feedback forms)
      and supports AND, OR and NOT.
    quote: The search algorithm will look for candidate names and any parseable content attached to candidate profiles,
      including resumes, notes, and feedback forms. To help structure your search, use the filter chips below the search
      field alongside the search operators (AND, NOT, OR).
    source: https://help.lever.co/hc/en-us/articles/20087317030685
  - id: lv-ranking-5
    text: 'The title: search field matches job titles in work histories parsed from resumes.'
    quote: The search will look for any matching titles in candidate work histories (parsed from their resumes).
    source: https://help.lever.co/hc/en-us/articles/20087317030685
  - id: lv-ranking-6
    text: Multi-word field search terms must be in quotation marks.
    quote: For search terms consisting of multiple words, include quotation marks on either side
    source: https://help.lever.co/hc/en-us/articles/20087317030685
  - id: lv-ranking-7
    text: Lever documents tag search as case-sensitive; it says nothing about case sensitivity for resume text.
    quote: Tags are case-sensitive, so if your search is not working, try changing the capitalization of your terms.
    source: https://help.lever.co/hc/en-us/articles/20087317030685
  - id: lv-ranking-8
    text: Advanced search filters include company, job titles, education and years of experience, all taken from the parsed
      resume; years of experience is computed from parsed dates.
    quote: Years of experience are calculated based on parsed dates from the candidate’s resume.
    source: https://help.lever.co/hc/en-us/articles/20087212721309
  - id: lv-ranking-9
    text: The job-titles filter uses titles parsed from the resume.
    quote: Filter based on job titles that have been parsed from the resume.
    source: https://help.lever.co/hc/en-us/articles/20087212721309
  - id: lv-ranking-10
    text: Lever's location filter searches within 100 miles of a selected city and cannot filter by state or region.
    quote: The location filter allows searching by city or country but not state or region. This is because Lever searches
      within 100 miles of a selected location for any non-country.
    source: https://help.lever.co/hc/en-us/articles/20087212721309
  - id: lv-ranking-11
    text: 'Talent Fit is holistic: there is no formula or checklist the candidate must satisfy.'
    quote: Candidates are holistically assessed – there is no formula or set of ‘boxes’ the candidate needs to tick to be
      considered a ‘fit’ for the job.
    source: https://help.lever.co/hc/en-us/articles/28081525270685
  - id: lv-ranking-12
    text: The Talent Fit LLM is prompted to act as a recruiter.
    quote: The LLM is instructed to act as a recruiter and evaluate a candidate without regard to age, race, gender, or
      disability.
    source: https://help.lever.co/hc/en-us/articles/28081525270685
  - id: lv-ranking-13
    text: Talent Fit lists 'areas for clarification' when a resume leaves out a detail the JD needs, such as project size
      or license type.
    quote: For example, a Construction Project Manager candidate may not have listed the size of the project they manage,
      or a School Bus Driver candidate may not have listed the type of driver’s license that they have.
    source: https://help.lever.co/hc/en-us/articles/28081525270685
  - id: lv-ranking-14
    text: Each candidate is evaluated alone, not ranked against other applicants.
    quote: each candidate is evaluated individually, with no consideration of the other candidates in the pipeline.
    source: https://help.lever.co/hc/en-us/articles/28081525270685
  - id: lv-ranking-15
    text: Talent Fit uses external, closed-source LLMs that Employ may swap without telling customers.
    quote: Our Talent Fit feature utilizes external, closed-source LLMs (Large Language Models).
    source: https://help.lever.co/hc/en-us/articles/28081525270685
  - id: lv-ranking-16
    text: Only matching candidates get the Talent Fit label next to their name.
    quote: Candidates who match will be labeled with Talent Fit next to their name.
    source: https://help.lever.co/hc/en-us/articles/26828963215645
  - id: lv-ranking-17
    text: Talent Fit supports multiple languages.
    quote: Talent Fit supports multiple languages.
    source: https://help.lever.co/hc/en-us/articles/26828963215645
  questions:
  - id: lv-questions-1
    text: Lever automations can auto-archive and reject you based on a custom question answer, such as right to work or
      sponsorship.
    source: https://help.lever.co/hc/en-us/articles/20087246036893
  keywords: []
  acronyms: []
  placement: []
  questions_api:
    exposed: undocumented
    how: Postings API docs say custom questions are not exposed; hosted /apply HTML embeds cards[<id>][baseTemplate] JSON
      (undocumented).
    source: https://github.com/lever/postings-api
  model:
    detect_hosts:
    - jobs.lever.co
    channels:
    - name: Talent Fit (LLM on the JD's necessary qualifications; off by default for new jobs since 2026-08-04)
      cite:
      - lv-ranking-1
      - lv-ranking-2
      skills: taxonomy
      preferred_zero:
      - lv-ranking-2
    parse_checks:
      file_type:
        value:
        - doc
        - docx
        - pdf
        - rtf
        - html
        - odt
        cite:
        - lv-files-1
        effect: block
ashby:
  label: Ashby
  parsing:
  - id: ab-parsing-1
    text: Ashby's optional Enhanced Resume Parsing improves parsing of resumes with complex layouts and adds languages such
      as Korean and Hebrew; the standard parser's limits are not described.
    quote: It also improves parsing for resumes with more complex layouts or formatting.
    source: https://docs.ashbyhq.com/ai-features-in-ashby
  - id: ab-parsing-2
    text: Ashby's Education History form field standardizes school names, so aliases and misspellings resolve to one school.
    quote: School names are standardized at submission, so variations, misspellings, and aliases ("MIT," "M.I.T.," "Massachusetts
      Institute of Technology") all resolve to a single school record.
    source: https://docs.ashbyhq.com/application-forms
  file_types:
  - id: ab-files-1
    text: Keep your resume under 16 MB; Ashby only autofills and full-text indexes resumes that size or smaller.
    source: https://docs.ashbyhq.com/application-forms
  ranking:
  - id: ab-ranking-1
    text: Ashby's AI marks each recruiter-defined criterion as met or not met and lets recruiters sort by percentage of
      criteria met.
    source: https://docs.ashbyhq.com/ai-assisted-application-review
  - id: ab-ranking-2
    text: Ashby's AI criteria can also check how you answered specific application questions.
    source: https://docs.ashbyhq.com/ai-assisted-application-review
  - id: ab-ranking-3
    text: Ashby's application page has a Learn More link where you can opt out of automated processing.
    source: https://docs.ashbyhq.com/ai-assisted-application-review
  - id: ab-ranking-4
    text: Ashby resume search matches exact words or exact phrases by default (not case-sensitive); a 'Similar' mode for
      word variations is something the recruiter opts into.
    source: https://docs.ashbyhq.com/candidate-search
  - id: ab-ranking-5
    text: Besides Matches and Contains, Ashby's Full Text Resume Search has an Equals mode that is case-sensitive.
    quote: Returns records that contain the exact phrase with exact capitalization.
    source: https://docs.ashbyhq.com/candidate-search
  - id: ab-ranking-6
    text: Ashby's Full Text Resume Search also has a Similar mode that matches word variations (e.g. localization finds
      localized, localize), case-insensitive. So resume search is exact by default but a recruiter can choose stemming-like
      matching.
    quote: Returns records with variations of the word. Not case-sensitive. Good for partial matches or different word forms.
    source: https://docs.ashbyhq.com/candidate-search
  - id: ab-ranking-7
    text: In Ashby resume search, NOT must be written as ! or -; the word NOT does not work. AND can be &, +, :, AND or
      and; OR can be |, a comma, OR or or.
    quote: using the text NOT/not will not work for this operation
    source: https://docs.ashbyhq.com/candidate-search
  - id: ab-ranking-8
    text: Ashby candidate search cannot search the text of notes on a profile.
    quote: No, it is not currently possible to search for candidates based on content within notes on their profile.
    source: https://docs.ashbyhq.com/candidate-search
  - id: ab-ranking-9
    text: Advanced candidate-search filters include custom profile fields and answers to application-form questions.
    quote: Examples of advanced filters include filtering by a value added to a custom field on the candidate's profile
      or by the answer to a question on an application form.
    source: https://docs.ashbyhq.com/candidate-search
  - id: ab-ranking-10
    text: Ashby's AI criteria are recruiter-written prompts; Ashby advises one skill per criterion and measurable requirements
      such as years of experience or specific prior job titles.
    quote: 'Specific: Use measurable requirements, such as years of experience or specific previous job titles.'
    source: https://docs.ashbyhq.com/ai-assisted-application-review
  - id: ab-ranking-11
    text: Ashby tells recruiters to split combined requirements into separate criteria.
    quote: 'Singular: Focus on one skill per requirement. Instead of "Experience in Python and AWS," create two separate
      criteria for each.'
    source: https://docs.ashbyhq.com/ai-assisted-application-review
  - id: ab-ranking-12
    text: Ashby can suggest AI criteria generated from the job posting.
    quote: 'Select Add from # suggestions for suggestions generated by AI based on your job posting.'
    source: https://docs.ashbyhq.com/ai-assisted-application-review
  - id: ab-ranking-13
    text: An application-form criterion only checks that a long-text question was answered; blank or unrelated answers fail
      it.
    quote: This check only determines if the question was answered. Blank or unrelated answers are flagged as not meeting
      the criteria.
    source: https://docs.ashbyhq.com/ai-assisted-application-review
  - id: ab-ranking-14
    text: One evaluation covers up to 50 criteria.
    quote: One credit equals one evaluation of a single candidate (job consideration), supporting up to 50 criteria per
      evaluation.
    source: https://docs.ashbyhq.com/ai-assisted-application-review
  - id: ab-ranking-15
    text: If the AI cannot decide a criterion it is marked unknown; if the resume is unreadable the criteria are marked
      skipped.
    quote: If the AI can't make a determination, the criteria evaluation will be marked as unknown. If the resume is unreadable,
      the criteria will be marked as skipped in the output.
    source: https://www.ashbyhq.com/product-updates/ai-assisted-application-review
  - id: ab-ranking-16
    text: Ashby redacts personal information from resumes before sending them to the AI model.
    quote: before resumes are sent to AI models for processing, we redact PII
    source: https://www.ashbyhq.com/product-updates/ai-assisted-application-review
  - id: ab-ranking-17
    text: Ashby's marketing says the AI never ranks or numerically rates applicants; the docs still let recruiters sort
      by the percentage of criteria met.
    quote: The AI never ‘ranks’ or gives numerical ratings to applicants, a human must always be involved in decision-making.
    source: https://www.ashbyhq.com/ai
  - id: ab-ranking-18
    text: Ashby describes the criteria AI (as used in AI Talent Rediscovery) as reading resumes for meaning, not exact words,
      against must-have, should-have and nice-to-have criteria.
    quote: 'Instead of scanning for exact words, the AI reads resumes the way a recruiter would: it understands experience,
      infers relevance, and assesses fit against must-haves, should-haves, and nice-to-haves.'
    source: https://www.ashbyhq.com/product-updates/ai-talent-rediscovery
  - id: ab-ranking-19
    text: AI Talent Rediscovery buckets use criteria-met thresholds (for example 75%+ for High-Fit Candidates).
    quote: 'High-Fit Candidates: Candidates who match 75%+ of your set criteria, reached an active stage, and received no
      poor interview feedback.'
    source: https://docs.ashbyhq.com/ai-talent-rediscovery
  - id: ab-ranking-20
    text: AI Talent Rediscovery hides by default candidates who met under 51% of the AI criteria.
    quote: AI Job Criteria Met Percentage < 51%
    source: https://docs.ashbyhq.com/ai-talent-rediscovery
  - id: ab-ranking-21
    text: AI Talent Rediscovery can refresh a past applicant's work history, location and education when available.
    quote: when available, it retrieves updated work history, location and education so evaluations stay accurate even when
      the original resume is sparse or outdated.
    source: https://www.ashbyhq.com/product-updates/ai-talent-rediscovery
  - id: ab-ranking-22
    text: If the employer turns on 'Hide Evaluations', AI evaluations are hidden for candidates who opt out or who did not
      apply through the Ashby-hosted form (e.g. referral, manual add, possibly Indeed Apply).
    quote: The candidate does not submit an application directly through the Ashby-hosted application form and therefore
      does not see the notice displayed under the Submit Application button.
    source: https://docs.ashbyhq.com/ai-assisted-application-review
  questions:
  - id: ab-questions-1
    text: Ashby auto-reject rules can reject you at submission based on your application answers, such as location.
    source: https://docs.ashbyhq.com/auto-reject-applications
  keywords: []
  acronyms: []
  placement: []
  questions_api:
    exposed: undocumented
    how: Documented posting API has no form; jobPosting.info needs an API key (401 live); only undocumented jobs.ashbyhq.com/api/non-user-graphql
      returns the form.
    source: https://developers.ashbyhq.com/reference/jobpostinginfo
  model:
    detect_hosts:
    - jobs.ashbyhq.com
    channels:
    - name: Full-text resume search (exact words or phrases)
      cite:
      - ab-ranking-4
      skills: literal
    - name: AI-assisted application review (criteria met)
      cite:
      - ab-ranking-1
      - ab-ranking-18
      skills: taxonomy
      required_weight:
      - ab-ranking-18
    parse_checks:
      max_mb:
        value: 16
        cite:
        - ab-files-1
        effect: block
smartrecruiters:
  label: SmartRecruiters
  parsing:
  - id: sr-parsing-1
    text: SmartRecruiters advises avoiding headers, footers, tables and columns, and using one standard font.
    source: https://prod.smartrecruiters.com/resources/glossary/resume-parsing/
  - id: sr-parsing-2
    text: Use plain section names like Education and Work Experience, and full dates.
    source: https://prod.smartrecruiters.com/resources/glossary/resume-parsing/
  - id: sr-parsing-3
    text: SmartRecruiters parses the resume into the profile's Experience and Education sections.
    quote: SmartRecruiters parses information from the candidate's resume to populate the Experience and Education sections.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/managing-candidate-applications_a850cde8-7b41-4ea1-8bd3-eadb601161b5
  - id: sr-parsing-4
    text: After parsing, candidates review and correct the pre-filled application fields before submitting; because Winston
      Match scores experience and education from those confirmed fields first, those corrections are what get scored.
    quote: Candidates can then review the pre-filled information, make any necessary adjustments, and add additional attachments
      as needed.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/exploring-the-candidate-experience_fdf1f35a-7ebc-458c-9194-0a1823a8ea98
  - id: sr-parsing-5
    text: Recruiters can view the resume in its original format or as the parsed profile view.
    quote: You can view the resume in its original format or in a profile view.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/managing-candidate-applications_a850cde8-7b41-4ea1-8bd3-eadb601161b5
  file_types:
  - id: sr-files-1
    text: SmartRecruiters' own guidance says to submit .docx, or a PDF exported from a word processor, and never a scanned
      image.
    source: https://prod.smartrecruiters.com/resources/glossary/resume-parsing/
  - id: sr-files-2
    text: Applications sent through SmartRecruiters' Application API accept PDF, DOC(X), RTF, JPG or PNG up to 2 MB per
      file.
    source: https://developers.smartrecruiters.com/docs/post-an-application
  ranking:
  - id: sr-ranking-1
    text: Winston Match scores you 1 to 4 stars as soon as you apply, based on skills, experience and education, and recruiters
      sort by it.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/introducing-winston-match_f55ee6b8-e404-4ef4-87fa-056cab22f2ef
  - id: sr-ranking-2
    text: Winston Match goes beyond keyword matching and infers related skills.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/introducing-winston-match_f55ee6b8-e404-4ef4-87fa-056cab22f2ef
  - id: sr-ranking-3
    text: The SmartRecruiters People list searches by name, email or keyword and supports Boolean queries.
    quote: This allows you to search for candidates by name, email, or keyword. Boolean search is also supported, enabling
      more advanced search queries.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/managing-jobs-talent-pools-and-candidate-communications_ecc4c937-f9d7-4b24-80ea-436eacb7bb7e
  - id: sr-ranking-4
    text: Recruiters can filter people by location, source or screening-question responses.
    quote: The People tab offers advanced search and Boolean queries, allowing recruiters to filter candidates by location,
      source, or screening question responses.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/managing-jobs-talent-pools-and-candidate-communications_ecc4c937-f9d7-4b24-80ea-436eacb7bb7e
  - id: sr-ranking-5
    text: In the Candidate API, the location search is a case-insensitive string lookup; the general keyword parameter q
      points to a Help Center article that requires a customer login.
    quote: location keyword search which looks up a string in a candidate’s location data; can be used repeatedly; case
      insensitive; e.g. Krakow
    source: https://developers.smartrecruiters.com/reference/candidatesall-1
  - id: sr-ranking-6
    text: 'Winston Match scores separate dimensions: skills match (resume vs JD), work experience (title, seniority, trajectory),
      education and certifications, career progression, and job-title relevance.'
    quote: Work experience (title, seniority, trajectory)
    source: https://www.smartrecruiters.com/recruiting-software/talent-matching/
  - id: sr-ranking-7
    text: Each dimension has its own model, and the results are combined into one weighted score whose weights depend on
      the job and are learned from hiring outcomes.
    quote: Each dimension is scored using separate models and then ensembled into a single weighted score. The weights reflect
      the relevance of each dimension for that specific job, based on real-world hiring outcomes.
    source: https://www.smartrecruiters.com/recruiting-software/talent-matching/
  - id: sr-ranking-8
    text: Match labels are Very High, High, Medium and Low (shown as 1 to 4 stars), but every candidate has an exact numeric
      score that sets the sort order within a label.
    quote: each candidate has a precise underlying numerical score. Winston Match uses this exact score to determine the
      sort order
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/introducing-winston-match_f55ee6b8-e404-4ef4-87fa-056cab22f2ef
  - id: sr-ranking-9
    text: Winston reads skills from both the skills section and the descriptions of work and education entries, about 29
      skills from a typical resume.
    quote: Winston considers skills listed in the skills section of the resume and those embedded in the descriptions of
      work and educational experiences. Winston extracts 29 skills from the typical resume.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/introducing-winston-match_f55ee6b8-e404-4ef4-87fa-056cab22f2ef
  - id: sr-ranking-10
    text: Winston infers skills from job titles held (e.g. Graphic Designer implies Photoshop).
    quote: Winston looks at a candidate's job titles and infers the skills they have likely developed by working in those
      roles.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/introducing-winston-match_f55ee6b8-e404-4ef4-87fa-056cab22f2ef
  - id: sr-ranking-11
    text: Winston infers broader skills from listed ones (HubSpot plus Salesforce implies CRM and digital marketing).
    quote: if a candidate indicates that they know HubSpot and Salesforce, Winston infers that they also have CRM and digital
      marketing skills.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/introducing-winston-match_f55ee6b8-e404-4ef4-87fa-056cab22f2ef
  - id: sr-ranking-12
    text: Winston estimates competence in a skill from time spent in jobs that use it.
    quote: Winston infers a degree of competence based on the time spent in jobs that use a skill and the level of competence
      with similar skills.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/introducing-winston-match_f55ee6b8-e404-4ef4-87fa-056cab22f2ef
  - id: sr-ranking-13
    text: 'Each skill in the match report shows Winston''s confidence and its source: Resume or AI Inference.'
    quote: you’ll see how confidently Winston believes the applicant has that skill, along with its source
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/introducing-winston-match_f55ee6b8-e404-4ef4-87fa-056cab22f2ef
  - id: sr-ranking-14
    text: For work experience and education, Winston Match scores what the applicant confirmed or entered in the application
      profile first; AI-parsed resume data is only a fallback.
    quote: Winston Match uses information that applicants have confirmed or entered themselves as the main source for scoring
      work experience and education. Resume information extracted by AI is used only as a backup when those profile details
      are missing.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/introducing-winston-match_f55ee6b8-e404-4ef4-87fa-056cab22f2ef
  - id: sr-ranking-15
    text: SmartRecruiters' product page cites a 35K+ real-time skills taxonomy behind Winston Match.
    quote: real-time, evolving market skills taxonomy
    source: https://www.smartrecruiters.com/recruiting-software/talent-matching/
  - id: sr-ranking-16
    text: Since August 2026 education is a single Very High to Low subscore, replacing a 'Meets job requirement' badge based
      only on degree level; the underlying scoring did not change.
    quote: Instead of a side-by-side comparison and “Meets job requirement” badge based solely on degree level, recruiters
      now see a single education subscore of Very High, High, Medium, or Low, aligned with the existing model.
    source: https://www.smartrecruiters.com/resources/article/product-release-highlights-smarter-consent-clearer-matches/
  - id: sr-ranking-17
    text: Since December 2025 Winston Match uses LLM full-text analysis of resumes and JDs, with weights that adapt to each
      candidate's background.
    quote: improved LLMs perform full‑text analysis of resumes and job descriptions, and dynamic ensemble modeling adapts
      weightings to each candidate’s background
    source: https://www.smartrecruiters.com/resources/article/december-2025-product-release/
  - id: sr-ranking-18
    text: Recruiters can show Skills, Experience and Education subscores as a column in the applicant list (March 2026).
    quote: a single Match subscores column shows the Skills, Experience, and Education subscores side by side
    source: https://www.smartrecruiters.com/resources/article/march-2026-product-release-highlights-big-things-just-landed-in-winston-match-and-smartsandbox/
  - id: sr-ranking-19
    text: One-click apply flows show an AI disclosure banner before submission when Winston Match is in use.
    quote: An AI disclosure banner is shown before submission in one‑click apply flows, informing applicants that information
      in their application may be processed by AI when certain tools (starting with Winston Match) are in use.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors/describing-the-new-features-and-enhancements-for-the-1h-2026-release
  questions:
  - id: sr-questions-1
    text: Any yes/no or dropdown screening question can be a knock-out, and SmartRecruiters auto-rejects you for a knock-out
      answer.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/creating-rejection-screening-questions_ed2425b9-fd44-4e3d-ab8b-e96adca1c225
  - id: sr-questions-2
    text: With a delayed knock-out rejection, the candidate is rejected immediately; only the portal update and the email
      are delayed.
    quote: SmartRecruiters will mark the candidate as rejected immediately but will delay updates to the Applicant Tracking
      Portal and will delay sending the rejection email to the candidate until the delay period elapses.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/creating-rejection-screening-questions_ed2425b9-fd44-4e3d-ab8b-e96adca1c225
  - id: sr-questions-3
    text: SmartRecruiters' own knock-out example is a work-location preference question.
    quote: For example, if a candidate answers no to the question "Do you want to work in an office location?", he can be
      automatically removed from the application process.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/creating-rejection-screening-questions_ed2425b9-fd44-4e3d-ab8b-e96adca1c225
  - id: sr-questions-4
    text: The built-in question library includes work authorization, criminal record, revoked driver's license and prior
      termination questions.
    quote: Standard Work Permit Are you authorized to work in <job location>? Yes/No.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/using-standard-application-screening-questions_ad606043-b779-49e6-87e5-41aaecf6b075
  - id: sr-questions-5
    text: Employers can flag candidates who re-apply to the same job within a set timeframe with a Reapplied badge.
    quote: Enabling this will identify candidates who have previously applied for the same job within a specified timeframe
      by applying a Reapplied badge to their application.
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors-academy/configuring-the-application-experience_c766296d-9055-49e4-b9ab-b4917edf98f7
  - id: sr-questions-6
    text: When a recruiter moves an applicant to another job, screening answers carry over only if the question text and
      options match exactly.
    quote: Screening question answers are transferred when the question text and available answer options match exactly
      between the source and destination jobs
    source: https://learning.sap.com/courses/smartrecruiters-for-sap-successfactors/describing-the-new-features-and-enhancements-for-the-1h-2026-release
  keywords: []
  acronyms:
  - id: sr-acronyms-1
    text: SmartRecruiters advises using only common abbreviations such as CEO or MBA, and plain job titles instead of fanciful
      ones.
    source: https://prod.smartrecruiters.com/resources/glossary/resume-parsing/
  placement: []
  questions_api:
    exposed: false
    how: Posting API is public, but GET /postings/{uuid}/configuration (screening questions) needs x-smarttoken or OAuth;
      401 live without auth.
    source: https://developers.smartrecruiters.com/reference/getapplyconfigurationforposting-1
  model:
    channels:
    - name: Winston Match (skills, experience, education, title relevance; infers related skills)
      cite:
      - sr-ranking-1
      - sr-ranking-6
      skills: taxonomy
      related:
      - sr-ranking-2
      - sr-ranking-11
      title:
      - sr-ranking-6
    parse_checks:
      tables:
        cite:
        - sr-parsing-1
        effect: degrade
      columns:
        cite:
        - sr-parsing-1
        effect: degrade
      header_footer_text:
        cite:
        - sr-parsing-1
        effect: degrade
      file_type:
        value:
        - docx
        - pdf
        cite:
        - sr-files-1
        effect: tip
      max_mb:
        value: 2
        cite:
        - sr-files-2
        effect: tip
amazon:
  label: Amazon
  parsing:
  - id: am-parsing-1
    text: Amazon accepts one resume per applicant, or your LinkedIn profile instead; merge any second-language version into
      the same document.
    source: https://www.amazon.jobs/content/en/faq/technical-support
  - id: am-parsing-2
    text: Amazon recruiters advise a text-forward, black-and-white, simple resume.
    quote: it’s best to keep a resume text-forward, black and white, and simple.
    source: https://www.aboutamazon.com/news/workplace/amazon-job-application-resume-writing-tips
  - id: am-parsing-3
    text: Amazon recruiters advise using the key words and phrases in the posting's Basic and Preferred Qualifications to
      decide what the resume should focus on.
    quote: we suggest that you look at the key words and phrases within the “Basic and Preferred Qualifications” sections,
      and use this as a guide to help you determine what you should focus on in your resume.
    source: https://www.aboutamazon.com/news/workplace/amazon-job-application-resume-writing-tips
  - id: am-parsing-4
    text: An Amazon recruiter advises including previous titles, years of experience, skills and level of expertise, and
      using common words and skills from the job description (truthfully).
    quote: Make sure it's concise and includes your previous titles, years of experience, skills, and level of expertise
    source: https://www.aboutamazon.com/news/workplace/applying-at-amazon-7-tips-from-recruiters
  - id: am-parsing-5
    text: Amazon recruiters say resumes should center on scope, complexity, recency and relevancy.
    quote: remember your resume should highlight professional experiences that center on scope, complexity, recency, and
      relevancy.
    source: https://www.aboutamazon.com/news/workplace/successful-amazon-job-candidates
  file_types: []
  ranking:
  - id: am-ranking-1
    text: For some role types Amazon uses machine learning to move candidates forward on skills and qualifications without
      waiting for a recruiter's resume review; all other resumes go to recruiters (June 2023).
    quote: For some specific types of roles, we use machine learning to identify candidates that can move forward in our
      hiring process based on their skills and other qualifications—without having to wait for a resume review by a recruiter.
      All other candidates’ resumes are referred to our recruiting team for review and considered for next steps based on
      the candidate’s likelihood to be successful.
    source: https://www.aboutamazon.com/news/workplace/how-amazon-leverages-ai-and-ml-to-enhance-the-hiring-experience-for-candidates
  - id: am-ranking-2
    text: Amazon says these ML hiring tools are not used where local law does not allow them.
    quote: '*These tools are not used in jurisdictions where local law does not allow them.'
    source: https://www.aboutamazon.com/news/workplace/how-amazon-leverages-ai-and-ml-to-enhance-the-hiring-experience-for-candidates
  - id: am-ranking-3
    text: For interns and new grads, Amazon applies NLP to resumes to infer interests and suggest matching roles to recruiters.
    quote: we identify interests based on natural language processing of the candidates' resumes. We then suggest relevant
      roles to the recruiter that match the candidates' interests according to a machine learning algorithm.
    source: https://www.aboutamazon.com/news/workplace/how-amazon-leverages-ai-and-ml-to-enhance-the-hiring-experience-for-candidates
  - id: am-ranking-4
    text: Amazon's role-matching technology goes beyond keyword matching, using skills, experience and preferences, and
      suggests other roles if the original one is filled (January 2026).
    quote: Our teams have developed technology that goes beyond keyword matching to intelligently recommend roles based
      on candidates' skills, experiences, and preferences.
    source: https://www.aboutamazon.com/news/workplace/artificial-intelligence-resume-jobs-hiring-amazon
  - id: am-ranking-5
    text: Amazon also uses technology that scores how well a candidate fits a specific role during initial screening.
    quote: We've also built technology that evaluates how well candidates fit specific roles during the initial screening
      process.
    source: https://www.aboutamazon.com/news/workplace/artificial-intelligence-resume-jobs-hiring-amazon
  - id: am-ranking-6
    text: Amazon says its hiring systems focus on skills, preferences, experience and qualifications.
    quote: we design our systems to focus on skills, preferences, experience, and qualifications
    source: https://www.aboutamazon.com/news/workplace/artificial-intelligence-resume-jobs-hiring-amazon
  questions:
  - id: am-questions-1
    text: Amazon collects your answers to screening questions as part of the application.
    source: https://www.amazon.jobs/en/privacy_page
  - id: am-questions-2
    text: An Amazon recruiter says meeting the basic qualifications is required for consideration, and to check basic requirements
      such as years of experience rather than judging by job title (2021 recruiter tips).
    quote: While meeting the basic skills is required for consideration
    source: https://www.aboutamazon.com/news/workplace/applying-at-amazon-7-tips-from-recruiters
  - id: am-questions-3
    text: Corporate applicants typically go through an online application, then a work style assessment and/or work sample
      simulation, then a phone screen, before the final 'Loop' interview.
    quote: Those applying to corporate positions can expect the standard process of a online application, work style assessment
      and/or work sample simulation, phone screen, and then a final interview
    source: https://www.aboutamazon.com/news/workplace/successful-amazon-job-candidates
  keywords:
  - id: am-keywords-1
    text: Amazon says to highlight every basic qualification in your resume; preferred qualifications are not required to
      apply.
    source: https://www.amazon.jobs/content/en/faq/application
  acronyms: []
  placement: []
  questions_api:
    exposed: false
    how: Job pages and the undocumented search.json have no questions; apply redirects to sign-in at passport.amazon.jobs.
    source: https://www.amazon.jobs/content/en/faq/application
  model:
    channels:
    - name: ML screening and role matching (skills and qualifications, beyond keywords)
      cite:
      - am-ranking-1
      - am-ranking-4
      skills: taxonomy
      required_weight:
      - am-questions-2
icims:
  label: iCIMS
  parsing:
  - id: ic-parsing-1
    text: iCIMS's blog (generic ATS article by iCIMS Staff, 2021) says an ATS rarely auto-rejects a resume, and when it
      does it is usually a file problem such as a file that is too large or in the wrong format.
    quote: There are few times an ATS will automatically reject or refuse to process a resume or CV. When this does occur,
      it’s usually because of a technical problem with the file uploaded to the ATS and nothing to do with the resume’s
      quality. For example, if a file is too large or in the wrong format, the ATS might not accept it.
    source: https://www.icims.com/en-gb/blog/how-applicant-tracking-systems-work/
  - id: ic-parsing-2
    text: The same iCIMS article tells candidates to avoid borders, symbols, tables and lines and to use a simple format.
    quote: 2. Use simple formatting Avoid complicated formatting elements like borders, symbols, tables, and lines. Use
      a simple, logical format that is easy to read and understand.
    source: https://www.icims.com/en-gb/blog/how-applicant-tracking-systems-work/
  - id: ic-parsing-3
    text: iCIMS describes resume parsing as extracting data (usually from a Word or PDF file) into structured fields such
      as contact details, language level and years of experience.
    quote: CV or resume parsing is the technology that extracts data, usually from a Word or PDF document, and converts
      it in a structured way, often self-completing a form. It automatically identifies important, relevant terms in a CV
      such as a candidate’s contact details, language level, years of experience, etc.
    source: https://www.icims.com/blog/what-is-cv-resume-parsing/
  - id: ic-parsing-4
    text: iCIMS's developer docs say the platform stores extracted plain text of a resume and returns an error when text
      cannot be extracted from the document.
    quote: ICIMS is able to retrieve extracted resume text instead of the binary representation of the file. If the file
      doesn't have extracted text the new endpoint will attempt to extract the text on demand. ICIMS will give up on text
      extraction calls after 1 minute and 30 seconds and make two attempts to extract text. The response will be a 404 if
      text cannot be extracted from the document or if the document doesn't exist.
    source: https://developer-community.icims.com/applications/applicant-tracking/binary-files
  file_types:
  - id: ic-files-1
    text: iCIMS's API docs list the file types it can extract text from by default (client configurations may vary).
    quote: 'The following files are available for text extraction by default, though client configurations may vary: pdf,
      doc, docx, odt, wpd, wri, ods, rtf, txt, xls, xlsx, ppt, pptx, odp, zip, rar, htm, html, dot, dotx, xlt, xltx, tif,
      tiff, jpg, jpeg, png, gif, bmp, gz, dcx, pcx, jp2, jpc, jfif'
    source: https://developer-community.icims.com/applications/applicant-tracking/binary-files
  - id: ic-files-2
    text: iCIMS can convert resumes in these formats to PDF.
    quote: 'The following file extensions are supported for conversion to PDF: html, htm, doc, docx, rtf, odt, xml, txt,
      png, jpg, jpeg, svg, tif, tiff'
    source: https://developer-community.icims.com/applications/applicant-tracking/binary-files
  - id: ic-files-3
    text: iCIMS's generic ATS advice article recommends MS Word and says images and PDFs are harder for an ATS to read.
    quote: 4. Submit text-based documents, not PDFs When choosing a file format, MS Word is usually the best option, as
      this is easy for an ATS to scan and interpret. Images and PDFs are scannable, but they are generally more difficult
      for the system to read.
    source: https://www.icims.com/en-gb/blog/how-applicant-tracking-systems-work/
  ranking:
  - id: ic-ranking-1
    text: iCIMS's Summer 2026 release says its candidate search combines keywords, Boolean search and AI matching (iCIMS
      AI Talent Explorer).
    quote: 'Enhanced Candidate Search: Improve candidate discovery with richer profiles and expanded search filters built
      into the ICIMS ATS and extended across ICIMS CXM that combines keywords, Boolean search and AI matching for ICIMS
      AI Talent Explorer .'
    source: https://www.icims.com/company/newsroom/summerrelease2026/
  - id: ic-ranking-2
    text: Recruiters can type a natural-language description and iCIMS turns it into a candidate search query (Candidate
      search AI assistant, iCIMS CXM).
    quote: 'Candidate search AI assistant: A highly requested feature by iCIMS customers, recruiters can describe their
      ideal candidate in natural language and turn a prompt into a high-quality candidate search in iCIMS CXM .'
    source: https://www.icims.com/company/newsroom/summerrelease2025/
  - id: ic-ranking-3
    text: iCIMS says recruiters can filter resumes by keyword searches, for example on specific skills.
    quote: Recruiters can also filter resumes by searching for keywords, such as specific skills necessary for the candidate
      to perform the job.
    source: https://www.icims.com/en-gb/blog/how-applicant-tracking-systems-work/
  - id: ic-ranking-4
    text: iCIMS Candidate Ranking (Role Fit) matches a candidate's skills and experience to those listed in the job description
      and surfaces the highest-matching candidates; iCIMS classifies it as an automated employment decision tool (AEDT)
      under NYC law.
    quote: Candidate Ranking using Role Fit. Candidate Ranking uses AI technology to help match candidate skills and experiences
      to those listed in a job description and surfaces the highest-matching candidates. Because Candidate Ranking helps
      provide recommendations about job candidates in the screening process, it fits within the definition of an AEDT.
    source: https://www.icims.com/blog/how-icims-supports-the-nyc-automated-employment-decision-tools-law/
  - id: ic-ranking-5
    text: The iCIMS Talent Cloud job fit score shows experience match, skills match and the candidate's tier as bar charts.
    quote: Within the iCIMS Talent Cloud , the job fit score depicts the experience match, skills match, and tier of the
      matched candidate. Bar charts visualize the results and can help recruiters save time viewing multiple profiles.
    source: https://www.icims.com/blog/top-5-ai-recruiting-software-capabilities-to-drive-business-value/
  - id: ic-ranking-6
    text: iCIMS Talent Match and Skills Overlap are presented under ontology-based skills management and are said to find
      qualified candidates despite different wording (not exact-keyword only).
    quote: Ontology-based skills management helps users understand the relationship and groupings of specific skills. ...
      Within iCIMS ATS is Talent Match, a feature that helps recruiters surface candidates with similar skills and experiences
      to an existing employee. Another area, Skills Overlap, shows the critical skills the candidate and employee have in
      common . AI capabilities like these help save time for recruiters looking through candidate profiles and can uncover
      highly qualified candidates that may have been missed due to misaligned terminology.
    source: https://www.icims.com/blog/top-5-ai-recruiting-software-capabilities-to-drive-business-value/
  - id: ic-ranking-7
    text: iCIMS AI (iCIMS Hire) ranks candidates on skills and experience and scans job descriptions to match the most qualified
      candidates.
    quote: Rank candidates based on skills and experience ... The AI-powered system scans job descriptions and matches them
      with the most qualified candidates, helping your talent acquisition team focus their efforts on relevant candidates
      and avoid unqualified candidates early in the recruitment process.
    source: https://www.icims.com/products/ai-recruiting-software/
  - id: ic-ranking-8
    text: iCIMS AI agents (e.g. the Sourcing Agent) make recommendations while recruiters choose how much autonomy to allow
      and review the results.
    quote: ICIMS AI introduces intelligent agents that actively support sourcing, matching, engagement and coordination
      across the hiring journey. Recruiters stay firmly in control, choosing how much autonomy to enable, reviewing recommendations
      and guiding outcomes every step of the way.
    source: https://www.icims.com/products/ai-recruiting-software/
  - id: ic-ranking-9
    text: An iCIMS patent (US11238410B1) describes merging several AI matching engines and adding synonyms to candidate/job
      data. It is a patent ('may'), not confirmation of current product behavior.
    quote: the extracted job or candidate data may be augmented with synonyms of terms that are in the extracted job or
      candidate data, as the synonyms are related information that facilitates or enhances the matching AI engines' ability
      to identify matching jobs and candidates. For instance, a candidate's resume/CV may state that the candidate is a
      medical doctor specializing in cardiology. the extracted candidate data may be augmented with synonyms of terms in
      the resume/CV so that extracted candidate data includes the term “physician” (as a synonym to “medical doctor”)
    source: https://patents.google.com/patent/US11238410B1/en
  questions:
  - id: ic-questions-1
    text: iCIMS lets employers set up knock-out questions that pre-screen applicants when they apply and filter out unqualified
      ones.
    quote: 'You can also configure “knock-out” questions, which pre-screen candidates when they apply. ... Quality control
      : Knock-out questions filter out unqualified applicants, so only relevant candidates make it to the next stage.'
    source: https://www.icims.com/blog/recruiting-process-automation/
  - id: ic-questions-2
    text: iCIMS says automated rejections follow from failing a recruiter-set minimum requirement such as a must-have skill,
      education or experience level.
    quote: ATS systems can send automated rejection letters to applicants, but only after accepting and analyzing a resume
      and only if the resume doesn’t meet the minimum requirements for a position. For example, a recruiter might list a
      specific skill, educational background, or experience level as a “must-have” requirement for a job. If the resume
      doesn’t meet those standards, it could be rejected.
    source: https://www.icims.com/en-gb/blog/how-applicant-tracking-systems-work/
  - id: ic-questions-3
    text: iCIMS screening tools can sort candidates by criteria such as experience level or skill sets.
    quote: With advanced screening tools you can set parameters to sort candidates by specific criteria, such as experience
      level or skill sets.
    source: https://www.icims.com/blog/recruiting-process-automation/
  keywords:
  - id: ic-keywords-1
    text: iCIMS advises using keywords from the job description, mostly skills and competencies, naturally in the application
      text.
    quote: 1. Use keywords from the job description Tailor your application for each job you’re applying to using keywords
      you find in the job description. Most keywords relate to the specific skills and competencies necessary to perform
      the job. Be sure to use keywords featured in the job description naturally in the text of your application.
    source: https://www.icims.com/en-gb/blog/how-applicant-tracking-systems-work/
  acronyms:
  - id: ic-acronyms-1
    text: iCIMS advises spelling out months and other abbreviations to avoid misinterpretation.
    quote: 3. Spell out months and other abbreviations Today’s ATS solutions can understand a lot based on context, but
      you can prevent misinterpretations by spelling out abbreviations for things like months and years. For example, write
      “August 2020” instead of “Aug. ’20.”
    source: https://www.icims.com/en-gb/blog/how-applicant-tracking-systems-work/
  placement:
  - id: ic-placement-1
    text: iCIMS says a summary statement at the start of the application is a good place for keywords.
    quote: If you begin your application with a summary statement, this is an excellent opportunity to utilize keywords.
    source: https://www.icims.com/en-gb/blog/how-applicant-tracking-systems-work/
  - id: ic-placement-2
    text: iCIMS advises filling every application field, including optional ones, and using keywords there.
    quote: 5. Complete every field, even those that aren’t required When filling out an online application, treat every
      field as an opportunity to show your qualifications. Even if a field isn’t necessary to apply, fill it out. Look for
      opportunities to include keywords as well.
    source: https://www.icims.com/en-gb/blog/how-applicant-tracking-systems-work/
  questions_api:
    exposed: false
    how: 'iCIMS Developer Support (forum, 2022): "Screening Questions and responses are not available by API. However, they
      can be exported by flat file."'
    source: https://developer-community.icims.com/forum/how-get-job-specific-screening-questions-using-api
  model:
    detect_hosts:
    - .icims.com
    channels:
    - name: Candidate Ranking / job fit score (skills and experience vs the job description)
      cite:
      - ic-ranking-4
      - ic-ranking-5
      skills: taxonomy
      related:
      - ic-ranking-6
    parse_checks:
      tables:
        cite:
        - ic-parsing-2
        effect: degrade
taleo:
  label: Oracle Taleo (Enterprise Edition)
  parsing:
  - id: tl-parsing-1
    text: Taleo's resume parser ignores text formatting (bold, italics, bullets) and can read text in headers and footers.
    quote: Resume Parsing has no impact on the formatting of a text (bold, italics, bullets). It can detect text in the
      header and footer.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/21b/otrec/candidate-management.html
  - id: tl-parsing-2
    text: Taleo's parser extracts contact info, education and work experience (start/end date, employer, job function, responsibility);
      skills are not in the documented list of parsed elements.
    quote: 'The following data elements are extracted from the candidate''s resume: Candidate Personal Information First
      Name Last Name Middle Name Address City Zip/Postal Code Home Phone Number Email Address Place of Residence Pasted
      Resume Education Education Level Graduation Date Start Date Institution Program Work Experience Start Date End Date
      Employer Job Function Responsibility'
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/21b/otrec/candidate-management.html
  - id: tl-parsing-3
    text: When a recruiter creates a candidate with Resume Parsing, the file must be 100 KB or less (or the admin-defined
      size), and resumes in a language other than the submission language may not be processed.
    quote: The candidate's resume cannot exceed 100 kilobytes or the size defined by the system administrator. It must also
      have the proper file format as defined by the system administrator. ... Also, the processing of resumes written in
      other languages than the submission language might not be supported.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/21b/otrec/candidate-management.html
  - id: tl-parsing-4
    text: Candidates on mobile can paste their resume as plain text; Taleo parses the pasted text and saves it as a .txt
      resume attachment.
    quote: While completing a job-specific application or general profile using a mobile device, candidates and employees
      can copy and paste their resume. The option Paste the resume is available on career sections. The system parses the
      pasted text and the information is used to pre-populate the job application or candidate file. The pasted text is
      also flagged as both a job-specific submission attachment and as a resume.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/24b/otcug/c-plaintextresumeparsingmobile.html
  - id: tl-parsing-5
    text: In Taleo Business Edition (TBE, a separate product), image resumes (PNG/JPG) are not parsed, so they do not fill
      the 'resume keyword' field used for searching.
    quote: Please note that the resume will not be parsed when it is in an image format. Parsing populates the 'resume keyword'
      field that you may use for searching. If you rely heavily on this type of searching you may not wish to use this feature
      so that you do not overlook candidates with resumes in image formats.
    source: https://docs.oracle.com/en/cloud/saas/readiness/hcm/24a/tale-24a/24A-tbe-wn-f32282.htm
  file_types:
  - id: tl-files-1
    text: Taleo Resume Parsing (recruiter-created candidate) accepts Word, WordPerfect, TXT, RTF, HTML, PDF, Excel and ODT.
    quote: 'The file must not exceed 100 kilobytes and its format must be one of the following: Word (.doc, .docx), WordPerfect
      (.wpd), Text (.txt), Rich Text Format (.rtf), Hypertext Markup Language (.html, .htm), Portable Document Format (.pdf),
      Excel (.xls, .xlsx), OpenOffice Writer (.odt).'
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/21b/otrec/candidate-management.html
  - id: tl-files-2
    text: Taleo keyword search only indexes candidate attachments in these formats.
    quote: 'All file attachments from the candidate provided the attachments have one of the following supported file formats:
      .doc, .docx (Word) .txt (standard text file) .rtf (rich text format) .pdf (Adobe Portable Document Format) .htm or
      .html (hypertext markup language documents) .wpd (Word Perfect) .odt (if Oracle 11G is used)'
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/20a/otrcg/candidate-and-requisition-search.html
  ranking:
  - id: tl-ranking-1
    text: Taleo's default keyword search returns exact matches, and words are joined with AND by default.
    quote: Keyword search is considered to provide exact matches. ... By default, words entered in the Keywords field are
      linked (transparently) by the AND operator.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/20a/otrcg/candidate-and-requisition-search.html
  - id: tl-ranking-2
    text: Taleo supports trailing wildcards (comput*), quoted phrases, OR, NOT and parentheses.
    quote: The wild card "*" (asterisk) can be placed at the end of a word. For example, a search for comput* will retrieve
      all words that begin with comput such as computer, computing, computers, computation. Wild cards within double quotation
      marks are not supported.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/20a/otrcg/candidate-and-requisition-search.html
  - id: tl-ranking-3
    text: Taleo's optional 'Related Terms' mode also searches system-chosen related words and any word sharing the same
      first 6 letters.
    quote: The Related Term feature enables you to retrieve candidates whose file contains a word that is similar in meaning
      to your search word in addition to candidates whose file contains your exact search word. In addition to retrieving
      similar words, it retrieves words with the same first 6 letters, since those words are most likely in the same family.
      For example, if you search for "Administration" using related terms, the engine will also search for "administrative",
      "administrator", etc.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/20a/otrcg/candidate-and-requisition-search.html
  - id: tl-ranking-4
    text: Taleo's optional Conceptual Search takes a large block of text (such as a job description) and finds candidates
      with related concepts, not every exact word.
    quote: Conceptual Search is an alternative way to search candidate files that broadens the search result by including
      documents that are similar based on concepts and proximities. The retrieved documents do not need to contain everything
      entered as search criteria, only related concepts.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/20a/otrcg/candidate-and-requisition-search.html
  - id: tl-ranking-5
    text: Conceptual Search weighs words statistically against about 100,000 candidate files in the customer's database,
      so very rare or very common words may carry no weight.
    quote: The Conceptual Search analyzes a text, extracts the most significant elements and compares them with significant
      words and relationships between words extracted from a sample of about 100,000 candidate files from your database.
      The system discards non-significant words from its reference list in the knowledge base. A word used by only a few
      candidates or another used by almost all candidates might not have any weight in the Conceptual Search "brain".
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/20a/otrcg/candidate-and-requisition-search.html
  - id: tl-ranking-6
    text: Taleo keyword search covers the pasted resume, cover letter, career objectives, education and work-experience
      text, text answers to library questions, and candidate file attachments.
    quote: Fields searched when the setting is set to Optimal ... Pasted cover letter from the general profile. ... Pasted
      resume from the general profile. ... Career objectives from the general profile. ... Text-based answers to questions
      from the library. ... All file attachments from the candidate provided the attachments have one of the following supported
      file formats
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/20a/otrcg/candidate-and-requisition-search.html
  - id: tl-ranking-7
    text: Punctuation and separator characters are not indexed, so they cannot be searched (except in email/phone fields).
    quote: 'In general, special characters used as punctuation or separators are not included in the search index and cannot
      be used to retrieve information. This is the case for the following characters: : ; . , " '' - _ & *'
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/20a/otrcg/candidate-and-requisition-search.html
  - id: tl-ranking-8
    text: In Taleo Advanced Search, structured criteria can be marked Required, Excluded or Desired. Desired criteria rank
      candidates higher, and only the top 300 results are shown, sorted by relevancy by default.
    quote: 'Required: Only candidates with that criterion are retrieved. Excluded: Candidates with that criterion are excluded.
      Desired: Candidates with that criterion are considered more relevant than those without the criterion. ... The search
      engine can retrieve any number of candidate files although, for performance and management reasons, only 300 are displayed.
      By default, we suggest to display the top 300 by relevancy.'
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/20a/otrcg/candidate-and-requisition-search.html
  - id: tl-ranking-9
    text: Taleo's 'find similar candidates' search uses an existing candidate's file as the query.
    quote: The "find similar candidates" search uses the candidate file, which includes the fields used in the Conceptual
      Search , as the search criteria.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/21b/otrec/candidate-management.html
  - id: tl-ranking-10
    text: Taleo ACE Prescreening ranks candidates on their answers to prescreening questions and competencies, which the
      recruiter marks Required or Asset (not on parsed resume text).
    quote: The Prescreening section in the requisition file may contain disqualification questions, competencies, and questions
      used to find the top candidates for a position. The combination of these three elements is referred to as ACE Prescreening
      because they allow the system to identify ACE or top candidates for a position.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/21b/otrec/candidate-prescreening.html
  - id: tl-ranking-11
    text: In Taleo, a Required answer must be selected for the candidate to be considered, while an Asset is preferred but
      not mandatory.
    quote: A required criterion means that the competency or answer to a question absolutely has to be selected for the
      candidate to be considered for the job. Think "Minimum Requirements". ... An asset criterion means that the competency
      or answer to a question does not have to be selected for the candidate to be considered for the job, but would distinguish
      this candidate compared to others. Think "Strongly Preferred" and "Nice-to-Have" qualifications.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/21b/otrec/candidate-prescreening.html
  - id: tl-ranking-12
    text: Optional weights give answers points, which Taleo normalizes into a percentage result.
    quote: Once the points are assigned, the system automatically calculates a percentage. This percentage is the amount
      that question earns relative to the entire questionnaire. ... All point percentages will be normalized and add up
      to 100% at the bottom of the prescreening questionnaire.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/21b/otrec/candidate-prescreening.html
  - id: tl-ranking-13
    text: 'Taleo puts candidates in three buckets: ACE (all Required plus some Assets), minimally qualified (all Required,
      no Assets), and other.'
    quote: 'ACE candidates: Consider these candidates first because they meet all Required criteria and some Asset criteria.
      Minimally qualified candidates: Consider these candidates after the ACE candidates because they meet all Required
      criteria but not Asset criteria. Other candidates: Do not consider these candidates because they do not meet any Required
      criteria.'
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/21b/otrec/candidate-prescreening.html
  - id: tl-ranking-14
    text: Recruiters can sort and filter the candidate list by ACE, Requirements, Assets Met X/Y and Result %.
    quote: You can also use the "Requirements", "Assets Met X/Y" and "Result" columns to sort candidates. ... The "Meets
      required criteria" is another way to quickly filter your Candidate list to show active candidates who meet all the
      required criteria of the Prescreening section of the requisition file. You can also use the "Assets Met" and "Results
      between (%)" features to filter your list.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/21b/otrec/candidate-prescreening.html
  - id: tl-ranking-15
    text: Taleo competencies capture self-reported proficiency and years of experience, and a requisition can set minimums
      for them.
    quote: 'Competencies are used to gather proficiency level and years of experience of a candidate in order to find the
      best candidate for a job. ... Minimum Experience When selecting a proficiency, users need to set the minimum experience
      required for the competency. Available values are: None Less than 1 year 1 to 3 years 3 to 5 years 5 years +'
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/21b/otrec/candidate-prescreening.html
  - id: tl-ranking-16
    text: For a minimum like 'Bachelor's' or '2+ years', recruiters must mark every higher answer as Required too, or a
      higher answer won't count as meeting the requirement.
    quote: If a Bachelor's Degree is required, you must mark that answer and all answers greater than that answer as required.
      If you do not do this, a candidate that answers Master's degree will not be recorded by the system as having met the
      requirement, even though candidates with a Master's degree do meet the minimum requirement.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/21b/otrec/candidate-prescreening.html
  questions:
  - id: tl-questions-1
    text: Taleo disqualification questions state minimum requirements; answering them is mandatory, and a wrong answer can
      remove the candidate from the application process at once.
    quote: A disqualification question is a single-answer question that contains the minimum requirements for a candidate
      to be eligible for a job. A candidate not meeting the required response can be instantly exited from the application
      process.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/21b/otrec/candidate-prescreening.html
  - id: tl-questions-2
    text: Disqualification question answers decide whether the candidate moves forward or is automatically disqualified
      (Taleo Recruiting, fluid UI).
    quote: When candidates apply for a job, it’s mandatory to respond to the disqualification questions. Answers to the
      disqualification questions decide if candidates move forward in the selection process or are automatically disqualified.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/20d/otfru/prescreening-candidates.html
  - id: tl-questions-3
    text: Oracle advises against configuring Taleo candidate-selection-workflow rules to auto-reject submissions.
    quote: System administrators must design and test new CSW rules thoroughly as they may lead to undesired behavior if
      not used correctly. For the same reason, it is not recommended to use the automatic progression of candidates functionality
      to automatically reject candidate submissions.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/20b/otrcg/candidate-selection-workflow.html
  - id: tl-questions-4
    text: Conceptual Search cannot find disqualified candidates because they are not indexed.
    quote: The conceptual search cannot retrieve disqualified candidates because they are not indexed in the database.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/20a/otrcg/candidate-and-requisition-search.html
  keywords: []
  acronyms: []
  placement: []
  questions_api:
    exposed: undocumented
    how: No public, unauthenticated endpoint for requisition prescreening/disqualification questions found in the Taleo
      Enterprise docs reviewed.
    source: https://docs.oracle.com/en/cloud/saas/taleo-enterprise/20d/otfru/prescreening-candidates.html
  model:
    detect_hosts:
    - .taleo.net
    channels:
    - name: Recruiter keyword search (exact match, words joined with AND)
      cite:
      - tl-ranking-1
      skills: literal
oracle_recruiting:
  label: Oracle Recruiting Cloud (Oracle Fusion Recruiting)
  parsing:
  - id: orc-parsing-1
    text: In Oracle Recruiting, the resume text searched by recruiters' keyword search is not parsed if the resume contains
      footers.
    quote: 'Keywords are searched in the following fields of the candidate file: Candidate Number Degree Employer Name Full
      Name Job Title Language Last Name License Major Medium Resume Text (resumes containing footers aren''t parsed) School
      Skill Source'
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faush/candidate-search.html
  - id: orc-parsing-2
    text: Oracle Recruiting relies on a third-party profile-import partner to parse uploaded resumes; only default sections
      are imported.
    quote: 'When a profile import partner service is enabled, the Profile Import block becomes available in the job application
      flow. When external candidates apply for a job, they can upload their resume. A call is made to the partner''s web
      service and the data returned by the partner is used to populate the candidates'' job application. This is called
      resume parsing. Note: For the Apply with LinkedIn and resume parsing functionality, only default sections are imported.'
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faimh/integrating-third-party-services.html
  - id: orc-parsing-3
    text: Customers with Recruiting Booster get RChilli as their resume parser automatically.
    quote: The RChilli resume parsing partner is automatically provisioned for Recruiting Booster.
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faarb/enable-rchilli-for-resume-parsing.html
  - id: orc-parsing-4
    text: Resume parsing works only in job application flows, not in talent community or event flows.
    quote: Parsing is only supported in job application flows, and not for talent community or events flows.
    source: https://docs.oracle.com/en/cloud/saas/readiness/hcm/24c/recr-24c/24C-recruiting-wn-f32762.htm
  - id: orc-parsing-5
    text: For a new candidate, resume data automatically fills the application fields; returning candidates choose between
      existing profile data and the new resume.
    quote: If a candidate is identified as new, their resume data automatically populates the application fields. If a candidate
      has an existing profile, they're asked to authenticate their identity, and then they're offered a choice to use the
      existing profile data, or import the information in the newly uploaded resume.
    source: https://docs.oracle.com/en/cloud/saas/readiness/hcm/24c/recr-24c/24C-recruiting-wn-f32762.htm
  file_types: []
  ranking:
  - id: orc-ranking-1
    text: Oracle Recruiting's recruiter keyword search covers these candidate fields, including Resume Text and Skill.
    quote: 'Keywords are searched in the following fields of the candidate file: Candidate Number Degree Employer Name Full
      Name Job Title Language Last Name License Major Medium Resume Text (resumes containing footers aren''t parsed) School
      Skill Source'
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faush/candidate-search.html
  - id: orc-ranking-2
    text: In Oracle Recruiting Boolean search, text between operators is treated as a quoted phrase, wildcards are not supported,
      and only one level of parentheses works.
    quote: 'AND, OR, NOT and parenthesis "()" are the supported boolean operators. ... Anything between the operators will
      be considered as a full quoted text. Example: business analyst AND "marketing manager" is the same as business analyst
      AND marketing manager. Wild card searches "*" aren''t supported. Multi-level parenthesis aren''t supported.'
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faush/candidate-search.html
  - id: orc-ranking-3
    text: Oracle's own docs tell recruiters to use OR to cover synonyms themselves, which suggests no automatic synonym
      expansion in recruiter Boolean search (expansion behavior is not stated).
    quote: Use the OR operator to broaden the keywords or different aspects of search that mean the same or similar thing.
      Use OR to broaden your search by connecting two or more synonyms.
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faush/candidate-search.html
  - id: orc-ranking-4
    text: Recruiters can filter by structured advanced criteria including skill, school, degree, major, license, job title,
      years of experience and current/past company.
    quote: 'Candidate Details: Name, Language, Skill, Contact Info, Source, Source Medium Location: Postal Code, Location
      Education: School, Degree, Major Experience: License, Job Title, Years of Experience Company: Current Company, Past
      Company'
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faush/candidate-search.html
  - id: orc-ranking-5
    text: Candidate-facing career-site job search (not recruiter search) uses a synonym list (e.g. Sr = senior) checked
      only against requisition title, job function and job family.
    quote: For example, if candidates search using terms such as "Sr" results will be returned using the word "senior".
      Searching for "product owner" also returns "product manager" in the results. ... Synonyms are checked against the
      requisition title, job function, and job family, but not the description.
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faimh/configure-synonyms-for-candidate-experience-keyword-search.html
  - id: orc-ranking-6
    text: Oracle Suggested Candidates (Intelligent Matching) uses NLP vector similarity, so terms don't need to match exactly.
    quote: The feature uses candidate and job requisition data and converts it into mathematical representations to calculate
      similarities. The feature is more powerful than a regular search because it uses Natural Language Processing (NLP)
      that can consider the context in which a word or phrase is located within the data. That means that the terms don’t
      have to be an exact match for the feature to find similarities in data.
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faush/overview-of-suggested-candidates.html
  - id: orc-ranking-7
    text: Suggested Candidates rates Profile, Education, Experience and Skills from 0 to 3 stars each.
    quote: Each criteria is represented by 0-3 stars indicating the relative match, with 0 indicating no match.
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faush/understand-suggested-candidates.html
  - id: orc-ranking-8
    text: 'Suggested Candidates criteria: Profile uses title and description, Skills uses skills fields plus ML keywords,
      Experience uses years and manager-likelihood, and Education uses the most recent education.'
    quote: Profile Considers the title and description in the candidate’s profile. Skills Considers skill data from skills
      fields as well as keywords found through machine learning. Experience Considers the candidate's number of years of
      experience. It uses contextual words to assess the likelihood that the candidate is a manager. Education Considers
      the candidate’s most recent education.
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faush/understand-suggested-candidates.html
  - id: orc-ranking-9
    text: Suggested Candidates combines all profile titles into one Title field and compares it with the requisition title.
    quote: Title Concatenates all titles in the profile Requisition Title
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faush/understand-suggested-candidates.html
  - id: orc-ranking-10
    text: Suggested Candidates receives selected profile fields, not the resume file, and works best on English-only data.
    quote: The Suggested Candidates feature doesn’t receive a copy of a candidate’s resume nor any PII data. Oracle Recruiting
      pushes a subset of fields about a candidate to AI Apps to use. ... If resumes, job applications, and job requisitions
      are in languages other than English, the candidate suggestions might be unpredictable.
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faush/overview-of-suggested-candidates.html
  - id: orc-ranking-11
    text: Suggested Candidates only makes suggestions and does not decide.
    quote: The Suggested Candidates feature doesn't replace the normal hiring process. It only provides suggestions.
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faush/overview-of-suggested-candidates.html
  - id: orc-ranking-12
    text: Oracle Redwood AI matching ratings use generative AI to score Education, Experience, Skills and Profile from 0
      to 5 against the requisition.
    quote: 'In Redwood, AI matching ratings help recruiting users evaluate how well candidate applications align with job
      requisition requirements. Generative AI analyzes candidate and requisition information and generates ratings on a
      scale of 0 to 5 for these categories: Education, Experience, Skills, Profile.'
    source: https://docs.oracle.com/en/cloud/saas/talent-management/farqa/evaluate-candidate-applications-using-ai-matching-ratings.html
  - id: orc-ranking-13
    text: AI matching ratings use parsed resume information.
    quote: 'When candidates apply for jobs and upload resumes, Oracle Recruiting can use parsed resume information to generate
      AI matching ratings. When relevant information is available in the resume, Generative AI evaluates: Education Experience
      Skills'
    source: https://docs.oracle.com/en/cloud/saas/talent-management/farqa/evaluate-candidate-applications-using-ai-matching-ratings.html
  - id: orc-ranking-14
    text: Admins set the weights of education, experience and skills in the AI rating, and the weights must sum to 1.
    quote: 'Enable and configure job application ratings by defining the weight, or relative importance, of: Education,
      Experience, Skills. The combined weights for education, experience, and skills must equal 1.'
    source: https://docs.oracle.com/en/cloud/saas/talent-management/farqa/how-do-i-set-up-ai-rating-for-job-applications.html
  - id: orc-ranking-15
    text: AI ratings can be calculated automatically at a configured phase and state of the candidate selection process.
    quote: If your admin configured a candidate selection process and added the Calculate Candidate Matching Ratings action
      to a phase and state, the score calculation will be triggered automatically when you move the candidate application
      to that phase and state.
    source: https://docs.oracle.com/en/cloud/saas/readiness/hcm/25b/recr-25b/25B-recruiting-wn-f37003.htm
  - id: orc-ranking-16
    text: Recruiters can filter applications by AI rating. Automatic rejection based on the rating is not documented.
    quote: Use application rating filters to find candidates that meet specific rating criteria. Filtering by ratings can
      help you review and narrow large candidate pools more efficiently.
    source: https://docs.oracle.com/en/cloud/saas/talent-management/farqa/evaluate-candidate-applications-using-ai-matching-ratings.html
  - id: orc-ranking-17
    text: The candidate-facing Job Fit element shows the candidate a 0-5 rating comparing their profile or resume with the
      job, and resume parsing must be active.
    quote: This element uses Generative Adaptive Intelligence (AI) to compare information from a candidate's profile or
      uploaded resume with the job information on the job details page. A candidate's suitability for a job is rated using
      a 0-5 scaled for skills, job history, education, and other data match the skills, requirements, and job information
      from the job details page.
    source: https://docs.oracle.com/en/cloud/saas/readiness/hcm/24a/recr-24a/24A-recruiting-wn-f30398.htm
  - id: orc-ranking-18
    text: With Oracle Dynamic Skills, recruiters add required skills to requisitions from suggestions, and candidates choose
      relevant skills.
    quote: Recruiters can add required skills for a job requisition using suggested skills, there by enhancing the richness
      of the job description. Candidates can use the suggested skills for a specific job and their experience.
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faush/skills-advisor-for-job-requisitions-and-candidates.html
  - id: orc-ranking-19
    text: The Recruiting Booster assistant matches jobs to a candidate's resume based on its skills and job titles.
    quote: Oracle Recruiting Assistant asks for the candidate's resume and shows relevant jobs based on the skills and job
      titles in the resume.
    source: https://docs.oracle.com/en/cloud/saas/readiness/hcm/24a/recr-24a/24A-recruiting-wn-f30549.htm
  questions:
  - id: orc-questions-1
    text: Oracle Recruiting disqualification questions are mandatory, and an answer can automatically disqualify the applicant.
    quote: When candidates apply for a job, it's mandatory to respond to the disqualification questions. Answers to the
      disqualification questions decide if candidates move forward in the selection process or are automatically disqualified.
      An example of a disqualification question could be "Are you entitled to work in the United States?".
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faimh/disqualification-question.html
  - id: orc-questions-2
    text: Admins attach disqualification questions by organization, location, job family or function; they are added to
      matching requisitions automatically, and recruiters can't remove them.
    quote: When a recruiter creates a job requisition, disqualification questions matching the context of the job requisition
      are automatically added to the prescreening questionnaires of the job requisition. The recruiter can't add, edit,
      or remove disqualification questions.
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faimh/disqualification-question.html
  - id: orc-questions-3
    text: A single answer carrying a negative score on a disqualification question disqualifies the candidate.
    quote: Disqualification questions require a score so that candidates submitting a job application are entered in the
      selection process or are automatically disqualified. ... A single answer to a negative score of a disqualification
      question will disqualify a candidate.
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faimh/guidelines-for-scoring-questions.html
  - id: orc-questions-4
    text: Scored prescreening questions produce a questionnaire score used to rank job applications.
    quote: You can score questions in external and internal prescreening questionnaires filled by candidates when they apply
      for a job. This helps rank job applications based on prescreening score.
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faimh/guidelines-for-scoring-questions.html
  - id: orc-questions-5
    text: Disqualification is one of the default reasons applied when an application is automatically moved to Rejected
      by Employer.
    quote: When job applications are automatically moved to the Rejected by Employer or Withdrawn by Candidate state of
      any phase of a candidate selection process, a reason is automatically selected. ... The job application was disqualified.
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faimh/reasons-to-reject-and-withdraw-job-applications.html
  - id: orc-questions-6
    text: Each requisition has separate internal and external prescreening questionnaires.
    quote: For each job requisition, there's an internal questionnaire for internal candidates and an external questionnaire
      for external candidates.
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faush/prescreening-questionnaire.html
  keywords: []
  acronyms:
  - id: orc-acronyms-1
    text: On the career-site job search only (not recruiter search), Oracle's synonym list maps abbreviations such as 'Sr'
      to 'senior'.
    quote: You can enhance the keyword search experience for external career sites by allowing candidates to use common
      synonyms and abbreviations. For example, if candidates search using terms such as "Sr" results will be returned using
      the word "senior".
    source: https://docs.oracle.com/en/cloud/saas/talent-management/faimh/configure-synonyms-for-candidate-experience-keyword-search.html
  placement: []
  questions_api:
    exposed: undocumented
    how: REST resources recruitingCEQuestions / recruitingCEQuestionsResponses are listed but marked "only for Oracle internal
      use"; auth requirements and public use are not documented.
    source: https://docs.oracle.com/en/cloud/saas/human-resources/farws/rest-endpoints.html
  model:
    detect_hosts:
    - .oraclecloud.com
    channels:
    - name: Recruiter keyword search (phrases, no wildcards, synonyms only if the recruiter adds OR)
      cite:
      - orc-ranking-2
      - orc-ranking-3
      skills: literal
    - name: Suggested Candidates / AI matching ratings (vector similarity on skills, title, experience)
      cite:
      - orc-ranking-6
      - orc-ranking-12
      skills: taxonomy
      related:
      - orc-ranking-6
      title:
      - orc-ranking-9
      years:
      - orc-ranking-8
    parse_checks:
      header_footer_text:
        cite:
        - orc-parsing-1
        effect: degrade
successfactors:
  label: SAP SuccessFactors Recruiting
  parsing:
  - id: sf-parsing-1
    text: SuccessFactors uses Textkernel to parse resumes and fills previous work experience, current employer and contact
      address fields.
    quote: Resume Parsing provides the ability to extract information from an uploaded resume to pre-populate the previous
      work experience, current employer and contact address fields on the application ... Third party software Text kernel
      is used to parse resume data.
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2081576
  - id: sf-parsing-2
    text: Scanned or image-based PDFs do not parse as expected; text-based PDFs do.
    quote: PDF documents that were scanned in or were previously images will not parse as expected. A PDF that was previously
      a text document will parse as designed
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2081576
  - id: sf-parsing-3
    text: SAP does not use image parsing.
    quote: At this time, SAP does not subscribe to the image parsing technology that is offered
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2081576
  - id: sf-parsing-4
    text: Resume parsing works in a fixed list of languages only.
    quote: 'Resume parsing is only supported in the following languages: Dutch, English, German, French, Spanish, Swedish,
      Danish, Polish, Romanian, Italian, Slovak, Czech, Russian, Portuguese, and Chinese'
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2081576
  - id: sf-parsing-5
    text: SuccessFactors parsing is imperfect, and with Mobile Apply it fills background fields only when they are empty.
    quote: Resume parsing is imperfect and resume text may not parse exactly as entered ... Resume Parsing does not work
      100% when Mobile Apply is enabled for the instance, it will only parse the background elements for all application,
      from a mobile or from a desktop, when the background fields are empty.
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2081576
  - id: sf-parsing-6
    text: Resume parsing does not fill custom profile fields, and date fields have a known limitation.
    quote: 'The Resume Parsing feature does not upload and fill custom fields in the Candidate Profile, only Standard fields
      ... Note: There is currently a limitation with parsing date fields and an enhancement is being worked on by our engineering
      team.'
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2733185
  - id: sf-parsing-7
    text: Password-protected or secured PDFs cannot be attached, and .txt files should be saved as Unicode.
    quote: You cannot attach protected or secured.pdfs. ... Save text documents (.txt) with Unicode Encoding Type, not ANSI,
      or another type of encoding.
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2363852
  file_types:
  - id: sf-files-1
    text: SuccessFactors Recruiting accepts Word, PDF, HTML, images, TXT and CSV attachments; PPT/PPTX, ZIP, RAR and MP4
      are not supported.
    quote: 'Microsoft Word (.doc, .docx) Adobe Portable Document Format (.pdf) HTML Images (.gif, .jpg, .jpeg, .png) Text
      file (.txt) .csv Some of the non supported formats are: .ppt/.pptx .zip .rar MP4'
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2271789
  - id: sf-files-2
    text: The default maximum attachment size is 5 MB and can be raised to 10 MB.
    quote: Each document file size has a default Max size of 5MB but can be increased to 10MB.
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2081556
  ranking:
  - id: sf-ranking-1
    text: SuccessFactors candidate search ranks results by how many criteria match, keyword frequency, stemming and relevancy.
    quote: 'Search Logic – is based on a multi-dimensional search algorithm, which includes a ranking prioritization of
      results based on criteria occurrence, frequency, stemming, and relativities of all criteria. Occurrence: is the most
      influential aspect of search logic. E.g.) Candidates will be ranked higher if they match more or all of the search
      criteria. Frequency: the number of times a search criterion is found on the Candidate. E.g.) People with the word
      “Engineer” in their profile/resume multiple times will be ranked higher than people with fewer references to the word
      “Engineer”.'
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2082085
  - id: sf-ranking-2
    text: SuccessFactors search applies stemming, so 'Engineer' also finds Engineering and Engineers.
    quote: 'Stemming: helps identify similar words to the search criteria. E.g.) searching for the word ‘Engineer” will
      also look for derivations of the word, such as Engine, Engineering, Engineers, etc.'
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2082085
  - id: sf-ranking-3
    text: Rare terms and terms close together get a relevancy boost.
    quote: The uniqueness of criteria matches provides a relevancy boast to the results. E.g.) 'Microplasticology' is given
      more weight in ranking results than the word 'project', due to its uniqueness. The location of search criteria to
      one another provides a relevancy boost to the results.
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2082085
  - id: sf-ranking-4
    text: Multiple words default to OR; AND must be typed explicitly.
    quote: OR Logic (default behavior) - searches using multiple words, will be treated as an "OR" expression. ... AND Logic
      (specific behavior) searches using multiple words connected by "AND" will be treated as a single search criteria
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2082085
  - id: sf-ranking-5
    text: SuccessFactors supports ? and * wildcards, ~ fuzzy matching and quoted phrases; quoted phrase search also matches
      word derivations.
    quote: Fuzzy searches (~) to do a fuzzy logic search use the tilde ~ symbol at the end of a single term. Fuzzy logic
      provides assistive search logic to find similar spellings. ... It also does a more intelligent searching by looking
      for words that originate from the given word and searching for the same. For eg If searched for "competency development",
      it will pull all the results that matched the word and also the result of Phrases like "competing developers"
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2082085
  - id: sf-ranking-6
    text: Search results show 5 to 0.5 stars as a relative match ranking.
    quote: When conducting a Candidate Search, the system can now display a relativistic ranking of the Candidate matches,
      based on the criteria provided. This is shown using a display of stars from 5 (perfect match) down to half a star
      (barely matched) - in half star decrements.
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2082085
  - id: sf-ranking-7
    text: SuccessFactors search covers resumes/CVs, candidate profiles (including custom fields) and cover letters.
    quote: 'The Simple Search tab under the Candidate Search component of Recruiting provides the ability to search on Resumes/CV,
      Candidate Profiles, and Cover Letters using keywords and phrases. ... Custom Fields: custom fields on the Candidate
      Profile are indexed and searched.'
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2082085
  - id: sf-ranking-8
    text: SuccessFactors AI-Assisted Skills Matching (Assisted Applicant Screening) extracts skills from resumes and job
      requisitions and shows direct, related and easily acquired skills.
    quote: AI-powered applicant screening in SAP SuccessFactors Recruiting provides visibility into how an applicant’s skills
      align with those required for the role. The system identifies direct skill matches, related skills, and skills the
      applicant may easily acquire. It extracts skills from resumes and enriches job requisitions to improve alignment
    source: https://www.sap.com/use-cases/reduce-time-spent-assessing-candidate-applications
  - id: sf-ranking-9
    text: The applicants list shows a Skill Compatibility column that compares the number of compatible skills.
    quote: when you navigate to the applicants list you will see a column Skill Compatibility AI will compare the number
      of compatible skills
    source: https://userapps.support.sap.com/sap/support/knowledge/en/3619879
  - id: sf-ranking-10
    text: Job skills are split into primary and secondary skills, the applicant view shows which ones match, and clicking
      a skill shows where it was found in the resume (SAP product expert blog).
    quote: 'Job Skills: 2 of the required primary skills and 2 of the secondary skills matching with the candidates data
      (green ones) Other applicant Skills: there are more skills on candidates data If you click on one of the matching
      skills SF is showing the source (e.g. the place from the resume).'
    source: https://community.sap.com/t5/human-capital-management-blog-posts-by-sap/successfactors-ai-ai-based-skill-matching-in-recruiting-set-up-and-hints/ba-p/13984884
  - id: sf-ranking-11
    text: Skills are normalized to a predefined skills library (SAP Skill Library, or customer library via Talent Intelligence
      Hub), not free text.
    quote: Skills are based on a pre-defined Skill database. The database is based on the most common skills. If you have
      activated TIH also internal skills can be used.
    source: https://community.sap.com/t5/human-capital-management-blog-posts-by-sap/successfactors-ai-ai-based-skill-matching-in-recruiting-set-up-and-hints/ba-p/13984884
  - id: sf-ranking-12
    text: Requisition skills are AI-extracted from the job description, and recruiters can add skills from the SAP Skill
      Library; candidate skills come from the uploaded resume.
    quote: Here you can see a list of Skills the AI has calculated. Recruiters can add more skills to the list by selecting
      skills from the SAP Skill Libary. Custom skills are not included because customs skills needs Talent Intelligence
      Hub. ... With the activation Candidate Skills gets also calculated based on the uploaded resume/cv.
    source: https://community.sap.com/t5/human-capital-management-blog-posts-by-sap/successfactors-ai-ai-based-skill-matching-in-recruiting-set-up-and-hints/ba-p/13984884
  - id: sf-ranking-13
    text: Admins enable skills matching per requisition by business rule; it doesn't work for applicants who applied before
      activation, and with Quick Apply candidates can't add skills.
    quote: Candidates can not add more skills if "Quick Apply" is used. Skill calculation based on Resume will work ...
      If you try to use skill matching on requisitions where applicants where there BEFORE the Skill matching was activated
      the function will not work.
    source: https://community.sap.com/t5/human-capital-management-blog-posts-by-sap/successfactors-ai-ai-based-skill-matching-in-recruiting-set-up-and-hints/ba-p/13984884
  - id: sf-ranking-14
    text: On the career site, after a candidate uploads a CV, jobs with at least one matching skill are shown (skills-based
      job search).
    quote: End users are now able to upload the CV. After uploading the CV and calculating skills the user will see all
      the postings where in minimum one skill matches.
    source: https://community.sap.com/t5/human-capital-management-blog-posts-by-sap/successfactors-ai-ai-based-skill-matching-in-recruiting-set-up-and-hints/ba-p/13984884
  questions:
  - id: sf-questions-1
    text: In SuccessFactors, a wrong answer to a Disqualifier question automatically disqualifies the applicant (free-text
      questions can't be disqualifiers).
    quote: '"Disqualifier" option can be selected which questions are disqualifiers. If a question is selected as a disqualifier,
      applicants who don"t provide a correct answer are automatically disqualified. Free text questions can"t be selected
      as disqualifier questions since there"s no way for the system to identify a correct answer.'
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2204476
  - id: sf-questions-2
    text: Scored questions produce a weighted rating, and applicants below the Required Score are automatically disqualified.
    quote: '"Score" option can be selected which questions are considered into total points. You can also set the Weight
      for each question. ... Rating Calculation per question = [Points per "Score" enabled question/Total "Score" enabled
      question points] * 100 4. If "Required Score" is configured, then the candidate whos rating belows the "Required Score"
      will be automatically disqualified.'
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2204476
  - id: sf-questions-3
    text: Changing disqualifier or scoring settings after people have applied prompts a re-evaluation that can disqualify
      or un-disqualify existing applicants.
    quote: If this best practice is not followed and a recruiting user changes the scoring/disqualifier settings on the
      pre-screen questions after some applicants have already applied, they will be prompted upon save to allow the existing
      applicants to be re-evaluated and possibly un-disqualified based on the new scoring criteria.
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2272147
  keywords: []
  acronyms: []
  placement: []
  questions_api:
    exposed: undocumented
    how: No public unauthenticated endpoint for requisition prescreening questions found in SAP KBAs reviewed; help.sap.com
      OData pages were not readable (JS).
    source: https://userapps.support.sap.com/sap/support/knowledge/en/2204476
  model:
    detect_hosts:
    - .successfactors.com
    - .successfactors.eu
    channels:
    - name: Candidate keyword search (stemming, fuzzy, relevancy stars)
      cite:
      - sf-ranking-1
      - sf-ranking-2
      skills: taxonomy
    - name: AI-Assisted Skills Matching (skill library; direct and related skills)
      cite:
      - sf-ranking-8
      - sf-ranking-11
      skills: taxonomy
      related:
      - sf-ranking-8
    parse_checks:
      images:
        cite:
        - sf-parsing-2
        effect: tip
      max_mb:
        value: 5
        cite:
        - sf-files-2
        effect: block
eightfold:
  label: Eightfold
  parsing:
  - id: ef-parsing-1
    text: Eightfold runs every resume through its own parser, which removes personal details and splits the document into
      structured sections such as skills, experience and education.
    quote: every résumé is passed through the Eightfold parser, which first redacts all personally identifiable information
      (e.g., name, location, phone, etc.) and then standardizes the document into structured text segments (skills, experience,
      education, etc.).
    source: https://eightfold.ai/wp-content/uploads/evaluating-the-promise-and-pitfalls-of-llms-in-hiring-decisions-eightfold-ai.pdf
  - id: ef-parsing-2
    text: The parser keeps the full (masked) resume text as well as cleaned-up lists of skills, experience and education,
      and both go into the Match Score model.
    quote: 'The masked résumé shown in Fig. 1b, along with the position and the context are the direct input to all models:
      Match Score as well as all LLMs, guaranteeing identical input across systems. The parser outputs the raw masked résumé
      text plus sanitized lists of skills, experience, education, etc.'
    source: https://eightfold.ai/wp-content/uploads/evaluating-the-promise-and-pitfalls-of-llms-in-hiring-decisions-eightfold-ai.pdf
  - id: ef-parsing-3
    text: Eightfold adds to candidate profiles with information from public sources such as LinkedIn and GitHub, so the
      profile it scores can include more than the uploaded resume.
    quote: Eightfold’s AI is also constantly enriching and updating the profiles of candidates and employees with new information
      from public sources like LinkedIn, Hoovers, Crunchbase, and GitHub, ensuring that each company’s talent network is
      consistently and automatically refreshed.
    source: https://eightfold.ai/wp-content/uploads/Augmenting_Workday_with_Eightfold_for_Talent_Acquisition.pdf
  - id: ef-parsing-4
    text: If the employer has connected LinkedIn Recruiter, career information from LinkedIn can also be an input to the
      matching model.
    quote: If the employer has integrated Eightfold with LinkedIn Recruiter, the input data may also include career information
      from LinkedIn provided to Eightfold ’s platform.
    source: https://eightfold.ai/nyc-eightfold-matching-model/
  file_types:
  - id: ef-files-1
    text: Each employer configures the accepted resume file types and maximum file size on its apply form, so these limits
      can differ from one employer to another.
    quote: '"description": "Accepted resume file types. Resume questions." ... "description": "Maximum file size in megabytes.
      File-upload questions."'
    source: https://apidocs.eightfold.ai/reference/get_position_apply_form_questions_by_id.md
  - id: ef-files-2
    text: On Eightfold's own Eightfold-powered careers site (one employer's settings, not a platform-wide default), resumes
      may be .pdf, .doc, .docx or .txt, up to 20,971,520 bytes (20 MB).
    quote: '"fileUploadConfig": {"resume": {"allowedFileTypes": [".pdf", ".doc", ".docx", ".txt"], "maxSizeFileBytes": 20971520'
    source: https://app.eightfold.ai/careers?domain=eightfold.ai
  ranking:
  - id: ef-ranking-1
    text: In Eightfold's calibration and filters, a skill typed in quotation marks is matched as exact words. Without quotes,
      related skills are inferred.
    quote: Putting quotes around the skills such as “Computer Science” would execute exact word matches.
    source: https://community.eightfold.ai/best-practices-how-to-discussions-71/calibration-filters-best-practices-2091
  - id: ef-ranking-2
    text: Skills in a group are combined with OR, and Eightfold infers related skills for each skill in the group.
    quote: The criteria within a group and between the group and individual skills should be “OR.” Related skills will then
      be inferred against each individual skill within the group.
    source: https://community.eightfold.ai/best-practices-how-to-discussions-71/calibration-filters-best-practices-2091
  - id: ef-ranking-3
    text: Recruiters can add a Skills/Keywords filter and can require that the skill appears in recent experience.
    quote: Skills/Keywords ❏ Able to add in additional skills/keywords and indicate if it is required to be have been recent
      experience
    source: https://community.eightfold.ai/best-practices-how-to-discussions-71/calibration-filters-best-practices-2091
  - id: ef-ranking-4
    text: Calibration criteria and filters remove sourced Leads (people who have not applied) that do not match them.
    quote: Calibration and filters will narrow down the Lead pool and remove Leads if they do not match either criteria.
    source: https://community.eightfold.ai/best-practices-how-to-discussions-71/calibration-filters-best-practices-2091
  - id: ef-ranking-5
    text: Eightfold says its matching system is built to go beyond keyword matching.
    quote: What makes it SOTA is that the matching system goes far beyond keyword matching. It uses deep semantic understanding
      of people and roles coupled with low-latency machine learning models to match candidates to jobs holistically
    source: https://eightfold.ai/engineering-blog/ai-powered-talent-matching-the-tech-behind-smarter-and-fairer-hiring/
  - id: ef-ranking-6
    text: The Eightfold Matching Model gives each candidate–job pair a match score from 0 to 5 in 0.5 steps. The same person
      gets a different score for each job.
    quote: The match score produced by the model ranges from 0 through 5 in increments of 0.5. ... It is not a stand-alone
      score for a candidate; rather, a match score will vary depending on the particular pairing of the candidate and the
      job position
    source: https://eightfold.ai/nyc-eightfold-matching-model/
  - id: ef-ranking-7
    text: The Eightfold Matching Model uses titles, work experience, education, skills and the full wording of the resume
      and job description.
    quote: The model works with job related information such as titles, work experiences, education, skills, and natural
      language of resumes and job descriptions.
    source: https://eightfold.ai/nyc-eightfold-matching-model/
  - id: ef-ranking-8
    text: Eightfold converts every resume and job description into a semantic embedding, so similar work can match even
      when titles and industries differ.
    quote: Every resume and job description is embedded into a high-dimensional vector space. ... For example, we can detect
      that “Machine Learning Engineer at a fintech company” profile and “Data Scientist at an insurance firm” profile may
      have similar functional capabilities, even if the titles, experiences and industries differ.
    source: https://eightfold.ai/engineering-blog/ai-powered-talent-matching-the-tech-behind-smarter-and-fairer-hiring/
  - id: ef-ranking-9
    text: In the Match Score, skills are compared as embedding vectors, so closely related skills count as similar. It is
      not an exact string match.
    quote: Each unique skill phrase (e.g., “React”, “Kubernetes”, “Financial Modeling”) is mapped to an N-dimensional vector.
      Closely related skills land near one another in this space – “Pandas” lands closer to “Python” than to “Panda”.
    source: https://eightfold.ai/engineering-blog/ai-powered-talent-matching-the-tech-behind-smarter-and-fairer-hiring/
  - id: ef-ranking-10
    text: The Match Score has a separate skill feature that uses only skills from the candidate's most recent jobs, so recent
      use of a skill counts more than use from years ago.
    quote: This calculates the cosine similarity between a job’s skill vector and a candidate’s skill vector, but only using
      skills from their most recent experiences. This prioritizes recent skill usage, differentiating between someone who
      used a skill eight years ago and someone using it currently.
    source: https://eightfold.ai/engineering-blog/ai-powered-talent-matching-the-tech-behind-smarter-and-fairer-hiring/
  - id: ef-ranking-11
    text: The Match Score compares the candidate's current title with the hiring title by similarity, not exact text. It
      also uses a predicted next title based on the candidate's career path.
    quote: We embed titles into N-dimensional vectors using token embedding models ... we use Recurrent Neural Networks
      (RNNs) to model career trajectories over hundreds of millions of samples and use them to predict the next title of
      a candidate given their past experiences.
    source: https://eightfold.ai/engineering-blog/ai-powered-talent-matching-the-tech-behind-smarter-and-fairer-hiring/
  - id: ef-ranking-12
    text: The Match Score also counts how similar the candidate's past employers are to the companies the role values, and
      which kind of company the candidate is likely to join next.
    quote: This is followed by a cosine similarity computation between the companies a candidate has worked for and the
      companies associated with the role of interest.
    source: https://eightfold.ai/engineering-blog/ai-powered-talent-matching-the-tech-behind-smarter-and-fairer-hiring/
  - id: ef-ranking-13
    text: The Match Score model is trained on past hiring outcomes and scaled to 0–5 stars. Eightfold says a strong match
      can lack some listed skills or titles.
    quote: The model is trained on more than tens of millions of historical candidate-position pairs with known outcomes
      ... A strong match might mean the person doesn’t have every listed skill, title, or company, but their trajectory
      and experience point to success in the role.
    source: https://eightfold.ai/engineering-blog/ai-powered-talent-matching-the-tech-behind-smarter-and-fairer-hiring/
  - id: ef-ranking-14
    text: Each job's score depends on its calibration, the recruiter's setup of ideal candidates, skills, titles, experience
      and education. The ideal candidates chosen in calibration affect the Match Score most.
    quote: Ideal candidates have the most impact on the match score and their skills and experience should set the framework
      for the rest of the calibration.
    source: https://community.eightfold.ai/best-practices-how-to-discussions-71/calibration-filters-best-practices-2091
  - id: ef-ranking-15
    text: In calibration, required skills carry more weight than preferred skills, preferred skills are weighted equally,
      and excluded skills lower the score.
    quote: Preferred skills are equally weighted within the skill category of calibration. Required skills are given more
      weight (e.g., there are 3 preferred skills, each is weighted 20%). The majority of skills added should be preferred.
      ❏ Excluding a skill will deprioritize applicants and impacts the Match Score for those with the particular skill.
    source: https://community.eightfold.ai/best-practices-how-to-discussions-71/calibration-filters-best-practices-2091
  - id: ef-ranking-16
    text: Calibration does not require an exact job-title match unless the recruiter marks a title as required.
    quote: Calibration does not look for specific title matches unless it is marked as required.
    source: https://community.eightfold.ai/best-practices-how-to-discussions-71/calibration-filters-best-practices-2091
  - id: ef-ranking-17
    text: Years of experience never exclude a candidate but affect the Match Score. Too few years lowers it more than too
      many.
    quote: Years of experience will not exclude any candidates, but it does impact the match score. Having more years of
      experience than preferred has less of an impact on the match score than having not enough experience.
    source: https://community.eightfold.ai/best-practices-how-to-discussions-71/calibration-filters-best-practices-2091
  - id: ef-ranking-18
    text: A higher degree than the one set in calibration (for example a Master's when a Bachelor's is set) does not raise
      the Match Score.
    quote: There is no impact on the match score for higher level achievement (e.g., Master’s)
    source: https://community.eightfold.ai/best-practices-how-to-discussions-71/calibration-filters-best-practices-2091
  - id: ef-ranking-19
    text: The top match score depends on the role. For some calibrations the best available candidates score around 3, not
      5.
    quote: Calibrations may not always result in match scores of 5. Some roles may only have match scores of 3 as the highest
      score based on an employer’s defined criteria and the availability of the skills in the existing talent pool.
    source: https://community.eightfold.ai/best-practices-how-to-discussions-71/calibration-filters-best-practices-2091
  - id: ef-ranking-20
    text: Eightfold infers "Likely Skills" a person probably has but did not list, such as from their title and company.
      It flags calibration skills it cannot confirm as "Skills to Validate" or "Missing Skills".
    quote: 'Likely Skills: These are skills that the individual is highly likely to have, but that the individual has not
      specifically claimed. Frequently, Likely Skills are shown for a role in which the individual has listed a job title
      and company, but no further information.'
    source: https://eightfold.ai/blog/trust-but-validate/
  - id: ef-ranking-21
    text: Recruiters see a breakdown of each Match Score covering skill, work and job-title relevance.
    quote: These explanations include concise breakdowns on how well a candidate profile matches the requirements of the
      job, including for example skill relevance, work relevance, and job title relevance.
    source: https://eightfold.ai/nyc-eightfold-matching-model/
  - id: ef-ranking-22
    text: On Eightfold-powered career sites, candidates can upload a resume and see jobs that may match. Eightfold does
      not say whether candidates see the numeric score.
    quote: When visiting an Eightfold-powered career site, a candidate can upload a resume and view jobs that may be a good
      match.
    source: https://eightfold.ai/nyc-eightfold-matching-model/
  - id: ef-ranking-23
    text: An Eightfold patent describes a neural network that predicts hiring outcomes from a candidate profile (including
      predicted traits) and a job profile calibrated with ideal candidates.
    quote: generating a calibrated job profile for the job position, the calibrated job profile comprising job requirements
      for the job position, and executing a second neural network module using the enriched talent profile and the calibrated
      job profile as inputs to calculate one or more hire-related prediction values for the candidate.
    source: https://patents.google.com/patent/US12141757B1/en
  - id: ef-ranking-24
    text: Another Eightfold patent describes inferring "implied" job skills from embeddings of qualified people's profiles,
      beyond the skills a job description lists.
    quote: calculate, by applying a deep neural network to each of the qualified talent profiles, embedding vectors, determine
      a cluster of embedding vectors based on a similarity distance metric, determine linguistic units in a group of the
      qualified talent profiles, and determine implied traits based on traits explicitly specified in the job description
      and common traits among the group of qualified persons.
    source: https://patents.google.com/patent/US20220366374A1/en
  questions:
  - id: ef-questions-1
    text: Eightfold ranks applicants by Match Score but does not remove an applicant from a position because of the score.
    quote: Eightfold will rank applicants based on their Match Score against the completed calibration but will never remove
      an applicant from a position based on their Match Score.
    source: https://community.eightfold.ai/best-practices-how-to-discussions-71/calibration-filters-best-practices-2091
  - id: ef-questions-2
    text: Skills a recruiter marks as required or excluded remove sourced Leads that lack (or have) the skill. For applicants,
      a missing required skill lowers the Match Score instead.
    quote: Required or excluded skills will knock out Leads that do not have this skill ❏ Required skills will impact the
      Match Score of applicants missing this skill
    source: https://community.eightfold.ai/best-practices-how-to-discussions-71/calibration-filters-best-practices-2091
  - id: ef-questions-3
    text: Eightfold states that candidates can apply to any open job whatever their match score, and recruiters can hire
      anyone.
    quote: Regardless of the strength of a given match, candidates can apply for any open position and HR recruiting users
      can hire anyone they choose.
    source: https://eightfold.ai/nyc-eightfold-matching-model/
  - id: ef-questions-4
    text: Eightfold's candidate-fraud signals do not reject applications automatically. Recruiters make the decision.
    quote: No signal rejects anyone. Eightfold surfaces anomalies with explanations and leaves the decision with your team.
    source: https://eightfold.ai/trust/candidate-fraud/
  - id: ef-questions-5
    text: Eightfold AI Interviewer can run basic eligibility checks and screening right after someone applies. A customer
      in a published case study described using automated knockout questions.
    quote: AI Interviewer handles basic eligibility checks and candidate screening in one flow, eliminating a majority of
      manual recruiter touchpoints. ... “By leveraging instant text messaging, automated knockout questions, and virtual
      screenings, we can scale our operations effectively without the need for additional head count.”
    source: https://eightfold.ai/blog/quality-automotive-services-transform-high-volume-hiring/
  keywords: []
  acronyms:
  - id: ef-acronyms-1
    text: Eightfold advises recruiters (not candidates) to avoid acronyms in calibration job titles so the platform gets
      more context.
    quote: Avoid acronyms to provide the platform with more context
    source: https://community.eightfold.ai/best-practices-how-to-discussions-71/calibration-filters-best-practices-2091
  placement:
  - id: ef-placement-1
    text: Skills listed under the most recent jobs feed a separate recency feature in the Match Score. Recruiters can also
      filter for skills used in recent experience.
    quote: but only using skills from their most recent experiences. This prioritizes recent skill usage
    source: https://eightfold.ai/engineering-blog/ai-powered-talent-matching-the-tech-behind-smarter-and-fairer-hiring/
  questions_api:
    exposed: false
    how: The documented endpoint GET /api/v2/core/positions/apply-form-questions/{positionId}?userMode=logged_out_candidate
      returns a posting's apply-form questions but requires an Authorization bearer token. No unauthenticated endpoint is
      documented.
    source: https://apidocs.eightfold.ai/reference/get_position_apply_form_questions_by_id.md
  model:
    detect_hosts:
    - .eightfold.ai
    channels:
    - name: Match Score (0-5; embeddings over skills, titles, experience)
      cite:
      - ef-ranking-6
      - ef-ranking-7
      - ef-ranking-9
      skills: taxonomy
      related:
      - ef-ranking-9
      required_weight:
      - ef-ranking-15
      title:
      - ef-ranking-11
      years:
      - ef-ranking-17
phenom:
  label: Phenom
  parsing:
  - id: ph-parsing-1
    text: Phenom uses its own deep-learning resume parser, which pulls out skills, job experience, location and titles and
      compares them with what it parsed from the job posting.
    quote: To ensure the best possible accuracy, Phenom chose to develop their own custom resume parser using deep learning
      modules. ... On top of that, it extracts key skills, job experience, candidate location, and titles. It then cross
      references all of this information against the info parsed from the job listing — which is later on used to assign
      a Fit Score to candidates.
    source: https://www.phenom.com/blog/recruiters-can-use-ai-to-screen-source-and-hire-candidates
  - id: ph-parsing-2
    text: Phenom says image-heavy resumes and resumes scanned as images are hard for its parser to read, which leaves the
      candidate profile incomplete.
    quote: This could include candidates whose resumes are in a format not easily parsed by NLP (e.g., image-heavy resumes
      or files scanned in as images). Recruiters need a heads-up to keep a lookout for these files.
    source: https://www.phenom.com/blog/how-to-get-the-most-from-ai-fit-scores-candidate-discovery
  - id: ph-parsing-3
    text: Phenom's resume parser output records, for each skill, when it was last used and for how many months, and it also
      lists skills under each job.
    quote: '"description": "Candidate skills history." ... "description": "Skill name." ... "description": "Last used."
      ... "description": "Months used." ... "description": "Experience section skills."'
    source: https://developer.phenom.com/card/Parsers
  - id: ph-parsing-4
    text: Phenom also parses the job posting. It ranks the posting's skills by importance to separate must-haves from nice-to-haves,
      and ignores the company-background text.
    quote: It then extracts key skills from the job listing and ranks them by importance. The ranking of importance helps
      identify what skills are must-haves versus what skills are nice-to-have. ... Phenom AI ignores the background information
      about your company when job parsing.
    source: https://www.phenom.com/blog/recruiters-can-use-ai-to-screen-source-and-hire-candidates
  - id: ph-parsing-5
    text: Phenom records the language of each resume. A customer case study describes multilingual Fit Score in eight languages.
    quote: 'Their Fit Score supports 8 languages: French, German, Spanish, Dutch, Swedish, Italian, Portuguese, and English.'
    source: https://www.phenom.com/blog/how-multilingual-fit-score-saves-global-tech-company-thousands-of-hours
  file_types:
  - id: ph-files-1
    text: Phenom's Search by Resume career-site widget accepts a PDF or Word file.
    quote: Candidates upload a PDF or Word file. Parsed attributes populate behind the scenes and surface matched roles
      in the same view.
    source: https://www.phenom.com/blog/phenom-spring-2026-product-releases-update
  ranking:
  - id: ph-ranking-1
    text: Phenom contrasts Fit Score with Boolean and exact-title search, which would miss a "software engineer" when the
      search is for "computer programmer". Fit Score instead looks for close semantic matches of skills.
    quote: Without AI, a recruiter could sort and filter candidates only by structured fields or Boolean keyword queries,
      such as the name of a specific prior employer or an exact matching job title. Without AI, a search for a “computer
      programmer” would miss all those who had the title “software engineer,” and vice versa. With Fit Score, it is possible
      to sort and filter candidates in terms of their attributes relative to job requirements, such as whether the résumé
      lists a skill that is a close semantic match to the job criteria.
    source: https://assets.phenom.com/hubfs/02_Assets/ebook/2025-Phenom-fit-score/Phenom-Fit-Score-2025-Audit-Report.pdf
  - id: ph-ranking-2
    text: Phenom Talent CRM search uses a skills ontology that links related skills, titles and roles. It is not plain word
      matching.
    quote: Phenom's skills ontology understands how skills, titles, and roles relate, not just which words match. It returns
      the right people from a plain-language search and puts a reason behind every grade a candidate gets.
    source: https://www.phenom.com/talent-crm
  - id: ph-ranking-3
    text: Phenom AI sourcing (Sourcing Agent) links synonyms and finds profiles that an exact keyword search would miss.
    quote: The tool understands intent, not just keywords. It reads context, connects synonyms, and surfaces profiles that
      exact-match keyword search would miss, solving the core reason most ATS searches return poor results.
    source: https://www.phenom.com/blog/recruiter-ai-sourcing-strategy-ats-crm
  - id: ph-ranking-4
    text: Phenom Sourcing Agent lets recruiters search in natural language instead of building Boolean queries.
    quote: Sourcing Agent replaces Boolean filter-building with natural-language search.
    source: https://www.phenom.com/blog/ai-sourcing-agent-healthcare-recruiting
  - id: ph-ranking-5
    text: Phenom AI Discovery finds and ranks candidates (internal, CRM, past applicants, external) by skills, experience,
      previous titles and location, using Fit Score.
    quote: Phenom applies Fit Score to all discovered candidates, ranking them based on how well their skills, experience,
      title, and location match the open role.
    source: https://www.phenom.com/talent-discovery
  - id: ph-ranking-6
    text: Phenom AI also sorts people who started but did not finish applying, using whatever data it has on them.
    quote: The system will, however, sort on partial applies, so no leads get left behind.
    source: https://www.phenom.com/blog/how-to-get-the-most-from-ai-fit-scores-candidate-discovery
  - id: ph-ranking-7
    text: Phenom Fit Score grades each candidate for a job as A, B, C or No Fit by comparing the profile (usually from the
      resume) with the job description.
    quote: 'To a recruiter, this value is represented as a letter grade: A, B, C, and No Fit. In brief, the Fit Score model
      computes the letter grade by comparing the candidate profile, which is typically based on a résumé, to the job description.'
    source: https://assets.phenom.com/hubfs/02_Assets/ebook/2025-Phenom-fit-score/Phenom-Fit-Score-2025-Audit-Report.pdf
  - id: ph-ranking-8
    text: Phenom Fit Score uses language modeling of similarity, so a resume skill can count when it is a close semantic
      match to a job skill.
    quote: The AI behind Fit Score includes AI language modeling of similarities between candidate information and job-related
      criteria, such as the match between a candidate’s skills and the skills listed in a job description.
    source: https://assets.phenom.com/hubfs/02_Assets/ebook/2025-Phenom-fit-score/Phenom-Fit-Score-2025-Audit-Report.pdf
  - id: ph-ranking-9
    text: Phenom Fit Score is built with traditional machine learning, not a large language model.
    quote: Fit Score is built using traditional machine learning technologies; it is not a Large Language Model.
    source: https://assets.phenom.com/hubfs/02_Assets/ebook/2025-Phenom-fit-score/Phenom-Fit-Score-2025-Audit-Report.pdf
  - id: ph-ranking-10
    text: 'Phenom Fit Score ranks candidates on four criteria the recruiter sets: skills, experience, title and location.'
    quote: Fit Score uses advanced algorithms and contextual data models to automatically rank candidates based on the skills,
      experience, title, and location requirements you set.
    source: https://www.phenom.com/fit-score
  - id: ph-ranking-11
    text: Phenom weights the four criteria by job type. Location matters more for frontline jobs, and title and skills matter
      more for knowledge-worker jobs.
    quote: For example, if your team is hiring a frontline worker, location will be one of the most important factors that’s
      considered ... On the other hand, if you’re hiring a knowledge worker, title and skills are likely more important
      than location. In this scenario, Phenom AI will give higher Fit Scores to resumes that closely match the skills and
      title parsed from the job listing.
    source: https://www.phenom.com/blog/recruiters-can-use-ai-to-screen-source-and-hire-candidates
  - id: ph-ranking-12
    text: Phenom Fit Score uses both stated data and inferred data, such as inferred skills and job titles.
    quote: Using advanced AI, it evaluates both explicit data — such as skills, experience, and location — and implicit
      data, like inferred skills and job titles, to create a comprehensive match between candidates and job requirements.
    source: https://www.phenom.com/blog/candidate-screening-guide
  - id: ph-ranking-13
    text: When a candidate changed careers recently, Phenom weights skills from the recent job more heavily in Fit Score.
    quote: For example, if a candidate has 10 years of work experience but recently changed careers, Phenom AI will place
      more emphasis on the recent job skills when applying a Fit Score to the candidate.
    source: https://www.phenom.com/blog/recruiters-can-use-ai-to-screen-source-and-hire-candidates
  - id: ph-ranking-14
    text: Phenom's AI learns which job titles and skills are related and ranks skills by how relevant they are to a job
      title.
    quote: This includes identifying how various job titles and skills are related, and ranking skills based on how relevant
      they are to the job title.
    source: https://www.phenom.com/blog/how-to-get-the-most-from-ai-fit-scores-candidate-discovery
  - id: ph-ranking-15
    text: Phenom's knowledge graph links skills, titles, companies, schools, fields of study and locations, so the platform
      matches meaning instead of only words.
    quote: Phenom's knowledge graph catalogs professional entities — skills, job titles, companies, educational institutions,
      fields of study, locations — and maps the intelligent relationships between them. This allows the platform to recognize
      meaning rather than just matching words.
    source: https://www.phenom.com/blog/ontologies-improve-candidate-experience
  - id: ph-ranking-16
    text: Besides the weighted Fit Score, Phenom runs a Supervised Fit Score that learns from which candidates reached interviews
      and which were rejected without one.
    quote: If a candidate reaches the interviewing or post interview phase of the hiring process, Phenom AI marks them as
      a positive candidate. If a candidate is rejected without an interview, Phenom AI marks this applicant as a negative
      candidate.
    source: https://www.phenom.com/blog/recruiters-can-use-ai-to-screen-source-and-hire-candidates
  - id: ph-ranking-17
    text: Recruiters can change a job's skills, title, experience or location criteria to adjust Fit Score.
    quote: A recruiter can update a job listing’s skills, title, experience, or location to more accurately hone the Fit
      Score.
    source: https://www.phenom.com/blog/recruiters-can-use-ai-to-screen-source-and-hire-candidates
  - id: ph-ranking-18
    text: When a job posting is revised, Phenom automatically re-scores every existing application against it.
    quote: After revising the posting, all of the original applications are automatically re-scored to enable a more comprehensive
      review of the applicant pool.
    source: https://assets.phenom.com/hubfs/02_Assets/ebook/2025-Phenom-fit-score/Phenom-Fit-Score-2025-Audit-Report.pdf
  - id: ph-ranking-19
    text: Phenom suggests recruiters upload an ideal candidate profile to guide matching, and warns that more than about
      20 skills in the matching criteria gives diminishing returns.
    quote: O'Donnell recommends recruiters teach the system what to look for initially by uploading an ideal candidate profile
      – a current employee, for example, who embodies the skills and experience the manager thinks would fit best. ... Beware
      of piling too many skills into matching criteria – you’ll see diminishing returns after about 20 skills, O’Donnell
      later pointed out. Doing so could cause the platform to identify candidates who don’t have the most critical skills
      for the position.
    source: https://www.phenom.com/blog/how-to-get-the-most-from-ai-fit-scores-candidate-discovery
  - id: ph-ranking-20
    text: Recruiters can see which factors produced a candidate's Fit Score.
    quote: Yes. Phenom Fit Score uses explainable AI. Recruiters can see exactly which factors contributed to a candidate's
      rating and refine the criteria used to improve future matches.
    source: https://www.phenom.com/fit-score
  - id: ph-ranking-21
    text: Phenom Fit Score also scores existing CRM contacts, past applicants and silver medalists against new jobs.
    quote: Fit Score works across your entire pipeline including existing CRM contacts, past applicants, and silver medalists.
    source: https://www.phenom.com/fit-score
  - id: ph-ranking-22
    text: On a Phenom career site, a candidate who uploads a resume gets job recommendations matched on skills, experience
      and qualifications. Phenom does not say whether the candidate sees a Fit Score grade.
    quote: The Search by Resume widget removes the guesswork from job discovery by matching candidates to roles based on
      the experience, skills, and qualifications already reflected in their resume.
    source: https://www.phenom.com/blog/phenom-spring-2026-product-releases-update
  - id: ph-ranking-23
    text: A Phenom People patent describes a knowledge engine with a semantic library of synonyms for keywords and phrases
      pulled from resumes.
    quote: may indicate the semantic equivalents (e.g., other keywords and/or key phrases that are synonymous with) of the
      keywords and/or key phrases.
    source: https://patents.google.com/patent/US20240273471A1/en
  questions:
  - id: ph-questions-1
    text: Phenom X+ Screening knockout questions screen out candidates who miss non-negotiable requirements, and the decision
      is made automatically.
    quote: 'Pre-Screening (Knockout Questions): These filter out candidates who don''t meet non-negotiable requirements:
      no driver''s license for a truck driver role, not passing the bar for a legal position, or wrong graduation timeline
      for a graduate program. They''re answered instantly and decided automatically.'
    source: https://www.phenom.com/blog/phenom-x-plus-screening-basics-guide
  - id: ph-questions-2
    text: Phenom knockout and scored questions at the apply step check basics such as availability, location, experience
      and licensure.
    quote: Knock-out and scored questions catch the basics like availability, location, experience, and licensure at apply.
    source: https://www.phenom.com/screening
  - id: ph-questions-3
    text: In Phenom X+ Screening, a rejected candidate is automatically moved into the employer's talent community for future
      roles.
    quote: A rejection automatically routes them to the talent community, keeping them in the system for future roles where
      they may be a stronger fit.
    source: https://www.phenom.com/blog/phenom-x-plus-screening-basics-guide
  - id: ph-questions-4
    text: In one Phenom Voice Screening Agent case study, knockout questions automatically disqualified 25% of candidates.
    quote: 25% of candidates auto-disqualified through knockout questions, eliminating manual screening work
    source: https://www.phenom.com/blog/innovative-voice-agent-screening
  - id: ph-questions-5
    text: Phenom says Fit Score alone does not make hiring decisions and should not be the only or main basis for acting
      on applications.
    quote: Fit Score on its own does not make hiring decisions. ... By contrast, it is inappropriate to use Fit Score as
      the sole basis or most important factor in choosing how to act on applications, or to use Fit Score to overrule human
      decision-making.
    source: https://assets.phenom.com/hubfs/02_Assets/ebook/2025-Phenom-fit-score/Phenom-Fit-Score-2025-Audit-Report.pdf
  keywords: []
  acronyms:
  - id: ph-acronyms-1
    text: Phenom's ontology connects acronyms with their full forms in career-site search. Phenom's example is "RN" for
      registered nurse.
    quote: When a candidate types “RN,” the system understands they mean registered nurse.
    source: https://www.phenom.com/blog/ontologies-improve-candidate-experience
  placement:
  - id: ph-placement-1
    text: Skills from the most recent job get more emphasis in Fit Score after a career change, and the parser records last-used
      date and months used for each skill.
    quote: Phenom AI will place more emphasis on the recent job skills when applying a Fit Score to the candidate.
    source: https://www.phenom.com/blog/recruiters-can-use-ai-to-screen-source-and-hire-candidates
  questions_api:
    exposed: undocumented
    how: Phenom's developer docs list the Jobs API (/jobs-api/v1/jobs) and Applications API (POST /apply/v2/applications),
      both with a required Authorization header. No endpoint for a posting's application or screening questions is documented.
    source: https://developer.phenom.com/card/Applications
  model:
    channels:
    - name: Fit Score (A / B / C / No Fit on skills, experience, title, location)
      cite:
      - ph-ranking-7
      - ph-ranking-8
      - ph-ranking-10
      skills: taxonomy
      related:
      - ph-ranking-8
      required_weight:
      - ph-parsing-4
      title:
      - ph-ranking-10
    parse_checks:
      images:
        cite:
        - ph-parsing-2
        effect: degrade
      file_type:
        value:
        - pdf
        - doc
        - docx
        cite:
        - ph-files-1
        effect: tip
workable:
  label: Workable
  parsing:
  - id: wk-parsing-1
    text: Workable parses an uploaded resume to auto-fill the application form, and the parsed profile is what the employer
      reviews.
    quote: Workable 'reads through' your resume and parses the information to automatically fill in areas of the application
      form. ... Try to follow the above guidelines for uploaded resumes as well since Workable will parse your details into
      a profile that the employer will review.
    source: https://jobseekers.workable.com/hc/en-us/articles/360036231313-Import-your-resume-details-to-autofill-the-application
  - id: wk-parsing-2
    text: Workable tells candidates to split the resume into clear sections and use easily readable fonts so it is read
      correctly.
    quote: 'To ensure your resume is read correctly, follow these guidelines: ... Divide the text into clear sections and
      use easily readable fonts'
    source: https://jobseekers.workable.com/hc/en-us/articles/360036231313-Import-your-resume-details-to-autofill-the-application
  - id: wk-parsing-3
    text: Workable tells candidates to avoid many images and to avoid image-only (infographic) resumes.
    quote: Avoid using too many images in the document - Avoid resumes that only consist of an image (i.e. 'infographics'
      type of resume)
    source: https://jobseekers.workable.com/hc/en-us/articles/360036231313-Import-your-resume-details-to-autofill-the-application
  - id: wk-parsing-4
    text: Workable tells candidates to include only the one email address they want to be contacted at.
    quote: Only include the email you want the employer to contact you at (double-check it to make sure there are no typos!)
    source: https://jobseekers.workable.com/hc/en-us/articles/360036231313-Import-your-resume-details-to-autofill-the-application
  - id: wk-parsing-5
    text: For recruiter-uploaded resumes, Workable documents parsing of contact-type fields (name, email/contact info, social
      links, photo) and says image-based CVs and CVs in any language are parsed.
    quote: 'The documents - including image-based CVs and CVs in any language - are parsed and scanned for the following
      fields: - Candidate name - Email address and contact information - Social media account links - Profile picture'
    source: https://help.workable.com/hc/en-us/articles/115012661408-Uploading-candidate-resumes-CVs-Individual-and-bulk-options
  - id: wk-parsing-6
    text: Workable identifies a candidate by the email on the CV, so a CV that carries someone else's email is treated as
      a duplicate.
    quote: Workable uses the email on a CV to identify the candidate, so if every CV from an external recruiter shares the
      same email, the system treats each new upload as a duplicate of the first.
    source: https://help.workable.com/hc/en-us/articles/115012661408-Uploading-candidate-resumes-CVs-Individual-and-bulk-options
  - id: wk-parsing-7
    text: Total years of experience in Workable is computed from the experience records on the profile (from the application,
      the CV parser, or manual entry), so the years-of-experience filter depends on how job entries and dates were parsed.
    quote: Note that the total years of experience are calculated based on the experience records on each candidate profile,
      as those provided by the candidate during application, parsed by the CV parser, or manually inputted by the user.
    source: https://help.workable.com/hc/en-us/articles/23365968258711-Best-practices-Candidate-Screening
  - id: wk-parsing-8
    text: The Workable Agent's evaluation explicitly accounts for incomplete parsing and conflicting information.
    quote: The validity of data (incomplete parsing, conflicting information, etc.)
    source: https://help.workable.com/hc/en-us/articles/38381544828695-Using-the-Workable-Agent
  file_types:
  - id: wk-files-1
    text: Resume uploads on the Workable application form accept .pdf, .doc, .docx, .rtf, .html and .odt, up to 5MB.
    quote: 'The file size limit for resumes is 5MB. Accepted file types: .pdf / .doc / .docx / .rtf / .html / .odt'
    source: https://help.workable.com/hc/en-us/articles/115012238108-What-types-of-files-can-be-uploaded-on-the-application-form
  - id: wk-files-2
    text: Workable's candidate-facing resume-import guidance lists .pdf, .doc, .docx, .odt or .rtf up to 5 MB.
    quote: Use files up to 5 MB with types .pdf, .doc, .docx, .odt or .rtf.
    source: https://jobseekers.workable.com/hc/en-us/articles/360036231313-Import-your-resume-details-to-autofill-the-application
  - id: wk-files-3
    text: Workable file-upload custom questions accept up to 20MB and a wider set of types (including images, txt, xlsx,
      zip).
    quote: 'The file size limit for uploads to a custom question is 20MB. Accepted file types: .doc / .docx / .gif / .html
      / .jpeg / .jpg / .odt / .pdf / .png / .ppt / .pptx / .rtf / .tiff / .txt / .xls / .xlsx / .zip'
    source: https://help.workable.com/hc/en-us/articles/115012238108-What-types-of-files-can-be-uploaded-on-the-application-form
  ranking:
  - id: wk-ranking-1
    text: Workable recruiter keyword search matches terms anywhere in the profile, including the resume file, work experience,
      skills, application-form answers and keywords.
    quote: Searches will return results if the keywords used are in any candidate profile section, such as the resume file,
      work experience, skills, application form questions, keywords, and so on.
    source: https://help.workable.com/hc/en-us/articles/6058530293015-How-do-I-run-an-advanced-boolean-search-for-candidates
  - id: wk-ranking-2
    text: Workable keyword search does not search comments or custom fields.
    quote: 'Note: The system doesn''t search through comments and custom fields.'
    source: https://help.workable.com/hc/en-us/articles/6058530293015-How-do-I-run-an-advanced-boolean-search-for-candidates
  - id: wk-ranking-3
    text: A plain multi-word Workable search returns profiles matching ANY of the terms; Boolean operators are needed to
      require all terms.
    quote: Profiles are returned if one or more of the search terms match the information in the profile. If you’d like
      to search for matches of ALL the search terms, use Boolean operators.
    source: https://help.workable.com/hc/en-us/articles/6058530293015-How-do-I-run-an-advanced-boolean-search-for-candidates
  - id: wk-ranking-4
    text: Workable search applies fuzzy matching and prefix matching by default (spelling variants and longer words starting
      with the term), not exact-word-only matching.
    quote: Fuzzy matching is applied in search terms by default, so a search for "Tom" may return matches for "Tom" or "Tim,"
      as well as prefix matches like "Tomas" or "Tommas". Fuzzy matching is not applied to tags.
    source: https://help.workable.com/hc/en-us/articles/6058530293015-How-do-I-run-an-advanced-boolean-search-for-candidates
  - id: wk-ranking-5
    text: Workable supports AND, OR, NOT and parentheses; once Boolean is used, AND is the default between terms.
    quote: AND is the default operator when advanced searches are performed, i.e. if you type java php AND c#, results will
      assume java AND php AND c#.
    source: https://help.workable.com/hc/en-us/articles/6058530293015-How-do-I-run-an-advanced-boolean-search-for-candidates
  - id: wk-ranking-6
    text: Quoted phrases in Workable search require the exact phrase; a trailing * does a prefix search.
    quote: '"" can be used around one or more words to request for an exact match of the word or phrase: e.g. a search for
      software engineer will yield results for candidates with software or engineer in their profiles while "software engineer"
      will yield results that include that complete term. ... * at the end of a term signifies a prefix query: e.g. the
      term Sen* will search for all words that start with Sen.'
    source: https://help.workable.com/hc/en-us/articles/6058530293015-How-do-I-run-an-advanced-boolean-search-for-candidates
  - id: wk-ranking-7
    text: Workable recommends recruiters filter by skills using Boolean keyword searches of must-have or nice-to-have skills.
    quote: Filter by skills Perform boolean searches using must-have or nice-to-have skills as keywords, e.g. (php OR java)
      AND html
    source: https://help.workable.com/hc/en-us/articles/23365968258711-Best-practices-Candidate-Screening
  - id: wk-ranking-8
    text: Workable offers a Years of experience filter based on total years of experience.
    quote: Using the Years of experience filter will enable you to query candidates based on their total years of experience.
    source: https://help.workable.com/hc/en-us/articles/23365968258711-Best-practices-Candidate-Screening
  - id: wk-ranking-9
    text: Workable "Search with AI" (sourcing passive candidates from outside the account) takes natural language and extracts
      job title, years of experience, university, industry, company names, location and skills as criteria.
    quote: 'After a search query is executed, our AI returns the identified search criteria and displays them as pills below
      the search field. AI identifies mainly the following search criteria: - Job Title - Experience (years of experience)
      - Education (University name) - Industry - Company names - Location - Skills'
    source: https://help.workable.com/hc/en-us/articles/115012750768-Using-Search-with-AI
  - id: wk-ranking-10
    text: Workable Agent replaced the older AI Screening Assistant; jobs not converted to "agentic" get no new scores or
      ranking.
    quote: The AI Screening Assistant has been replaced by the Workable Agent, which provides more accurate and comprehensive
      candidate evaluation. ... For jobs that haven't been upgraded to the Agent yet, candidate ranking is no longer available.
    source: https://help.workable.com/hc/en-us/articles/38381544828695-Using-the-Workable-Agent
  - id: wk-ranking-11
    text: Workable Agent scores candidates against an employer-defined "ideal candidate profile" (a list of criteria), not
      against the job-description text; editing the job description does not change the criteria.
    quote: Any changes to the job editor will not impact the matching criteria, and the Agent will not re-engage.
    source: https://help.workable.com/hc/en-us/articles/38381544828695-Using-the-Workable-Agent
  - id: wk-ranking-12
    text: Workable Agent criteria are organised in 14 categories (work experience, education, tools and technology, domain
      knowledge, methodologies, physical, certifications, language, legal/right-to-work, location, availability, compensation,
      stakeholder interfaces, equipment).
    quote: The ideal candidate profile is defined by the user during the job creation process as a set of matching criteria
      organised in 14 categories.
    source: https://help.workable.com/hc/en-us/articles/38381544828695-Using-the-Workable-Agent
  - id: wk-ranking-13
    text: Workable Agent treats work experience as years or depth of experience (example "3+ years in B2B SaaS sales").
    quote: Work experience Practical exposure to a role or industry, measured by years or depth of experience. 3+ years
      in B2B SaaS sales; product manager experience in a startup environment
    source: https://help.workable.com/hc/en-us/articles/38381544828695-Using-the-Workable-Agent
  - id: wk-ranking-14
    text: 'Workable Agent publishes its weighting: must-haves count 2 points, nice-to-haves 1 point, partially met earns
      half, normalized to a score out of 100.'
    quote: 'The candidate score: The score as provided by the Agent is aggregated and normalized to 100%. The scoring algorithm
      scores must haves with twice the marks as non-must-haves. More specifically: - Nice to have = 1 point - Must have
      = 2 points - Partially met: half the points'
    source: https://help.workable.com/hc/en-us/articles/38381544828695-Using-the-Workable-Agent
  - id: wk-ranking-15
    text: Each Workable Agent criterion is rated Met, Partially met, Not met, Disqualifying, or Unknown (insufficient information),
      with written reasoning.
    quote: Met The candidate fully matches the requirement based on available evidence. Partially met The candidate partially
      satisfies the requirement. Not met Evidence exists but does not meet the requirement. Disqualifying A requirement
      marked as disqualifying that was not met. Unknown There is insufficient information to evaluate the requirement.
    source: https://help.workable.com/hc/en-us/articles/38381544828695-Using-the-Workable-Agent
  - id: wk-ranking-16
    text: Workable Agent reads the CV, ATS profile, application answers and candidate custom fields, and its evaluation
      covers synonyms, transferable skills and domain mappings (not exact-word matching only).
    quote: The completeness of candidate input (CV, ATS profile, application form questions and candidate custom fields)
      ... The subjectiveness of the evaluation process (e.g. transferable skills, knowledge domain mappings, synonyms etc.)
    source: https://help.workable.com/hc/en-us/articles/38381544828695-Using-the-Workable-Agent
  - id: wk-ranking-17
    text: Workable's own Oct-2024 blog described the (now replaced) Screening Assistant as semantic matching that recognizes
      equivalent terms rather than exact keywords.
    quote: Leveraging advanced AI, Workable’s Screening Assistant understands and identifies equivalent terms and phrases.
      For instance, if you’re searching for a “front-end developer” and a candidate mentions they “build user interfaces
      with extensive experience in JavaScript and HTML”, the Screening Assistant will accurately recognize this.
    source: https://resources.workable.com/backstage-at-workable/screening-assistant
  - id: wk-ranking-18
    text: Workable Agent marks candidates who fail a Disqualifier criterion, but only auto-disqualifies them if the employer
      enables that action.
    quote: 'Disqualifier: If the candidate does not meet a criterion marked as Disqualifier, it will be marked as disqualifying.
      The candidate will be disqualified only if this action is enabled in the Agent actions settings.'
    source: https://help.workable.com/hc/en-us/articles/38381544828695-Using-the-Workable-Agent
  - id: wk-ranking-19
    text: Workable Agent auto-disqualify is off by default.
    quote: For your first run, leave auto-disqualify off (it is off by default).
    source: https://help.workable.com/hc/en-us/articles/41050763193623-Getting-started-with-the-Workable-Agent
  - id: wk-ranking-20
    text: Workable Agent can auto-advance candidates above an employer-set score threshold, optionally requiring all must-haves
      to be met.
    quote: Auto-advance strong candidates Automatically moves candidates to a selected pipeline stage when pre-defined score
      thresholds and must-have conditions are met. Select the destination stage; define score threshold; require all must-haves
      to be met or not.
    source: https://help.workable.com/hc/en-us/articles/38381544828695-Using-the-Workable-Agent
  - id: wk-ranking-21
    text: When a Workable Agent criterion is Unknown, the Agent can email the applicant to fill the gap in a chat, then
      re-score.
    quote: Request missing details from applicants Invites applicants to provide additional information when criteria are
      marked as unknown or incomplete. Updates scores once information is received.
    source: https://help.workable.com/hc/en-us/articles/38381544828695-Using-the-Workable-Agent
  - id: wk-ranking-22
    text: Workable Agent generates application questions for must-have criteria that are hard to judge from a CV, and these
      can be made disqualifying.
    quote: Generate application form questions for must-have, public, and not easily evaluated by the CV matching criteria.
      You can freely modify the questions and mark any of them as disqualifying.
    source: https://help.workable.com/hc/en-us/articles/38381544828695-Using-the-Workable-Agent
  - id: wk-ranking-23
    text: Workable Agent pipelines are sorted by score by default.
    quote: For agentic jobs (newly created or upgraded to agentic), the default sorting will be by the highest score to
      see ready-to-review candidates first.
    source: https://help.workable.com/hc/en-us/articles/38381544828695-Using-the-Workable-Agent
  - id: wk-ranking-24
    text: Workable Agent only supports English.
    quote: The Workable Agent doesn't support languages other than English yet.
    source: https://help.workable.com/hc/en-us/articles/38381544828695-Using-the-Workable-Agent
  questions:
  - id: wk-questions-1
    text: Workable knockout questions are Yes/No questions that auto-disqualify a candidate who answers "No".
    quote: For custom 'Yes/No' questions on the application form, you can choose to automatically disqualify candidates
      who answer "No".
    source: https://help.workable.com/hc/en-us/articles/115012238688-Auto-disqualify-candidates-using-application-form-questions
  - id: wk-questions-2
    text: In Workable, one "No" on any knockout question is enough to be disqualified.
    quote: You can enable multiple knock-out questions at the same time. The candidates will be disqualified if the answer
      is "No" for at least one of the questions.
    source: https://help.workable.com/hc/en-us/articles/115012238688-Auto-disqualify-candidates-using-application-form-questions
  - id: wk-questions-3
    text: A Workable auto-disqualified applicant still gets the confirmation email and is not told they were disqualified.
    quote: 'When a candidate answers with "No": - they will still receive an application confirmation email - they are added
      to your Workable account under the Disqualified tab in the Applied stage - the candidate does not know that they have
      been disqualified'
    source: https://help.workable.com/hc/en-us/articles/115012238688-Auto-disqualify-candidates-using-application-form-questions
  - id: wk-questions-4
    text: Workable suggests knockout questions for must-have skills, years of experience and location/work authorization.
    quote: Set up knock-out questions for must-have skills, years of experience, and location requirements. Candidates who
      answer 'No' to these questions will be disqualified automatically
    source: https://help.workable.com/hc/en-us/articles/23365968258711-Best-practices-Candidate-Screening
  - id: wk-questions-5
    text: Workable can turn a job's listed requirements into Yes/No questions automatically, so posted requirements may
      show up as knockout questions.
    quote: 'Yes/No: Select ‘Use requirements as questions’ to convert the job requirements into yes or no questions. You
      can edit the generated questions, add new ones, and choose to automatically disqualify candidates based on a “No”
      response.'
    source: https://help.workable.com/hc/en-us/articles/115012087467-What-types-of-questions-can-I-add-to-my-application-form
  - id: wk-questions-6
    text: All custom application questions in Workable are mandatory.
    quote: All custom questions are mandatory and they require a response from the candidate.
    source: https://help.workable.com/hc/en-us/articles/115012087467-What-types-of-questions-can-I-add-to-my-application-form
  - id: wk-questions-7
    text: Applicants who fail a Workable knockout question are auto-disqualified before any Workable Agent AI scoring (they
      use no AI credits).
    quote: Add knockout questions in your application form for your non-negotiable requirements (work authorization, location,
      and so on). Candidates who fail these are auto-disqualified and use no AI credits.
    source: https://help.workable.com/hc/en-us/articles/41050763193623-Getting-started-with-the-Workable-Agent
  keywords: []
  acronyms: []
  placement:
  - id: wk-placement-1
    text: Workable's only candidate-facing layout guidance is clear sections, readable fonts, few images, and no image-only
      resume.
    quote: Divide the text into clear sections and use easily readable fonts ... Avoid using too many images in the document
      - Avoid resumes that only consist of an image (i.e. 'infographics' type of resume)
    source: https://jobseekers.workable.com/hc/en-us/articles/360036231313-Import-your-resume-details-to-autofill-the-application
  questions_api:
    exposed: false
    how: The documented unauthenticated endpoint GET https://www.workable.com/api/accounts/{subdomain}?details=true returns
      jobs (title, location, description, experience, education...) but no questions; GET /spi/v3/jobs/:shortcode/questions
      (and /application_form) return question body, type, required and choices but need a Bearer token with r_jobs scope.
      No public questions endpoint is documented.
    source: https://workable.readme.io/reference/job-questions
  model:
    detect_hosts: [".workable.com"]
    channels:
    - name: Workable Agent score (criteria met, must-have 2 points, nice-to-have 1; synonyms and transferable skills)
      cite: [wk-ranking-11, wk-ranking-14, wk-ranking-16]
      skills: taxonomy
      related: [wk-ranking-16]
      required_weight: [wk-ranking-14]
      years: [wk-ranking-13]
    parse_checks:
      images: {cite: [wk-parsing-3], effect: degrade}
      file_type: {value: [pdf, doc, docx, rtf, html, odt], cite: [wk-files-1], effect: block}
      max_mb: {value: 5, cite: [wk-files-1], effect: block}
jobvite:
  label: Jobvite
  parsing:
  - id: jv-parsing-1
    text: Jobvite cannot take scanned or locked PDFs at the apply page; candidates should use Word or an unlocked PDF.
    quote: Currently, you cannot add resumes that are scanned or locked PDFs. Please ensure that the document is in Word
      format or an unlocked PDF. After uploading your resume to populate application fields, you may still need to use the
      Attach button to include your resume as part of your application file.
    source: https://help.jobvite.com/s/article/Job-Seeker-Application
  - id: jv-parsing-2
    text: Jobvite parses the resume into plain text for internal search; the recruiter still receives the original file.
    quote: What you are seeing is a text-only preview of your resume. The parsing is for internal search purposes within
      our software. Rest assured, the recruiter will receive a copy of your resume in its original format (.PDF, .DOC, etc.).
    source: https://help.jobvite.com/s/article/Job-Seeker-Application
  - id: jv-parsing-3
    text: Image files (.jpeg/.png) uploaded as resumes and image-type PDFs are accepted by some channels but are not parsable
      by Jobvite.
    quote: Image file uploaded as a resume - Image files, such as .jpeg or .png, are accepted through some application channels;
      however, they are not parsable by our document conversion process. Image Type PDF - While these are PDF files, image-type
      PDFs are similarly non-parsable by Jobvite ATS systems.
    source: https://help.jobvite.com/s/article/File-Formats-Supported-in-Jobvite-ATS
  - id: jv-parsing-4
    text: Pasting a very short string (like "N/A") into Jobvite's paste-resume box produces an unusable file.
    quote: When a jobseeker enters a very short text string into the text box, such as "N/A", "None", "No", or "No Resume",
      our parser is unable to handle it and outputs a .txt file containing a short string of special characters.
    source: https://help.jobvite.com/s/article/File-Formats-Supported-in-Jobvite-ATS
  - id: jv-parsing-5
    text: Jobvite Talent Fit only works on text PDFs.
    quote: Q. Does Talent Fit work if the candidate has a PDF resume? A. Yes. If the PDF document is a text PDF.
    source: https://help.jobvite.com/s/article/Talent-Fit-in-Jobvite
  - id: jv-parsing-6
    text: Jobvite says Talent Fit cannot produce consistent evaluations for blank, heavily redacted, or content-poor resumes,
      and pauses for that job.
    quote: When the system encounters conditions where it cannot confidently produce consistent evaluations for all candidates
      applying to a job — such as blank resumes, heavily redacted resumes, or resumes with insufficient content for analysis
      — Talent Fit is automatically temporarily disabled for that job
    source: https://help.jobvite.com/s/article/Talent-Fit-Temporarily-Disabled-for-a-Job
  - id: jv-parsing-7
    text: Jobvite's own 2016 blog (generic ATS advice quoting outside recruiters, not a description of Jobvite's parser)
      told candidates to avoid lines, tables, color, graphics, headers and footers.
    quote: Absolutely no horizontal lines running across your resume, no tables, no color, no graphics, no headers and footers,
      and no typos.
    source: https://www.jobvite.com/candidate-engagement/what-every-job-candidate-should-know-about-submitting-a-resume-to-an-applicant-tracking-system-ats/
  - id: jv-parsing-8
    text: The same 2016 Jobvite blog advised against special-character bullets.
    quote: Avoid special characters as bullets, or risk having resume content deleted, including diamond shapes, scrollwork,
      color-coordinated square boxes, checkmark boxes, or arrowheads.
    source: https://www.jobvite.com/candidate-engagement/what-every-job-candidate-should-know-about-submitting-a-resume-to-an-applicant-tracking-system-ats/
  file_types:
  - id: jv-files-1
    text: Jobvite supports pdf, doc, docx, txt, rtf, html, htm, png, jpeg, jpg, gif and xlsx, and each customer can restrict
      this list.
    quote: pdf doc docx txt rtf html htm png jpeg jpg gif xlsx These are currently our ONLY supported file formats. While
      we are unable to add additional file formats, your Named Support Contact(s) can submit support requests, and our support
      team can restrict any number of the options listed above.
    source: https://help.jobvite.com/s/article/File-Formats-Supported-in-Jobvite-ATS
  ranking:
  - id: jv-ranking-1
    text: Jobvite ATS (Evolve ATS) recruiter search supports full Boolean; AND is implied between words.
    quote: AND is implied. In other words, you will get the same result if you type java AND perl as if you type java perl.
    source: https://help.jobvite.com/s/article/Boolean-Terms-and-Searching-Candidates
  - id: jv-ranking-2
    text: In Jobvite ATS, quotes require the words to be adjacent.
    quote: If you use quotation marks around two or more words, you will only get results with those words next to each
      other. (Exactly) If you type “project manager“ , you will only get those with that term in their profiles, not someone
      who is a manager and mentions project elsewhere on the resume.
    source: https://help.jobvite.com/s/article/Boolean-Terms-and-Searching-Candidates
  - id: jv-ranking-3
    text: Jobvite ATS documents the * wildcard as the way to catch word variants (manager/management/managing); no automatic
      stemming or synonyms is documented for the ATS search.
    quote: If you use an asterisk, you will get any words that start with the letters before the * (Starts with) If you
      type manag* , you will get those with manager , management , managing , etc, on their profiles.
    source: https://help.jobvite.com/s/article/Boolean-Terms-and-Searching-Candidates
  - id: jv-ranking-4
    text: Jobvite ATS search defaults to Name Only; recruiters switch to All (Keyword) to search resumes and messages, and
      can turn on Exact Match.
    quote: The default setting is to search by Name Only ... Otherwise, you can elect to have the search words applied to
      the attendant information in their file, including their resume, messages, etc., including the All (Keyword) option.
      Exact Match allows you to enter search terms that must be matched exactly to return a result.
    source: https://help.jobvite.com/s/article/Boolean-Terms-and-Searching-Candidates
  - id: jv-ranking-5
    text: Jobvite ATS candidate search filters include Name, Resume, Messages, Notes and Exact Match.
    quote: You can search your entire candidate database using search filters such as Name , Resume , Messages , Notes,
      or Exact Match .
    source: https://help.jobvite.com/s/article/Managing-Candidates
  - id: jv-ranking-6
    text: In Jobvite Evolve Recruitment Marketing (CRM sourcing), Boolean search is exact-match by default; unticking Exact
      Match turns on stemming, with word order still enforced for phrases.
    quote: 'By default, Boolean Search performs an exact match search, meaning it looks for resumes that contain the same
      keywords entered in the query. To enable stemming, which allows for variations of the keywords, unselect the Exact
      Match checkbox and click Search . NOTE: When searching by a key phrase with stemming enabled (Exact Match checkbox
      unselected), the search will look for all words in the phrase in the same order. Each word will be subject to stemming.
      For example, a search for ''Benefits Coordinator'' will find resumes with ''benefit coordination'' but not ''coordinating
      benefits'' due to the order of words.'
    source: https://help.jobvite.com/s/article/Boolean-Search
  - id: jv-ranking-7
    text: In Jobvite Evolve RM, space-separated words are OR'd (unlike the ATS search, where they are AND'd).
    quote: OR word1 OR word2 word1 + word2 word1 word2 Used to find resumes that have at least one of the specific keywords.
    source: https://help.jobvite.com/s/article/Boolean-Search
  - id: jv-ranking-8
    text: Jobvite recruiters can filter candidates by whether Talent Fit marked them a match.
    quote: 'NOTE: You can also search for Talent Fit matched candidates through the search filter.'
    source: https://help.jobvite.com/s/article/Talent-Fit-in-Jobvite
  - id: jv-ranking-9
    text: Jobvite Talent Fit uses only the job description and the resume; no other application answers or job fields are
      used.
    quote: Talent Fit uses only the Job Description and the candidate’s resume to determine if the candidate is a fit for
      a job. No other data is included from the candidate’s application or other job details.
    source: https://help.jobvite.com/s/article/Talent-Fit-AI-Brief-1
  - id: jv-ranking-10
    text: Jobvite Talent Fit anonymizes the resume and prompts a third-party LLM, acting as a recruiter, to judge fit on
      the skills and experience the job description identifies.
    quote: First, the candidate's resume is anonymized, and then compared to the job description by prompting a large language
      model (LLM) to evaluate the candidate’s fit based on the identified skills and experience in the job description.
    source: https://help.jobvite.com/s/article/Talent-Fit-AI-Brief-1
  - id: jv-ranking-11
    text: Jobvite Talent Fit evaluates only the education, skills and experience the job description calls necessary, holistically,
      with no checklist formula.
    quote: The tool only evaluates education, skills, and experience that are called out as necessary by the job description.
      Candidates are holistically assessed – there is no formula or set of ‘boxes’ the candidate needs to tick to be considered
      a ‘fit’ for the job.
    source: https://help.jobvite.com/s/article/Talent-Fit-AI-Brief-1
  - id: jv-ranking-12
    text: Jobvite Talent Fit compares skills, certifications, licenses and experience from the resume against the job description.
    quote: Talent Fit uses the skills, certifications, licenses, and experience from a candidate’s resume and compares them
      against the job description for which they applied.
    source: https://help.jobvite.com/s/article/Talent-Fit-in-Jobvite
  - id: jv-ranking-13
    text: Jobvite Talent Fit output is binary (fit / not fit) plus strengths, key considerations and "areas to clarify";
      it is not a numeric rank.
    quote: We provide a binary decision on whether the candidate is a suitable fit, along with an explanation that includes
      the candidate’s strengths, key considerations, and areas for clarification.
    source: https://help.jobvite.com/s/article/Talent-Fit-AI-Brief-1
  - id: jv-ranking-14
    text: A candidate whose Jobvite Talent Fit match is low simply gets no Talent Fit label.
    quote: A binary match or nothing simplifies the user’s interpretation of the match results. ... A candidate whose job
      match is low will not have a Talent Fit label.
    source: https://help.jobvite.com/s/article/Talent-Fit-in-Jobvite
  - id: jv-ranking-15
    text: Jobvite Talent Fit judges each candidate on their own, not relative to other applicants.
    quote: No job is guaranteed to have a certain number of matches, and each candidate is evaluated individually, with
      no consideration of the other candidates in the pipeline.
    source: https://help.jobvite.com/s/article/Talent-Fit-AI-Brief-1
  - id: jv-ranking-16
    text: Jobvite Talent Fit is a supplemental label; candidates without a result stay in the pipeline and go through the
      normal workflow (no auto-reject is documented).
    quote: Candidates without a Talent Fit result will still appear in your pipeline and can be reviewed, advanced, or rejected
      through your normal workflow — Talent Fit is a supplemental tool.
    source: https://help.jobvite.com/s/article/Talent-Fit-Temporarily-Disabled-for-a-Job
  - id: jv-ranking-17
    text: 'Jobvite Talent Fit is opt-in: off for every new requisition by default since August 4, 2026.'
    quote: As of August 4th, 2026, by default, Talent Fit is turned OFF for every new requisition created. In order to turn
      Talent Fit on for a requisition, check the Enable Talent Fit checkbox at the very end of the requisition creation
      page.
    source: https://help.jobvite.com/s/article/Talent-Fit-in-Jobvite
  - id: jv-ranking-18
    text: Jobvite Talent Fit re-runs when the job description or the candidate's resume changes.
    quote: Talent Fit will automatically reprocess if there is a change to the job description or a candidate’s resume.
    source: https://help.jobvite.com/s/article/Talent-Fit-in-Jobvite
  - id: jv-ranking-19
    text: Jobvite Talent Fit is English-only.
    quote: A. Talent Fit is only available in English.
    source: https://help.jobvite.com/s/article/Talent-Fit-in-Jobvite
  - id: jv-ranking-20
    text: The legacy Jobvite "Candidate Match" (2020 blog) was an AI scoring system based on skills match and career trajectory.
    quote: Jobvite Candidate Matching lets recruiters quickly and easily identify which candidates are most suited for each
      open position based on skills match and career trajectory. Matches are made using our AI-based scoring system, which
      learns and improves over time.
    source: https://www.jobvite.com/blog/ai-and-automation/ai-technology-algorithms-bring-candidate-matching-to-a-new-level/
  questions:
  - id: jv-questions-1
    text: Jobvite screening forms can score answers and move candidates to another workflow status based on individual answers
      or the total form score.
    quote: Scoring Candidates - Jobvite ATS screening questions can be used to score candidate responses and apply weighting
      to give recruiters an overall form score. Workflow Options - Candidates can be moved to a different workflow step
      based on individual question responses.
    source: https://help.jobvite.com/s/article/Pre-screening-Forms
  - id: jv-questions-2
    text: Jobvite recommends screening forms for objective requirements like degree, certification, license, and minimum
      years of experience.
    quote: Use screening forms for all positions with objective requirements (e.g., degree, certification, license, min.
      years of experience).
    source: https://help.jobvite.com/s/article/Pre-screening-Forms
  - id: jv-questions-3
    text: A candidate knocked out by a Jobvite screening question is set to Rejected without an automatic rejection email.
    quote: 'NOTE: Candidates rejected through ‘knockout’ do not receive a rejection email. Their status has just changed
      to Rejected .'
    source: https://help.jobvite.com/s/article/Pre-screening-Forms
  - id: jv-questions-4
    text: A wrong answer to a Jobvite screening question routes the application straight to Rejected instead of New.
    quote: If a candidate does not correctly answer a screening question on your requisition's screening form, the system
      automatically routes their application to 'Rejected' status instead of 'New.'
    source: https://help.jobvite.com/s/article/Troubleshoot-Missing-New-Applicants-Due-to-Screening-Question-Responses
  - id: jv-questions-5
    text: Jobvite form scores run 0-100 from employer-set per-answer points and per-question weights.
    quote: When the candidate completes the form, the score is calculated according to your scoring for each answer and
      your weighting for each question. This score will be between 0 and 100 points.
    source: https://help.jobvite.com/s/article/Pre-screening-Forms
  keywords:
  - id: jv-keywords-1
    text: Jobvite's own 2016 blog (quoting an outside resume writer, generic ATS advice) told candidates to take keywords
      from the job description.
    quote: An easy way to appease the ATS is to include the keywords that the employer is looking for in your resume. To
      do this, carefully review the employer’s job description and identify the skill sets or abilities that they emphasize.
    source: https://www.jobvite.com/candidate-engagement/what-every-job-candidate-should-know-about-submitting-a-resume-to-an-applicant-tracking-system-ats/
  - id: jv-keywords-2
    text: The same 2016 Jobvite blog warned against claiming skills you do not have.
    quote: While you want to make sure all crucial skills are included, job seekers should avoid trying to game the system
      by over-stating their skills or abilities, or adding words that don’t apply.
    source: https://www.jobvite.com/candidate-engagement/what-every-job-candidate-should-know-about-submitting-a-resume-to-an-applicant-tracking-system-ats/
  acronyms:
  - id: jv-acronyms-1
    text: Jobvite Talent Fit recognizes abbreviations in the context of the job (e.g. "TA" read as "Talent Acquisition"
      for a talent-acquisition job).
    quote: Q. With Talent Fit, if I have TA in my resume but Talent Fit is looking for Talent Acquisition, will it find
      me as a match? A. Yes, our matching process recognizes abbreviations in the context of the job description. Therefore,
      it would understand TA as Talent Acquisition if the context of the Job is Talent Acquisition.
    source: https://help.jobvite.com/s/article/Talent-Fit-in-Jobvite
  - id: jv-acronyms-2
    text: Jobvite's 2016 blog (quoting an outside recruiter) told candidates to include both the spelled-out form and the
      abbreviation.
    quote: Also be sure to include both the spelled-out version and abbreviations of the same word.
    source: https://www.jobvite.com/candidate-engagement/what-every-job-candidate-should-know-about-submitting-a-resume-to-an-applicant-tracking-system-ats/
  placement:
  - id: jv-placement-1
    text: Jobvite's 2016 blog (quoting outside recruiters) advised standard section headings.
    quote: Stick with basic sections titled Qualifications, Professional Experience, Education [and] Skills, and avoid unfamiliar
      headings.
    source: https://www.jobvite.com/candidate-engagement/what-every-job-candidate-should-know-about-submitting-a-resume-to-an-applicant-tracking-system-ats/
  questions_api:
    exposed: undocumented
    how: The Jobvite API spec is only an attachment on the help article (API key required per help center); no public, unauthenticated
      endpoint for a posting's screening questions is documented.
    source: https://help.jobvite.com/s/article/Jobvite-API
  model:
    detect_hosts: [".jobvite.com"]
    channels:
    - name: Recruiter keyword search (Boolean, words ANDed, variants only with a * wildcard)
      cite: [jv-ranking-1, jv-ranking-3]
      skills: literal
    - name: Talent Fit (LLM judges only what the job description calls necessary)
      cite: [jv-ranking-9, jv-ranking-11]
      skills: taxonomy
      preferred_zero: [jv-ranking-11]
    parse_checks:
      file_type: {value: [pdf, doc, docx, txt, rtf, html, htm], cite: [jv-files-1, jv-parsing-3], effect: block}
avature:
  label: Avature
  parsing:
  - id: av-parsing-1
    text: Avature says its AI Resume Parser extracts candidate information with 90 percent accuracy in its own analysis.
    quote: In a similar analysis, Avature’s AI Resume Parser obtained 90 percent accuracy in extracting relevant candidate
      information and presenting it ready for use by recruiting teams.
    source: https://www.avature.net/blogs/eighty-percent-of-ai-recommended-candidates-are-considered-suitable/
  - id: av-parsing-2
    text: Avature built its own parser in-house because outside parsers had language limitations.
    quote: In the early days of developing a recruiting solution, parsing was one of the obstacles the team encountered
      for the technology to be truly effective. When investigating solutions already available in the market, they came
      across significant language limitations which triggered them to develop a powerful parser internally.
    source: https://www.avature.net/blogs/artificial-intelligence-in-recruitment-and-talent-management/
  - id: av-parsing-3
    text: Avature's published research describes a neural resume parser that handles section detection and field extraction
      together, across 7 languages.
    quote: 'Resume Parsing as Hierarchical Sequence Labeling: An Empirical Study Extracting information from a resume is
      usually a two-stage process. Our ML team proposes using a neural network architecture to tackle both stages simultaneously.
      The model improves system efficiency and resume parsing accuracy in 7 languages.'
    source: https://www.avature.net/ai-research/
  - id: av-parsing-4
    text: Avature's research normalizes education from resumes into level and field of study for matching.
    quote: Normalization of Education Information in Digitalized Recruitment Processes In this paper, our team normalizes
      education information extracted from resumes by transforming it into level/field of study. They also define a new
      taxonomy for fields of study and show how the process can be applied to candidate-job matching.
    source: https://www.avature.net/ai-research/
  - id: av-parsing-5
    text: Avature infers a candidate's skills from the resume, not just the words listed.
    quote: The same underlying technology that powers our semantic engine is capable of analyzing resumes and infer what
      skills candidates possess. Think of it like resume parsing turned to eleven.
    source: https://www.avature.net/blogs/ai-matching-is-reinventing-hr/
  file_types: []
  ranking:
  - id: av-ranking-1
    text: Avature Semantic Search expands a recruiter's query with related terms from Avature's ontology instead of matching
      only the exact words typed.
    quote: We built an ontology that ranks terms by how closely related they are to each other, so when a recruiter sits
      down and types “software developer” all the words that are “close” to it are added to the search parameters automatically.
    source: https://www.avature.net/blogs/down-to-earth-what-recruiting-ai-can-do-for-you/
  - id: av-ranking-2
    text: Avature Semantic Suggestions in Advanced Search add related terms for a search like "Java Developer".
    quote: When you go ahead and search the talent pool for candidates that fit the “Java Developer ” criteria, Avature
      Semantic Suggestions will not only pull that specific search term but also provide you with a selection of other relevant
      suggestions that may fit what you’re looking for.
    source: https://www.avature.net/blogs/transforming-candidate-search-with-scalable-recruiting-ai/
  - id: av-ranking-3
    text: Recruiters control which expanded terms Avature adds; they can add or remove terms.
    quote: Of course, with our technology recruiters are always in control of the extended search parameters . We make sure
      they can always see what Avature is “thinking”. ... if they know results would improve by removing or adding a specific
      term or category they can do so with ease.
    source: https://www.avature.net/blogs/down-to-earth-what-recruiting-ai-can-do-for-you/
  - id: av-ranking-4
    text: Avature semantic search can cover job roles, skills, years of experience and preferences, and lets the user include
      or hide less-similar results.
    quote: 'We are currently putting the final touches on semantic search, a function that uses artificial intelligence
      (AI) to find semantic correlations for every term you search for. Job roles, relevant skills, years of experience,
      personal preferences: the search possibilities are endless. ... After running a search, the system automatically expands
      the original criteria to include related search terms. The user can also decide whether or not to show less similar
      results that could still be relevant.'
    source: https://www.avature.net/blogs/how-to-overcome-search-limitations-with-your-crm/
  - id: av-ranking-5
    text: Avature also supports keyword/Boolean searching (e.g. WebSources across external databases).
    quote: Avature CRM also pioneered a feature called WebSources, which allows you to find candidates across multiple external
      applicant databases all at once by entering keywords or Boolean strings, geographical locations, recent profile updates,
      and other search criteria.
    source: https://www.avature.net/blogs/how-to-overcome-search-limitations-with-your-crm/
  - id: av-ranking-6
    text: Avature Copilot can generate Boolean strings from natural-language prompts.
    quote: Teams can generate Boolean strings from natural-language prompts, summarize candidate profiles, create outreach
      content, retrieve report data and recommend projects based on skills, certifications and prior work.
    source: https://www.avature.net/contingent-workforce-management/
  - id: av-ranking-7
    text: Avature describes its Semantic Search as understanding meaning and context, going beyond Boolean search.
    quote: – Improve the accuracy of your results with Semantic Search , as it understands both the meaning of the terms
      you searched for as well as the context they appear in. Go one step beyond the average Boolean search and discover
      those candidates that would have previously gone unnoticed.
    source: https://www.avature.net/learning-hub/sourcing/smarten-up-with-recruiting-ai-and-save-time-with-automation/
  - id: av-ranking-8
    text: Avature AI Candidate Recommendations score database candidates for a requisition on location, skills, education,
      job title and work experience, with weights adjustable per requisition.
    quote: 'AI-Powered Matching: Quickly rediscover qualified candidates within your database through AI-driven candidate
      recommendations, which take into account criteria such as candidate location, skills, education, job title and work
      experience. The weighting of these criteria can be tweaked according to the priorities of a particular requisition,
      helping you to find the best fit every time.'
    source: https://avature.ai/use-case/automated-sourcing/
  - id: av-ranking-9
    text: Avature matching identifies job titles and key skills from both the job description and the resume and scores
      suitability with predefined weighted factors.
    quote: To do so, matching AI identifies and compares job titles and key skills data from the job description and candidate
      resume and scores suitability according to predefined weighted factors.
    source: https://www.avature.net/blogs/eighty-percent-of-ai-recommended-candidates-are-considered-suitable/
  - id: av-ranking-10
    text: Avature Matching Explainability shows how each match is scored, and authorized users can change attribute weights
      per requisition.
    quote: 'Explainability: Avature shows how each match is scored and lets authorized users adjust attribute weights per
      requisition'
    source: https://www.avature.net/avature-vs-eightfold/
  - id: av-ranking-11
    text: Avature names skills, job title and location as the visible contributors to each recommendation.
    quote: 'Make the logic visible: Avature shows how skills, job title and location contribute to each recommendation,
      and what recruiters see, they can adjust.'
    source: https://www.avature.net/avature-vs-beamery/
  - id: av-ranking-12
    text: Avature Candidate Recommendations output a percentage compatibility score.
    quote: This is shown by a percentage score, which will depend on similarities between the job requisition and the candidate
      profile.
    source: https://www.avature.net/blogs/transforming-candidate-search-with-scalable-recruiting-ai/
  - id: av-ranking-13
    text: Avature High-Volume Recruiting ranks applicants by experience, skills and location against job requirements, then
      shortlists by shift availability and assessment scores.
    quote: Explainable AI automatically ranks candidates by experience, skills and location against job requirements before
      shortlisting according to shift availability and assessment scores.
    source: https://www.avature.net/high-volume-recruiting/
  - id: av-ranking-14
    text: Avature matches skills semantically using learned embeddings (skill2vec), so related skills count even if the
      exact word is missing (e.g. Java implies programming).
    quote: But matching the exact name of the skills is clearly not enough here because they can be referred to by other
      names (programming vs. software development). Also, the presence of a certain skill can indicate the implicit presence
      of another. For example, suppose you’re interested in candidates with programming skills. In that case, someone with
      Java, C++ or Python experience is obviously a skilled programmer, even if the skill ‘programming’ is not spelled out
      explicitly on their profile.
    source: https://www.avature.net/blogs/making-sense-of-skills-neural-network-models-for-skills-semantics/
  - id: av-ranking-15
    text: Avature's skill embeddings are the basis of its skill-based matching.
    quote: The skill embeddings are a cornerstone for a lot of our AI-powered functionality. They are used to perform skill-based
      matching or to suggest related skills.
    source: https://www.avature.net/blogs/making-sense-of-skills-neural-network-models-for-skills-semantics/
  - id: av-ranking-16
    text: Avature compares job titles semantically (a job-title similarity model), not by keyword match, and it generalizes
      to titles it has never seen.
    quote: Because the model operates on the semantic level, it allows job titles to be compared intelligently and not simply
      based on superficial keyword matching. Moreover, the model can generalize , which means it can predict similarity
      even for job titles that were not included in the data the model was trained on.
    source: https://www.avature.net/blogs/a-deep-dive-into-avatures-job-titles-similarity-model/
  - id: av-ranking-17
    text: Avature treats similarity of past job titles as one of the essential matching factors.
    quote: From skills to educational background, systems with matching functionalities can consider multiple variables
      to establish compatibility between candidates and open positions. However, past experience, and specifically the similarity
      between job titles, is one of the essential factors.
    source: https://www.avature.net/blogs/a-deep-dive-into-avatures-job-titles-similarity-model/
  - id: av-ranking-18
    text: Avature matching uses a proprietary skills ontology on the customer's own data.
    quote: 'Data boundaries: Avature matching runs on your own data and a proprietary skills ontology.'
    source: https://www.avature.net/avature-vs-eightfold/
  - id: av-ranking-19
    text: Avature describes its matching as deterministic.
    quote: Deterministic matching provides an explainable basis for review and bias testing.
    source: https://www.avature.net/avature-recognized-as-a-market-leader-in-the-fosway-vendor-ai-reality-chart-for-talent-acquisition/
  - id: av-ranking-20
    text: Avature says its AI recommendations draw attention to candidates but do not make decisions (no AI auto-reject
      is documented).
    quote: Furthermore, this sourcing AI feature doesn’t make any decisions for your recruiters but rather draws their attention
      to a set of candidates that might be a great fit for the opportunity in question.
    source: https://www.avature.net/blogs/transforming-candidate-search-with-scalable-recruiting-ai/
  - id: av-ranking-21
    text: Avature reports that 8 of its top 10 AI-recommended candidates are judged relevant by human experts.
    quote: AI recruiting technology is continuing to yield quietly impressive results, with a recent analysis of Avature’s
      explainable matching tool demonstrating 80 percent accuracy in recommending candidates for a given role. This means
      that out of the top ten candidates suggested by AI, human talent experts deem eight as relevant.
    source: https://www.avature.net/blogs/eighty-percent-of-ai-recommended-candidates-are-considered-suitable/
  - id: av-ranking-22
    text: Avature career sites semantically match job seekers to jobs on skills, experience and location, in multiple languages.
    quote: Our semantic matching leverages machine-learning models to match job seekers to jobs based on skills, experience
      and location, and works in multiple languages.
    source: https://www.avature.net/career-sites/
  questions:
  - id: av-questions-1
    text: Avature High-Volume Recruiting can screen with knock-out or weighted questions and automatically disposition candidates
      who fail.
    quote: Let smart automation identify qualified candidates with knock-out or weighted questions and disposition those
      who don’t make the cut.
    source: https://www.avature.net/high-volume-recruiting/
  - id: av-questions-2
    text: Avature screening can combine knock-out questions, weighted questions, assessments, skills, location, and availability.
    quote: Screen candidates using knock-out questions, weighted questions, assessments, skills, location, and availability.
    source: https://www.avature.net/high-volume-recruiting/
  - id: av-questions-3
    text: Avature ATS screening uses role-specific questions, ranking logic and integrated assessments.
    quote: Screen candidates using role-specific questions, ranking logic, and integrated assessments.
    source: https://www.avature.net/applicant-tracking-system/
  keywords:
  - id: av-keywords-1
    text: Avature's career-site page calls keyword search brittle and jargon-dependent, which is why it uses semantic search.
    quote: Keyword search functionality is brittle and prone to depend on jargon, often delivering disappointing results
      when users input different terminology or misspelled keywords. Besides, new job titles are emerging all the time.
      Avature’s semantic search compensates for these issues with suggestions that significantly improve search accuracy.
    source: https://www.avature.net/career-sites/
  - id: av-keywords-2
    text: An Avature blog says tailored keywords are now the bare minimum, not a differentiator, for recruiters.
    quote: Tailored keywords, cover letters, all of the little details and extra discretionary effort that once showed a
      candidate is genuinely keen are no longer differentiators in a world in which generative AI can provide this in seconds.
      They’re the bare minimum.
    source: https://www.avature.net/blogs/combating-serial-job-applicants-in-the-age-of-ai/
  acronyms: []
  placement: []
  questions_api:
    exposed: undocumented
    how: Avature advertises an "open API" but its API documentation is not public; no unauthenticated endpoint exposing
      a posting's application questions is documented.
    source: https://www.avature.net/avature-vs-beamery/
  model:
    detect_hosts: [".avature.net"]
    channels:
    - name: AI Candidate Recommendations (semantic skills and job-title similarity)
      cite: [av-ranking-8, av-ranking-9]
      skills: taxonomy
      related: [av-ranking-14]
      title: [av-ranking-16, av-ranking-17]
