# Curated HARD-skill lexicon for ATS coverage and the fit score (same scorer, GOAL §5/§7).
# {Category: {Canonical name: [aliases...]}}. Matching is case-insensitive on word boundaries.
# Soft skills, generic business words and vague words are deliberately absent (resume-editor Phase 2 auto-ignore).
# Generic English words: these count only case-sensitively as items of a list ("Spark, Ray, Dask"), like
# R and Go, so "cost optimization", "X-ray" or "lambda expressions" never count (lexicon.py).
list_items_only: [Optimization, Ray, Lambda, Streaming, SAS, Cursor]
# GOAL4 §3 / decision 007: keyword match view. display_ignore = lexicon terms left out of the keyword %
# (empty: every term counts); pct_mode count = matched/extracted, weighted = by importance; min_corpus_jds = the overfit
# gate for lexicon additions (an addition must occur in this many open JDs or in a resume skills section).
keywords:
  display_ignore: []
  pct_mode: count
  min_corpus_jds: 3
