# Related skills (decision 010): groups of tools that do the same job, so a vendor whose documentation says
# its AI matching infers or semantically matches related skills gives partial credit (0.5, our modeling choice) for a
# group mate when the exact skill is missing. Hand-curated and local ($0); only vendors with a cited fact use it, and
# every credit is shown in the drawer as "<skill> (~ via <group mate>)". Names are lexicon canonical names.
