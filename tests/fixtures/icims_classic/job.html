<html><head><title>Job</title><script type="application/ld+json">{"hiringOrganization":{"@type":"Organization","name":"Stifel","sameAs":"www.stifel.com/"},"validThrough":"2027-10-05T04:00:00.000Z","jobLocation":[{"address":{"addressCountry":"US","streetAddress":"501 North Broadway","@type":"PostalAddress","postalCode":"631022131","addressLocality":"Saint Louis","addressRegion":"MO","postOfficeBoxNumber":"UNAVAILABLE"},"@type":"Place"}],"employmentType":"FULL_TIME","@type":"JobPosting","description":"<h2>Why Stifel<\/h2>\n<p>Stifel strives for a culture that puts its clients and associates first: a culture where everyone belongs, everyone is welcome, and everyone contributes to the success of our clients, their careers, and the firm as a whole.<\/p>\n<p>&nbsp;<\/p>\n<p>Let\u2019s talk about how you can find your place here at Stifel,&nbsp;<strong>where success meets success<\/strong>.<\/p>\n<h2>What You'll Be Doing<\/h2>\n<p>The Sr. AI Cloud Platform Engineer is a member of the Security Engineering &amp; Automation team, the security organization's shared build capability, and is responsible for the platform architecture and hands-on engineering of secure, reusable capabilities that enable security teams to operate more efficiently and consistently. This role architects and develops shared security platforms, tool integrations, AI-enabled security capabilities, metrics and dashboarding services, proofs of concept, and automation that removes recurring manual work, built once and designed for adoption by multiple security pods rather than as one-off solutions. Operating with a high degree of autonomy, this role partners with Security Architecture and cloud platform architects to align team-owned solutions with organizational standards and strategic direction. The team operates under a clear contract, Security Engineering &amp; Automation builds, and consuming pods configure, run, and report.<\/p>\n<h2>What We're Looking For<\/h2>\n<ul>\n <li>Lead the architecture and technical design of the team's shared capabilities \u2014 platforms, services, integrations, APIs, data pipelines, and automation \u2014 built to be secure, scalable, resilient, and reusable.<\/li>\n <li>Build shared security tool integrations and reusable automation that eliminate manual toil, reduce duplicated engineering effort, and improve consistency across security pods.<\/li>\n <li>Architect AI solutions that both secure the organization's use of AI and apply AI to improve security operations, analysis, and decision support.<\/li>\n <li>Build and maintain shared metrics, data, and dashboarding capabilities, including common data models and integration patterns, that enable automated, business-readable reporting across the security organization.<\/li>\n <li>Partner with Security Architecture to embed security requirements, approved patterns, controls, and risk decisions into platform designs, and collaborate with enterprise and cloud platform architects to align with broader technology strategies and standards.<\/li>\n <li>Translate business, security, operational, and regulatory requirements into platform designs and executable implementation plans.<\/li>\n <li>Develop infrastructure as code using Terraform, CloudFormation, or CDK, and build automation and integrations using Python, Bash, PowerShell, AWS Lambda, Step Functions, APIs, and event-driven and workflow orchestration services.<\/li>\n <li>Embed identity and access management, secrets management, encryption, network controls, data protection, logging, monitoring, and policy enforcement into team-owned solutions.<\/li>\n <li>Conduct proofs of concept and technical evaluations to validate solution viability and inform build-versus-buy decisions, assessing technologies for technical fit, security, interoperability, supportability, cost, and reuse potential.<\/li>\n <li>Create reusable reference architectures, implementation patterns, technical standards, and onboarding guidance, and contribute to the team's service catalog, including available capabilities, engagement criteria, and ownership expectations.<\/li>\n <li>Define consumption, configuration, and support boundaries for team-built services in partnership with product management and consuming pods, along with measurable outcomes such as adoption, toil reduction, onboarding time, and data freshness.<\/li>\n <li>Maintain the reliability, availability, observability, and security of shared team-owned platforms and their CI/CD and operational tooling, and support incidents and root-cause analysis while pod-specific operations, triage, and tool administration remain with the consuming pod.<\/li>\n <li>Publish architecture diagrams, decision records, runbooks, and service documentation, and communicate evaluations, proof-of-concept results, roadmaps, and delivered business value through planning forums, demonstrations, and stakeholder reviews.<\/li>\n <li>Mentor engineers and promote strong platform engineering, secure development, automation, and architecture practices within the team.<\/li>\n<\/ul>\n<h2>What You'll Bring<\/h2>\n<ul>\n <li>Strong analytical and problem-solving skills with the ability to identify manual toil and design reusable capabilities that eliminate it.<\/li>\n <li>Ability to effectively communicate technical topics and architectural decisions to technical and non-technical audiences.<\/li>\n <li>Deep understanding of platform architecture principles, including scalability, reliability, observability, interoperability, and cost management.<\/li>\n <li>Understanding of AI and LLM-based systems, including generative AI, agentic workflows, and their security considerations.<\/li>\n <li>Demonstrated ability to operate independently, lead technical design efforts, prioritize workload, and collaborate across organizational boundaries.<\/li>\n <li>Experience architecting and developing reusable cloud or platform capabilities \u2014 integrations, automation, APIs, or data pipelines \u2014 used by multiple teams.<\/li>\n <li>Experience conducting proofs of concept, technical evaluations, and build-versus-buy assessments.<\/li>\n <li>Experience incorporating security requirements and controls into cloud and platform solutions in partnership with Security Architecture or comparable governance functions.<\/li>\n <li>Experience designing for measurable outcomes such as adoption, toil reduction, reliability, and onboarding efficiency.<\/li>\n<\/ul>\n<h2>Education &amp; Experience<\/h2>\n<ul>\n <li>Minimum Required: Bachelor's degree in Computer Science, Information Systems, Computer Engineering, Software Engineering, Data Science, Cybersecurity, or related field, or a related combination of education and experience.<\/li>\n <li>Minimum Required: 6+ years of platform, infrastructure, DevOps, cloud, automation, integration, security engineering, or software engineering experience; 3+ years of hands-on AWS experience in production environments.<\/li>\n <li>Minimum Required: Experience applying AI, machine learning, or generative AI to automation, engineering, or security use cases.<\/li>\n <li>Preferred: Experience with metrics platforms, APIs, or workflow orchestration.<\/li>\n <li>Preferred: Experience supporting regulated or financial-services environments.<\/li>\n<\/ul>\n<h2>Licenses &amp; Credentials<\/h2>\n<ul>\n <li>Minimum Required: AWS Certified Solutions Architect \u2014 Associate or Professional, or equivalent demonstrated AWS expertise.<\/li>\n <li>Preferred: AWS Certified DevOps Engineer \u2014 Professional.<\/li>\n <li>AWS Certified Security \u2014 Specialty, AWS Certified Machine Learning \u2014 Specialty, HashiCorp Terraform Associate, CCSP, CISSP, or comparable cloud, AI, or platform engineering credentials, is a plus.<\/li>\n<\/ul>\n<h2>Systems &amp; Technology<\/h2>\n<ul>\n <li>Deep hands-on AWS experience, including services such as EC2, VPC, IAM, Lambda, ECS/EKS, S3, RDS, CloudWatch, Organizations, and Control Tower.<\/li>\n <li>Experience with infrastructure as code (Terraform, CloudFormation, or CDK) and scripting and automation using Python, Bash, PowerShell, or similar languages.<\/li>\n <li>Experience designing and integrating APIs, event-driven services, workflow automation, and third-party security technologies for adoption by multiple teams.<\/li>\n <li>Experience with AI and machine learning services such as Amazon Bedrock, Amazon SageMaker, Azure OpenAI, or OpenAI APIs, including generative AI, retrieval-augmented generation, agentic workflows, and model gateways.<\/li>\n <li>Working knowledge of cloud and platform security, including IAM least privilege, secrets management, encryption, network security, logging, monitoring, data protection, and policy-as-code.<\/li>\n <li>Preferred: Metrics, dashboarding, and data platforms such as Grafana, Power BI, QuickSight, or OpenSearch.<\/li>\n <li>Preferred: CI/CD tooling (GitHub Actions, Azure DevOps, or Jenkins), container orchestration (Docker, Kubernetes, or ECS/EKS), and observability tooling (Datadog, Prometheus, or OpenTelemetry).<\/li>\n <li>Preferred: Experience with OPA, AWS Config, Service Control Policies, cloud security posture management, data-loss prevention, or automated guardrail technologies.<\/li>\n<\/ul>\n<h2>About Stifel<\/h2>\n<p>Stifel is more than 130 years old and still thinking like a start-up.&nbsp; We are a global wealth management and investment banking firm serious about innovation and fresh ideas.&nbsp; Built on a simple premise of safeguarding our clients\u2019 money as if it were our own, coined by our namesake, Herman Stifel, our success is intimately tied to our commitment to helping families, companies, and municipalities find their own success.<\/p>\n<p>&nbsp;<\/p>\n<p>While our headquarters is in St. Louis, we have offices in New York, San Francisco, Baltimore, London, Frankfurt, Toronto, and more than 400 other locations.&nbsp; Stifel is home to approximately 9,000 individuals who are currently building their careers as financial advisors, research analysts, project managers, marketing specialists, developers, bankers, operations associates, among hundreds more.&nbsp; Let\u2019s talk about how you can find your place here at Stifel, where success meets success.<\/p>\n<p>&nbsp;<\/p>\n<p>At Stifel we offer an entrepreneurial environment, comprehensive benefits package to include health, dental and vision care, 401k, wellness initiatives, life insurance, and paid time off.<\/p>\n<p>&nbsp;<\/p>\n<p>Stifel is an Equal Opportunity Employer.<\/p>","directApply":true,"datePosted":"2026-10-05T04:00:00.000Z","title":"Sr. AI Cloud Platform Engineer","occupationalCategory":"Information Technology","@context":"http://schema.org","url":"https://careers-stifel.icims.com/jobs/10024/sr.-ai-cloud-platform-engineer/job"}</script></head><body>trimmed</body></html>
