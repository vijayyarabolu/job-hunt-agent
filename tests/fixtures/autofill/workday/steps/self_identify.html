<h2>Voluntary Self-Identification of Disability</h2>
<div data-wd="text" data-field="name" data-input-id="selfIdentifiedDisabilityData--name" data-label="Name" data-required></div>
<div data-wd="date" data-field="dateSignedOn" data-label="Date" data-parts="MM|DD|YYYY" data-required></div>
<div data-wd="checkboxes" data-field="disabilityStatus" data-label="Please check one of the boxes below:" data-options="Yes, I have a disability, or have had one in the past|No, I do not have a disability and have not had one in the past|I do not want to answer"></div>
