<h2>Application Questions</h2>
<div data-wd="listbox" data-field="q1" data-label="Are you legally authorized to work in the United States?" data-required data-options="Yes|No"></div>
<div data-wd="listbox" data-field="q2" data-label="Will you now or in the future require sponsorship for employment visa status (e.g., H-1B visa status)?" data-required data-options="Yes|No"></div>
<div data-wd="listbox" data-field="q3" data-label="Are you at least 18 years of age?" data-required data-options="Yes|No"></div>
<div data-wd="listbox" data-field="q4" data-label="Do you have production experience with Kubernetes operators?" data-required data-options="Yes|No"></div>
<div data-wd="date" data-field="availableDate" data-label="Earliest start date" data-parts="MM|DD|YYYY" data-required></div>
<div data-wd="listbox" data-field="qStart" data-label="When can you start?" data-required data-options="Immediately|Within 2 weeks|Within 1 month|More than 1 month"></div>
