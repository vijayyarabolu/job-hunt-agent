<h2>My Information</h2>
<div data-wd="prompt" data-field="source" data-label="How Did You Hear About Us?" data-required data-single data-options="Company Website|Job Board|LinkedIn|Indeed|Employee Referral|Career Fair|Other"></div>
<div data-wd="radio" data-field="candidateIsPreviousWorker" data-label="Have you previously been employed by ZZ Test Corp?" data-required data-options="Yes|No"></div>
<div data-wd="listbox" data-field="country" data-label="Country" data-required data-value="United States of America" data-options="Canada|India|United States of America"></div>
<h3>Legal Name</h3>
<div data-wd="text" data-field="legalName--firstName" data-input-id="name--legalName--firstName" data-label="First Name" data-required></div>
<div data-wd="text" data-field="legalName--lastName" data-input-id="name--legalName--lastName" data-label="Last Name" data-required></div>
<h3>Address</h3>
<div data-wd="text" data-field="addressLine1" data-input-id="address--addressLine1" data-label="Address Line 1" data-required></div>
<div data-wd="text" data-field="addressLine2" data-input-id="address--addressLine2" data-label="Address Line 2"></div>
<div data-wd="text" data-field="city" data-input-id="address--city" data-label="City" data-required></div>
<div data-wd="listbox" data-field="countryRegion" data-label="State" data-required data-options="Alabama|Alaska|Arizona|California|Colorado|Kansas|Missouri|New York|Texas|Virginia|Washington"></div>
<div data-wd="text" data-field="postalCode" data-input-id="address--postalCode" data-label="Postal Code" data-required></div>
<h3>Phone</h3>
<div data-wd="listbox" data-field="phoneType" data-label="Phone Device Type" data-required data-options="Landline|Mobile|Telephone"></div>
<div data-wd="prompt" data-field="countryPhoneCode" data-label="Country Phone Code" data-required data-single data-options="Canada (+1)|India (+91)|United States of America (+1)"></div>
<div data-wd="text" data-field="phoneNumber" data-input-id="phoneNumber--phoneNumber" data-label="Phone Number" data-required></div>
<div data-wd="text" data-field="extension" data-input-id="phoneNumber--extension" data-label="Phone Extension"></div>
