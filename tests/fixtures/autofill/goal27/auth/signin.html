<!doctype html>
<!-- 1.3.1 (AUTOFILL-BUGS #6): an unknown site's Sign In form (user name / email and password). Synthetic. -->
<html lang="en"><head><meta charset="utf-8"><title>Candidate login</title>
<style>body{font:14px sans-serif;padding:24px}label{display:block;font-weight:600;margin-top:10px}</style></head>
<body><main><h1>Sign in</h1>
<form id="signin" action="#" onsubmit="return false">
<label for="si-user">Username or email</label><input id="si-user" name="username" type="text" autocomplete="username">
<label for="si-pw">Password</label><input id="si-pw" name="password" type="password" autocomplete="current-password">
<a href="#forgot">Forgot password?</a>
<button type="submit" id="si-submit">Sign In</button>
</form></main>
<script>window.__clicks = []; document.addEventListener("click", (e) => { if (e.target.closest("#si-submit")) window.__clicks.push(e.isTrusted); }, true);</script>
</body></html>
