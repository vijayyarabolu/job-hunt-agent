<!doctype html>
<!-- GOAL27 matrix fixture: JazzHR. Synthetic: modeled on JazzHR's public apply form (its field names, label wording and
     widget kinds); our own markup, the fake person's values only. Regenerate with make_fixtures.py. -->
<html lang="en"><head><meta charset="utf-8"><title>JazzHR: ML Engineer</title>
<meta property="og:title" content="ML Engineer"><meta property="og:site_name" content="ZZ Test Corp">
<style>body{font:14px sans-serif;padding:20px 24px 120px;max-width:760px}.field,.application-question,._fieldEntry,.iCIMS_InfoField,.row,fieldset{margin:8px 0}
label,legend,._label{display:block;font-weight:600}input[type=text],input:not([type]),input[type=email],input[type=tel],textarea,select{width:340px;padding:4px}
.select__control{border:1px solid #888;width:340px;min-height:28px;position:relative;display:flex}.select__value-container{flex:1;display:flex}
.select__input{border:0;width:100%}.select__menu{position:absolute;background:#fff;border:1px solid #888;width:340px;z-index:9}.select__option{padding:3px 6px;cursor:pointer}
.typeahead{position:relative}.typeahead-results{position:absolute;background:#fff;border:1px solid #888;list-style:none;margin:0;padding:0;width:340px;z-index:9}
.typeahead-results li{padding:3px 6px;cursor:pointer}._yesno button{margin-right:6px;padding:4px 14px}._active{background:#1f5fbf;color:#fff}
.entry{border:1px solid #ccc;padding:8px;margin:8px 0}.select2-selection{display:inline-block;border:1px solid #888;width:340px;padding:4px}</style></head>
<body><main><h1>ML Engineer</h1><p>ZZ Test Corp · Springfield, MO</p>
<form id="application-form" action="#" onsubmit="return false">
<div class="field"><label for="resumator-firstname-value">First Name</label><input id="resumator-firstname-value" name="resumator-firstname-value" type="text" data-expect="Zz" data-type="text"></div>
<div class="field"><label for="resumator-lastname-value">Last Name</label><input id="resumator-lastname-value" name="resumator-lastname-value" type="text" data-expect="Testcase" data-type="text"></div>
<div class="field"><label for="resumator-email-value">Email Address</label><input id="resumator-email-value" name="resumator-email-value" type="text" data-expect="zz.testcase@example.com" data-type="email"></div>
<div class="field"><label for="resumator-phone-value">Phone</label><input id="resumator-phone-value" name="resumator-phone-value" type="text" data-expect="555-010-0199" data-type="phone"></div>
<div class="field"><label for="resumator-address-value">Address</label><input id="resumator-address-value" name="resumator-address-value" type="text" data-expect="123 Main St" data-type="text"></div>
<div class="field"><label for="resumator-city-value">City</label><input id="resumator-city-value" name="resumator-city-value" type="text" data-expect="Springfield" data-type="text"></div>
<div class="field"><label for="resumator-state-value">State/Province</label><input id="resumator-state-value" name="resumator-state-value" type="text" data-expect="re:^(Missouri|MO)$" data-type="text"></div>
<div class="field"><label for="resumator-postal-value">Postal</label><input id="resumator-postal-value" name="resumator-postal-value" type="text" data-expect="65801" data-type="text"></div>
<div class="field"><label for="resumator-resume-value">Resume</label><input type="file" id="resumator-resume-value" name="resumator-resume-value" accept=".pdf,.doc,.docx" data-expect="re:_Resume\.pdf$" data-type="file"></div>
<div class="field"><label for="resumator-salary-value">Desired Salary</label><input id="resumator-salary-value" name="resumator-salary-value" type="text" data-expect="150000" data-type="text"></div>
<div class="field"><label for="resumator-questionnaire-1">Are you legally authorized to work in the United States?</label><select id="resumator-questionnaire-1" name="resumator-questionnaire-1" data-expect="Yes" data-type="legal"><option value="">Select...</option><option value="Yes">Yes</option><option value="No">No</option></select></div>
<div class="field"><label for="resumator-linkedin-value">LinkedIn Profile URL</label><input id="resumator-linkedin-value" name="resumator-linkedin-value" type="text" data-expect="https://www.linkedin.com/in/zz-testcase" data-type="text"></div>
<h3>Voluntary Self-Identification</h3><div class="field"><label for="gender">Gender</label><select id="gender" name="gender" data-expect="Male" data-type="eeo"><option value="">Select...</option><option value="Male">Male</option><option value="Female">Female</option><option value="Decline To Self Identify">Decline To Self Identify</option></select></div><div class="field"><label for="hispanic_ethnicity">Are you Hispanic/Latino?</label><select id="hispanic_ethnicity" name="hispanic_ethnicity" data-expect="No" data-type="eeo"><option value="">Select...</option><option value="Yes">Yes</option><option value="No">No</option><option value="Decline To Self Identify">Decline To Self Identify</option></select></div><div class="field"><label for="race">Race</label><select id="race" name="race" data-expect="Asian" data-type="eeo"><option value="">Select...</option><option value="American Indian or Alaskan Native">American Indian or Alaskan Native</option><option value="Asian">Asian</option><option value="Black or African American">Black or African American</option><option value="Hispanic or Latino">Hispanic or Latino</option><option value="White">White</option><option value="Two or More Races">Two or More Races</option><option value="Decline To Self Identify">Decline To Self Identify</option></select></div><div class="field"><label for="veteran_status">Veteran Status</label><select id="veteran_status" name="veteran_status" data-expect="I am not a protected veteran" data-type="eeo"><option value="">Select...</option><option value="I am a protected veteran">I am a protected veteran</option><option value="I am not a protected veteran">I am not a protected veteran</option><option value="I don&#x27;t wish to answer">I don&#x27;t wish to answer</option></select></div><div class="field"><label for="disability_status">Disability Status</label><select id="disability_status" name="disability_status" data-expect="No, I do not have a disability" data-type="eeo"><option value="">Select...</option><option value="Yes, I have a disability (or previously had a disability)">Yes, I have a disability (or previously had a disability)</option><option value="No, I do not have a disability">No, I do not have a disability</option><option value="I do not want to answer">I do not want to answer</option></select></div>
<div class="actions"><button type="submit" class="btn-submit">Submit Application</button></div>
</form></main>
<script src="/__sim/ats_sim.js"></script></body></html>
