<!doctype html>
<!-- GOAL27 matrix fixture: ADP. Synthetic: modeled on ADP's public apply form (its field names, label wording and
     widget kinds); our own markup, the fake person's values only. Regenerate with make_fixtures.py. -->
<html lang="en"><head><meta charset="utf-8"><title>ADP: ML Engineer</title>
<meta property="og:title" content="ML Engineer"><meta property="og:site_name" content="ZZ Test Corp">
<style>body{font:14px sans-serif;padding:20px 24px 120px;max-width:760px}.field,.application-question,._fieldEntry,.iCIMS_InfoField,.row,fieldset{margin:8px 0}
label,legend,._label{display:block;font-weight:600}input[type=text],input:not([type]),input[type=email],input[type=tel],textarea,select{width:340px;padding:4px}
.select__control{border:1px solid #888;width:340px;min-height:28px;position:relative;display:flex}.select__value-container{flex:1;display:flex}
.select__input{border:0;width:100%}.select__menu{position:absolute;background:#fff;border:1px solid #888;width:340px;z-index:9}.select__option{padding:3px 6px;cursor:pointer}
.typeahead{position:relative}.typeahead-results{position:absolute;background:#fff;border:1px solid #888;list-style:none;margin:0;padding:0;width:340px;z-index:9}
.typeahead-results li{padding:3px 6px;cursor:pointer}._yesno button{margin-right:6px;padding:4px 14px}._active{background:#1f5fbf;color:#fff}
.entry{border:1px solid #ccc;padding:8px;margin:8px 0}.select2-selection{display:inline-block;border:1px solid #888;width:340px;padding:4px}</style></head>
<body><main><h1>ML Engineer</h1><p>ZZ Test Corp · Springfield, MO</p>
<form id="application-form" action="#" onsubmit="return false">
<x-input data-label="First Name" data-name="firstName" data-expect="Zz" data-type="text"></x-input>
<x-input data-label="Last Name" data-name="lastName" data-expect="Testcase" data-type="text"></x-input>
<x-input data-label="Email" data-name="email" data-expect="zz.testcase@example.com" data-type="email"></x-input>
<x-input data-label="Mobile Phone" data-name="mobilePhone" data-expect="555-010-0199" data-type="phone"></x-input>
<div class="field"><label for="adp-country">Country</label><select id="adp-country" name="adp-country" data-expect="United States" data-type="select"><option value="">Select...</option><option value="Canada">Canada</option><option value="United States">United States</option></select></div>
<div class="field"><label for="adp-zip">Zip code</label><input id="adp-zip" name="adp-zip" type="text" data-expect="65801" data-type="text"></div>
<div class="field"><label for="adp-city">City</label><input id="adp-city" name="adp-city" type="text" data-expect="Springfield" data-type="text"></div>
<div class="field"><label for="adp-state">State</label><select id="adp-state" name="adp-state" data-expect="Missouri" data-type="select"><option value="">Select...</option><option value="Alabama">Alabama</option><option value="Alaska">Alaska</option><option value="Arizona">Arizona</option><option value="California">California</option><option value="Colorado">Colorado</option><option value="Kansas">Kansas</option><option value="Missouri">Missouri</option><option value="New York">New York</option><option value="Texas">Texas</option><option value="Washington">Washington</option></select></div>
<div class="field"><label for="adp-resume">Upload Resume</label><input type="file" id="adp-resume" name="adp-resume" accept=".pdf,.doc,.docx" data-expect="re:_Resume\.pdf$" data-type="file"></div>
<fieldset class="field" data-expect="Yes" data-type="legal"><legend>Are you legally authorized to work in the United States?</legend><label><input type="radio" name="adp-q1" value="Yes"> Yes</label><label><input type="radio" name="adp-q1" value="No"> No</label></fieldset>
<fieldset class="field" data-expect="No" data-type="legal"><legend>Will you now or in the future require sponsorship?</legend><label><input type="radio" name="adp-q2" value="Yes"> Yes</label><label><input type="radio" name="adp-q2" value="No"> No</label></fieldset>
<div class="field"><label><input type="checkbox" id="adp-terms" name="adp-terms" data-expect="checked" data-type="checkbox"> I have read and agree to the privacy policy</label></div>
<div class="actions"><button type="submit" class="btn-submit">Submit Application</button></div>
</form></main>
<script>
customElements.define("x-input", class extends HTMLElement {
  connectedCallback() {
    const r = this.attachShadow({ mode: "open" });
    const id = "in-" + this.dataset.name;
    r.innerHTML = `<style>label{display:block;font-weight:600}input{width:300px}</style><label for="${id}">${this.dataset.label}</label><input id="${id}" name="${this.dataset.name}" type="text">`;
    this.__simValue = () => r.querySelector("input").value;
  }
});
</script><script src="/__sim/ats_sim.js"></script></body></html>
