<!doctype html>

     widget kinds); our own markup, the fake person's values only. Regenerate with make_fixtures.py. -->
<html lang="en"><head><meta charset="utf-8"><title>Taleo: ML Engineer</title>
<meta property="og:title" content="ML Engineer"><meta property="og:site_name" content="ZZ Test Corp">
<style>body{font:14px sans-serif;padding:20px 24px 120px;max-width:760px}.field,.application-question,._fieldEntry,.iCIMS_InfoField,.row,fieldset{margin:8px 0}
label,legend,._label{display:block;font-weight:600}input[type=text],input:not([type]),input[type=email],input[type=tel],textarea,select{width:340px;padding:4px}
.select__control{border:1px solid #888;width:340px;min-height:28px;position:relative;display:flex}.select__value-container{flex:1;display:flex}
.select__input{border:0;width:100%}.select__menu{position:absolute;background:#fff;border:1px solid #888;width:340px;z-index:9}.select__option{padding:3px 6px;cursor:pointer}
.typeahead{position:relative}.typeahead-results{position:absolute;background:#fff;border:1px solid #888;list-style:none;margin:0;padding:0;width:340px;z-index:9}
.typeahead-results li{padding:3px 6px;cursor:pointer}._yesno button{margin-right:6px;padding:4px 14px}._active{background:#1f5fbf;color:#fff}
.entry{border:1px solid #ccc;padding:8px;margin:8px 0}.select2-selection{display:inline-block;border:1px solid #888;width:340px;padding:4px}</style></head>
<body><main><h1>ML Engineer</h1><p>ZZ Test Corp · Springfield, MO</p>
<form id="application-form" action="#" onsubmit="return false">
<h3>Personal Information</h3>
<div class="field"><label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_FirstName">First Name</label><input id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_FirstName" name="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_FirstName" type="text" data-expect="Zz" data-type="text"></div>
<div class="field"><label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_LastName">Last Name</label><input id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_LastName" name="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_LastName" type="text" data-expect="Testcase" data-type="text"></div>
<div class="field"><label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_EmailAddress">Email Address</label><input id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_EmailAddress" name="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_EmailAddress" type="text" data-expect="zz.testcase@example.com" data-type="email"></div>
<div class="field"><label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_MobilePhone">Cellular Phone</label><input id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_MobilePhone" name="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_MobilePhone" type="text" data-expect="555-010-0199" data-type="phone"></div>
<div class="field"><label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_Address">Address (line 1)</label><input id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_Address" name="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_Address" type="text" data-expect="123 Main St" data-type="text"></div>
<div class="field"><label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_City">City</label><input id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_City" name="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_City" type="text" data-expect="Springfield" data-type="text"></div>
<div class="field"><label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_ZipCode">Zip/Postal Code</label><input id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_ZipCode" name="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_ZipCode" type="text" data-expect="65801" data-type="text"></div>
<div class="field"><label for="taleo-attach">Attach a resume</label><input type="file" id="taleo-attach" name="taleo-attach" accept=".pdf,.doc,.docx" data-expect="re:_Resume\.pdf$" data-type="file"></div>
<h3>Questions</h3>
<div class="field"><label for="taleo-q1">Are you at least 18 years of age?</label><select id="taleo-q1" name="taleo-q1" data-expect="Yes" data-type="legal"><option value="">Select an answer</option><option value="Yes">Yes</option><option value="No">No</option></select></div>
<div class="field"><label for="taleo-q2">Are you legally authorized to work in the United States?</label><select id="taleo-q2" name="taleo-q2" data-expect="Yes" data-type="legal"><option value="">Select an answer</option><option value="Yes">Yes</option><option value="No">No</option></select></div>
<div class="field"><label for="taleo-q3">Will you now or in the future require sponsorship for employment visa status?</label><select id="taleo-q3" name="taleo-q3" data-expect="No" data-type="legal"><option value="">Select an answer</option><option value="Yes">Yes</option><option value="No">No</option></select></div>
<div class="field"><label for="taleo-date">Date Available</label><input id="taleo-date" name="taleo-date" type="text" placeholder="MM/DD/YYYY" data-expect="re:^\d{2}/\d{2}/\d{4}$" data-type="date"></div>
<div class="actions"><button type="submit" class="btn-submit">Submit Application</button></div>
</form></main>
