<!doctype html>
<!-- GOAL27 matrix fixture: Apply for ML Engineer. Synthetic: modeled on Apply for ML Engineer's public apply form (its field names, label wording and
     widget kinds); our own markup, the fake person's values only. Regenerate with make_fixtures.py. -->
<html lang="en"><head><meta charset="utf-8"><title>Apply for ML Engineer: ML Engineer</title>
<meta property="og:title" content="ML Engineer"><meta property="og:site_name" content="ZZ Test Corp">
<style>body{font:14px sans-serif;padding:20px 24px 120px;max-width:760px}.field,.application-question,._fieldEntry,.iCIMS_InfoField,.row,fieldset{margin:8px 0}
label,legend,._label{display:block;font-weight:600}input[type=text],input:not([type]),input[type=email],input[type=tel],textarea,select{width:340px;padding:4px}
.select__control{border:1px solid #888;width:340px;min-height:28px;position:relative;display:flex}.select__value-container{flex:1;display:flex}
.select__input{border:0;width:100%}.select__menu{position:absolute;background:#fff;border:1px solid #888;width:340px;z-index:9}.select__option{padding:3px 6px;cursor:pointer}
.typeahead{position:relative}.typeahead-results{position:absolute;background:#fff;border:1px solid #888;list-style:none;margin:0;padding:0;width:340px;z-index:9}
.typeahead-results li{padding:3px 6px;cursor:pointer}._yesno button{margin-right:6px;padding:4px 14px}._active{background:#1f5fbf;color:#fff}
.entry{border:1px solid #ccc;padding:8px;margin:8px 0}.select2-selection{display:inline-block;border:1px solid #888;width:340px;padding:4px}</style></head>
<body><main><h1>ML Engineer</h1><p>ZZ Test Corp · Springfield, MO</p>
<form id="application-form" action="#" onsubmit="return false">
<div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" type="text" autocomplete="given-name" required="True" data-expect="Zz" data-type="text"></div>
<div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" type="text" autocomplete="family-name" required="True" data-expect="Testcase" data-type="text"></div>
<div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required="True" data-expect="zz.testcase@example.com" data-type="email"></div>
<h3>Phone</h3>
<div data-w="rs" data-label="Country" data-options="Canada +1|India +91|United States +1" data-id="country" data-expect="United States +1" data-type="dropdown"></div>
<div class="field"><label for="phone">Phone *</label><input id="phone" name="phone" type="tel" required="True" data-expect="555-010-0199" data-type="phone"></div>
<div data-w="typeahead" data-label="Location (City)" data-id="candidate-location" data-options="Springfield, Missouri, United States|Springfield, Illinois, United States|Springfield, Massachusetts, United States" data-expect="Springfield, Missouri, United States" data-type="typeahead"></div>
<div class="field"><label for="resume">Resume/CV</label><input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" data-expect="re:_Resume\.pdf$" data-type="file"></div>
<div class="field"><label for="cover_letter">Cover Letter</label><input type="file" id="cover_letter" name="cover_letter" accept=".pdf,.doc,.docx" data-expect="" data-type="file"></div>
<div data-w="rs" data-label="Are you legally authorized to work in the United States?" data-options="Yes|No" data-id="question_1001" data-required="True" data-expect="Yes" data-type="legal"></div>
<div data-w="rs" data-label="Will you now or in the future require sponsorship for employment visa status (e.g. H-1B visa status)?" data-options="Yes|No" data-id="question_1002" data-required="True" data-expect="No" data-type="legal"></div>
<div class="field"><label for="question_1003">LinkedIn Profile</label><input id="question_1003" name="question_1003" type="text" data-expect="https://www.linkedin.com/in/zz-testcase" data-type="text"></div>
<div class="field"><label for="q_years">How many years of Python experience do you have? *</label><input id="q_years" name="q_years" type="text" required="True" data-expect="5" data-type="resume-answer"></div>
<div data-w="rs" data-label="How did you hear about this job?" data-options="LinkedIn|Company Website|Indeed|Employee Referral|Other" data-id="question_1004" data-async="" data-expect="Company Website" data-type="dropdown"></div>
<h3>Education</h3>
<div data-w="rs" data-label="School" data-options="Lakeview State University|University of Missouri|Missouri State University" data-id="school--0" data-async="" data-expect="Lakeview State University" data-type="dropdown"></div>
<div data-w="rs" data-label="Degree" data-options="High School|Associate&#x27;s Degree|Bachelor&#x27;s Degree|Master&#x27;s Degree|Doctorate" data-id="degree--0" data-expect="Master&#x27;s Degree" data-type="dropdown"></div>
<div data-w="rs" data-label="Discipline" data-options="Computer Science|Data Science|Electrical Engineering|Mathematics" data-id="discipline--0" data-expect="Computer Science" data-type="dropdown"></div>
<h3>Voluntary Self-Identification</h3>
<div data-w="rs" data-label="Gender" data-options="Male|Female|Decline To Self Identify" data-id="gender" data-expect="Male" data-type="eeo"></div>
<div data-w="rs" data-label="Are you Hispanic/Latino?" data-options="Yes|No|Decline To Self Identify" data-id="hispanic_ethnicity" data-expect="No" data-type="eeo"></div>
<div data-w="rs" data-label="Veteran Status" data-options="I am a protected veteran|I am not a protected veteran|I don&#x27;t wish to answer" data-id="veteran_status" data-expect="I am not a protected veteran" data-type="eeo"></div>
<div data-w="rs" data-label="Disability Status" data-options="Yes, I have a disability (or previously had a disability)|No, I do not have a disability|I do not want to answer" data-id="disability_status" data-expect="No, I do not have a disability" data-type="eeo"></div>
<div class="actions"><button type="submit" class="btn-submit">Submit Application</button></div>
</form></main>
<script src="/__sim/ats_sim.js"></script></body></html>
