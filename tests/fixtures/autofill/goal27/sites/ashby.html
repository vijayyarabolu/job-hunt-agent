<!doctype html>
<!-- GOAL27 matrix fixture: Ashby application. Synthetic: modeled on Ashby application's public apply form (its field names, label wording and
     widget kinds); our own markup, the fake person's values only. Regenerate with make_fixtures.py. -->
<html lang="en"><head><meta charset="utf-8"><title>Ashby application: ML Engineer</title>
<meta property="og:title" content="ML Engineer"><meta property="og:site_name" content="ZZ Test Corp">
<style>body{font:14px sans-serif;padding:20px 24px 120px;max-width:760px}.field,.application-question,._fieldEntry,.iCIMS_InfoField,.row,fieldset{margin:8px 0}
label,legend,._label{display:block;font-weight:600}input[type=text],input:not([type]),input[type=email],input[type=tel],textarea,select{width:340px;padding:4px}
.select__control{border:1px solid #888;width:340px;min-height:28px;position:relative;display:flex}.select__value-container{flex:1;display:flex}
.select__input{border:0;width:100%}.select__menu{position:absolute;background:#fff;border:1px solid #888;width:340px;z-index:9}.select__option{padding:3px 6px;cursor:pointer}
.typeahead{position:relative}.typeahead-results{position:absolute;background:#fff;border:1px solid #888;list-style:none;margin:0;padding:0;width:340px;z-index:9}
.typeahead-results li{padding:3px 6px;cursor:pointer}._yesno button{margin-right:6px;padding:4px 14px}._active{background:#1f5fbf;color:#fff}
.entry{border:1px solid #ccc;padding:8px;margin:8px 0}.select2-selection{display:inline-block;border:1px solid #888;width:340px;padding:4px}</style></head>
<body><main><h1>ML Engineer</h1><p>ZZ Test Corp · Springfield, MO</p>
<form id="application-form" action="#" onsubmit="return false">
<div class="_fieldEntry"><label for="_systemfield_name">Name *</label><input id="_systemfield_name" name="_systemfield_name" type="text" required="True" data-expect="Zz Testcase" data-type="text"></div>
<div class="_fieldEntry"><label for="_systemfield_email">Email</label><input id="_systemfield_email" name="_systemfield_email" type="email" data-expect="zz.testcase@example.com" data-type="email"></div>
<div class="_fieldEntry"><label for="phone-ashby">Phone</label><input id="phone-ashby" name="a58c-phone" type="tel" data-expect="555-010-0199" data-type="phone"></div>
<div class="_fieldEntry"><label for="_systemfield_resume">Resume</label><input type="file" id="_systemfield_resume" name="_systemfield_resume" accept=".pdf,.doc,.docx" data-expect="re:_Resume\.pdf$" data-type="file"></div>
<div data-w="typeahead" data-label="Location" data-id="ashby-location" data-options="Springfield, Missouri, United States|Springfield, Illinois, United States|Springfield, Massachusetts, United States" data-field="_fieldEntry" data-expect="Springfield, Missouri, United States" data-type="typeahead"></div>
<div class="_fieldEntry"><label for="q-linkedin">LinkedIn Profile</label><input id="q-linkedin" name="question_2001" type="text" data-expect="https://www.linkedin.com/in/zz-testcase" data-type="text"></div>
<div data-w="yesno" data-label="Are you legally authorized to work in the United States?" data-expect="Yes" data-type="legal"></div>
<div data-w="yesno" data-label="Will you now or in the future require visa sponsorship?" data-expect="No" data-type="legal"></div>
<div data-w="yesno" data-label="Are you willing to relocate?" data-expect="Yes" data-type="yesno"></div>
<div class="_fieldEntry"><label for="why">Why are you interested in this role?</label><textarea id="why" name="question_2002" data-expect="" data-type="textarea"></textarea></div>
<div class="field"><label for="q_years">How many years of Python experience do you have? *</label><input id="q_years" name="q_years" type="text" required="True" data-expect="5" data-type="resume-answer"></div>
<div data-w="rs" data-label="Gender" data-options="Male|Female|Decline To Self Identify" data-id="ashby-gender" data-expect="Male" data-type="eeo"></div>
<div data-w="rs" data-label="Race" data-options="American Indian or Alaskan Native|Asian|Black or African American|Hispanic or Latino|White|Two or More Races|Decline To Self Identify" data-id="ashby-race" data-expect="Asian" data-type="eeo"></div>
<div class="actions"><button type="submit" class="btn-submit">Submit Application</button></div>
</form></main>
<script src="/__sim/ats_sim.js"></script></body></html>
