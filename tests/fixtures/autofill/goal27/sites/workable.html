<!doctype html>
<!-- GOAL27 matrix fixture: Workable. Synthetic: modeled on Workable's public apply form (its field names, label wording and
     widget kinds); our own markup, the fake person's values only. Regenerate with make_fixtures.py. -->
<html lang="en"><head><meta charset="utf-8"><title>Workable: ML Engineer</title>
<meta property="og:title" content="ML Engineer"><meta property="og:site_name" content="ZZ Test Corp">
<style>body{font:14px sans-serif;padding:20px 24px 120px;max-width:760px}.field,.application-question,._fieldEntry,.iCIMS_InfoField,.row,fieldset{margin:8px 0}
label,legend,._label{display:block;font-weight:600}input[type=text],input:not([type]),input[type=email],input[type=tel],textarea,select{width:340px;padding:4px}
.select__control{border:1px solid #888;width:340px;min-height:28px;position:relative;display:flex}.select__value-container{flex:1;display:flex}
.select__input{border:0;width:100%}.select__menu{position:absolute;background:#fff;border:1px solid #888;width:340px;z-index:9}.select__option{padding:3px 6px;cursor:pointer}
.typeahead{position:relative}.typeahead-results{position:absolute;background:#fff;border:1px solid #888;list-style:none;margin:0;padding:0;width:340px;z-index:9}
.typeahead-results li{padding:3px 6px;cursor:pointer}._yesno button{margin-right:6px;padding:4px 14px}._active{background:#1f5fbf;color:#fff}
.entry{border:1px solid #ccc;padding:8px;margin:8px 0}.select2-selection{display:inline-block;border:1px solid #888;width:340px;padding:4px}</style></head>
<body><main><h1>ML Engineer</h1><p>ZZ Test Corp · Springfield, MO</p>
<form id="application-form" action="#" onsubmit="return false">
<h3>Personal information</h3>
<div class="field"><label for="firstname">First name</label><input id="firstname" name="firstname" type="text" data-expect="Zz" data-type="text"></div>
<div class="field"><label for="lastname">Last name</label><input id="lastname" name="lastname" type="text" data-expect="Testcase" data-type="text"></div>
<div class="field"><label for="wk-email">Email</label><input id="wk-email" name="email" type="email" data-expect="zz.testcase@example.com" data-type="email"></div>
<div data-w="iti" data-label="Phone" data-id="wk-phone" data-expect="5550100199" data-type="phone"></div>
<div class="field"><label for="wk-address">Address</label><input id="wk-address" name="address" type="text" data-expect="123 Main St" data-type="text"></div>
<h3>Profile</h3>
<div class="field"><label for="wk-resume">Resume</label><input type="file" id="wk-resume" name="resume" accept=".pdf,.doc,.docx" data-expect="re:_Resume\.pdf$" data-type="file"></div>
<div class="field"><label for="wk-summary">Summary</label><textarea id="wk-summary" name="summary" data-expect="re:^ML engineer who ships" data-type="textarea"></textarea></div>
<h3>Work Experience</h3><div data-w="repeater" data-add="Add another job" data-entry="entry job" data-start="1"><template><div class="field"><label for="title-{i}">Job Title</label><input id="title-{i}" name="jobs[{i}][title]"></div><div class="field"><label for="company-{i}">Company</label><input id="company-{i}" name="jobs[{i}][company]"></div><div class="field"><label for="sm-{i}">Start Month</label><select id="sm-{i}" name="jobs[{i}][start_month]"><option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div><div class="field"><label for="sy-{i}">Start Year</label><select id="sy-{i}" name="jobs[{i}][start_year]"><option value="">Year</option><option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option><option value="2023">2023</option><option value="2022">2022</option><option value="2021">2021</option><option value="2020">2020</option><option value="2019">2019</option><option value="2018">2018</option><option value="2017">2017</option><option value="2016">2016</option><option value="2015">2015</option><option value="2014">2014</option><option value="2013">2013</option><option value="2012">2012</option><option value="2011">2011</option><option value="2010">2010</option></select></div><div class="field"><label for="em-{i}">End Month</label><select id="em-{i}" name="jobs[{i}][end_month]"><option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div><div class="field"><label for="ey-{i}">End Year</label><select id="ey-{i}" name="jobs[{i}][end_year]"><option value="">Year</option><option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option><option value="2023">2023</option><option value="2022">2022</option><option value="2021">2021</option><option value="2020">2020</option><option value="2019">2019</option><option value="2018">2018</option><option value="2017">2017</option><option value="2016">2016</option><option value="2015">2015</option><option value="2014">2014</option><option value="2013">2013</option><option value="2012">2012</option><option value="2011">2011</option><option value="2010">2010</option></select></div><div class="field"><label><input type="checkbox" id="cur-{i}" name="jobs[{i}][current]"> I currently work here</label></div><div class="field"><label for="desc-{i}">Description</label><textarea id="desc-{i}" name="jobs[{i}][description]"></textarea></div></template></div><div hidden data-check-jobs data-type="repeater"></div>
<h3>Education</h3><div data-w="repeater" data-add="Add another school" data-entry="entry school" data-start="1"><template><div class="field"><label for="school-{i}">School</label><input id="school-{i}" name="educations[{i}][school]"></div><div class="field"><label for="degree-{i}">Degree</label><select id="degree-{i}" name="educations[{i}][degree]"><option value="">Select</option><option>High School</option><option>Associate's Degree</option><option>Bachelor's Degree</option><option>Master's Degree</option><option>Doctorate</option></select></div><div class="field"><label for="major-{i}">Field of Study</label><input id="major-{i}" name="educations[{i}][field]"></div><div class="field"><label for="gy-{i}">End Year</label><select id="gy-{i}" name="educations[{i}][end_year]"><option value="">Year</option><option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option><option value="2023">2023</option><option value="2022">2022</option><option value="2021">2021</option><option value="2020">2020</option><option value="2019">2019</option><option value="2018">2018</option><option value="2017">2017</option><option value="2016">2016</option><option value="2015">2015</option><option value="2014">2014</option><option value="2013">2013</option><option value="2012">2012</option><option value="2011">2011</option><option value="2010">2010</option></select></div></template></div><div hidden data-check-schools data-type="repeater"></div>
<h3>Details</h3>
<div class="field"><label for="ca_10626">Expected salary</label><input id="ca_10626" name="ca_10626" type="text" data-expect="150000" data-type="text"></div>
<fieldset class="field" data-expect="Yes" data-type="legal"><legend>Are you eligible to work in the country you are applying?</legend><label><input type="radio" name="ca_10628" value="Yes"> Yes</label><label><input type="radio" name="ca_10628" value="No"> No</label></fieldset>
<div class="actions"><button type="submit" class="btn-submit">Submit Application</button></div>
</form></main>
<script src="/__sim/ats_sim.js"></script></body></html>
