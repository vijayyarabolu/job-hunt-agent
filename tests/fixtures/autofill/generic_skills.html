<!doctype html>
<!-- GOAL23 test fixture: an application form on a site with no adapter (generic), with a Skills typeahead in the
     common combobox shape (type, a list of matches appears, a click adds a chip; free text is not accepted). -->
<html lang="en"><head><meta charset="utf-8"><title>Apply</title>
<style>body{font:14px sans-serif;padding:20px}.field{margin:10px 0}label{display:block;font-weight:600}
[role=listbox]{border:1px solid #888;max-width:320px}[role=option]{padding:4px 8px;cursor:pointer}.chip{display:inline-block;background:#def;margin:2px;padding:1px 6px}</style></head>
<body><h1>Apply: AI Engineer</h1>
<form id="apply" onsubmit="return false">
<div class="field"><label for="fn">First name *</label><input id="fn" name="first_name" required></div>
<div class="field"><label for="em">Email *</label><input id="em" name="email" type="email" required></div>
<div class="field"><label for="sk">Skills</label><div id="chips"><span class="chip">LangChain</span></div>
  <input id="sk" role="combobox" aria-autocomplete="list" aria-controls="sk-list" aria-expanded="false" autocomplete="off">
  <div id="sk-list" role="listbox" hidden></div></div>
<div class="field"><label for="sd">Earliest start date *</label><input id="sd" name="start_date" placeholder="MM/DD/YYYY" required></div>
<div class="field"><label for="da">Date available</label><input id="da" name="date_available" type="date"></div>
<div class="field"><label for="nt">When could you start?</label><select id="nt" name="when_start"><option value="">Select…</option>
  <option>Immediately</option><option>Less than 1 month</option><option>1-3 months</option><option>More than 3 months</option></select></div>
<div class="field"><label for="cv">Resume *</label><input id="cv" name="resume" type="file" accept=".pdf"></div>
<button type="submit" id="send">Submit application</button>
</form>
<script>
const ALL = ["Python", "PyTorch", "LangChain", "Amazon Web Services (AWS)", "AWS Glue", "Amazon S3",
  "Retrieval Augmented Generation (RAG)", "PySpark", "Java", "JavaScript"];
const input = document.getElementById("sk"), list = document.getElementById("sk-list"), chips = document.getElementById("chips");
window.__skills = [];
window.__submitted = 0;
document.getElementById("send").addEventListener("click", () => window.__submitted++);
input.addEventListener("input", () => {
  const q = input.value.trim().toLowerCase();
  list.replaceChildren(...ALL.filter((s) => q && s.toLowerCase().includes(q) && !window.__skills.includes(s)).map((s) => {
    const o = document.createElement("div"); o.setAttribute("role", "option"); o.textContent = s;
    o.addEventListener("click", () => { window.__skills.push(s); const c = document.createElement("span"); c.className = "chip"; c.textContent = s; chips.append(c);
      input.value = ""; list.hidden = true; input.setAttribute("aria-expanded", "false"); });
    return o; }));
  list.hidden = !list.children.length;
  input.setAttribute("aria-expanded", String(!list.hidden));
});
input.addEventListener("keydown", (e) => { if (e.key === "Escape") { list.hidden = true; } });
</script></body></html>
