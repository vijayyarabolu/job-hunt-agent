ntly.</li><li>Must be willing to work outside in all weather.</li><li>Experience with Standup and sit-down forklift. (Must be able to pass certification)</li><li>SAP Experience a plus&nbsp;</li></ul><p><strong>Work Environment:</strong></p><ul><li>This job operates in a manufacturing environment. While performing duties on this job you are frequently exposed to work near moving mechanical parts, electrical current and chemicals. The noise level in the environment is usually moderate. Some outside work required where you will be exposed to heat, cold, wind and precipitation.</li></ul><p><strong>Physical Demands:</strong></p><ul><li>Required to sit, stand, walk, and lift for extended periods of time. The position may also require bending, stooping, kneeling, and reaching.</li></ul><p><br/><strong>Employee Benefits:</strong></p><ul><li>Medical Insurance (heavily subsidized by the Company)</li><li>Dental Insurance</li><li>Company paid Vision Insurance, $50,000 life insurance and Short and Long-Term Disability</li><li>Paid time Off</li><li>Education Reimbursement (must be approved by manager)</li><li>401(k) Plan where it matches dollar-for-dollar up to 4% of compensation; 100% vested immediately.</li><li>Company Long Term Incentive Plan based on the profitability of the Company; 100% vested after 6 years on a graded scale)</li></ul><p><br/><strong>Benefits:</strong></p><ul><li>401(k)</li><li>401(k) matching</li><li>Dental insurance</li><li>Health insurance</li><li>Life insurance</li><li>Paid time off</li><li>Vision insurance</li><li>Work Location: In person</li></ul><p><strong>Who We Are:</strong></p><p><br/><em>Bitzer Us Inc. is a leading manufacturer of key components used in commercial and industrial refrigeration and air conditioning systems. These key components include compressors, pressure vessels such as condensers and evaporators, compressor packages, and condensing units. Other products include waste heat-to-power equipment that converts excess heat to low-cost
