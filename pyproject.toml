[project]
name = "job-hunt-agent"
version = "1.0.0"
description = "Local job search agent: fresh AI/ML postings from company ATS boards, ranked by fit, with an application tracker"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["python-docx>=1.2,<2", "pyyaml>=6.0,<7", "openpyxl>=3.1,<4", "anthropic>=1.0,<2"]

[project.scripts]
job-hunt-agent = "job_hunt_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["job_hunt_agent*"]

[tool.setuptools.package-data]
job_hunt_agent = ["schema.sql", "static/*", "static/**/*", "demo/*"]
